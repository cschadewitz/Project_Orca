# Workspace packages. Replaces the npm `workspaces` field in package.json.
packages:
  - "packages/*"
  # Build/lint tooling that needs its own dependency closure, kept out of the TS build.
  - "tools/*"

# pnpm runs no dependency lifecycle scripts by default. esbuild (pulled in by
# tsx) needs its postinstall to place the platform binary; electron's postinstall
# downloads the Electron binary (CI sets ELECTRON_SKIP_BINARY_DOWNLOAD=1, since it
# never launches the app). Allow just those two.
allowBuilds:
  esbuild: true
  electron: true
