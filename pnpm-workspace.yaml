# Workspace packages. Replaces the npm `workspaces` field in package.json.
packages:
  - "packages/*"
  # Build/lint tooling that needs its own dependency closure, kept out of the TS build.
  - "tools/*"

# pnpm runs no dependency lifecycle scripts by default. esbuild (pulled in by
# tsx, and declared by packages/app for the daemon bundle) needs its postinstall to place
# the platform binary; electron's postinstall downloads the Electron binary (CI sets
# ELECTRON_SKIP_BINARY_DOWNLOAD=1, since it never launches the app; .github/workflows/desktop.yml
# deliberately does not, since packaging needs it). Allow just those two. The IBM Plex packages
# (the font sources tools/font-build subsets) ship a postinstall that reports to IBM's telemetry
# service; it is denied explicitly rather than left to the default, so the answer is recorded here.
# electron-winstaller comes in with electron-builder and its postinstall fetches Squirrel.Windows;
# the Windows artifact is an NSIS installer, so nothing ever asks it for a Squirrel package.
allowBuilds:
  esbuild: true
  electron: true
  "@ibm/plex-sans": false
  "@ibm/plex-mono": false
  electron-winstaller: false

patchedDependencies:
  "@agentclientprotocol/sdk@1.8.0": patches/@agentclientprotocol__sdk@1.8.0.patch

# Security overrides. Remove each one once every parent in the lockfile already resolves a
# patched version on its own.
# - minimatch < 11.0.1 (GHSA-g3hv-75wg-m249, ReDoS via globparts amplification): eslint and
#   typescript-eslint moved to 11 themselves, but app-builder-lib (^10.2.5) and
#   @electron/universal (^9) have not. 11 only drops old Node from engines; the API they call
#   (named `minimatch` export) is unchanged since 9.
overrides:
  "minimatch@>=7.0.0 <11.0.1": "^11.0.9"
