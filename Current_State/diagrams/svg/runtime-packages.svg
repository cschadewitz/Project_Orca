<text x="32" y="820" font-size="19" font-weight="bold">Labeled interfaces and movements</text>
<rect x="30" y="842" width="1120" height="62" rx="5" fill="#f5f7fa"/>
<text x="43" y="865" font-size="16" fill="#794b98">1. N2 → N1: domain contracts [dependency; source claim E1]</text>
<text x="43" y="888" font-size="13">@orca/store: persistence ports → @orca/core: domain and pure algorithms</text>
<rect x="30" y="910" width="1120" height="62" rx="5" fill="#f5f7fa"/>
<text x="43" y="933" font-size="16" fill="#794b98">2. N3 → N1: agent configuration contracts [dependency; source claim E1]</text>
<text x="43" y="956" font-size="13">@orca/agents: hosts and sessions → @orca/core: domain and pure algorithms</text>
<rect x="30" y="978" width="1120" height="62" rx="5" fill="#f5f7fa"/>
<text x="43" y="1001" font-size="16" fill="#794b98">3. N4 → N2: persistence ports [dependency; source claim E1]</text>
<text x="43" y="1024" font-size="13">@orca/engine: orchestration → @orca/store: persistence ports</text>
<rect x="30" y="1046" width="1120" height="62" rx="5" fill="#f5f7fa"/>
<text x="43" y="1069" font-size="16" fill="#794b98">4. N4 → N3: agent/host invocation [dependency; source claim E1]</text>
<text x="43" y="1092" font-size="13">@orca/engine: orchestration → @orca/agents: hosts and sessions</text>
<rect x="30" y="1114" width="1120" height="62" rx="5" fill="#f5f7fa"/>
<text x="43" y="1137" font-size="16" fill="#794b98">5. N4 → N1: domain and algorithms [dependency; source claim E1]</text>
<text x="43" y="1160" font-size="13">@orca/engine: orchestration → @orca/core: domain and pure algorithms</text>
<rect x="30" y="1182" width="1120" height="62" rx="5" fill="#f5f7fa"/>
<text x="43" y="1205" font-size="16" fill="#794b98">6. N5 → N1: browser-safe schemas [dependency; source claim E2]</text>
<text x="43" y="1228" font-size="13">@orca/protocol: wire schemas → @orca/core: domain and pure algorithms</text>
<rect x="30" y="1250" width="1120" height="62" rx="5" fill="#f5f7fa"/>
<text x="43" y="1273" font-size="16" fill="#794b98">7. N6 → N5: method envelopes and views [dependency; source claim E2]</text>
<text x="43" y="1296" font-size="13">@orca/daemon: wire adaptation → @orca/protocol: wire schemas</text>
<rect x="30" y="1318" width="1120" height="62" rx="5" fill="#f5f7fa"/>
<text x="43" y="1341" font-size="16" fill="#794b98">8. N6 → N4: orchestration controls; also store/core/agents [dependency; source claim E2]</text>
<text x="43" y="1364" font-size="13">@orca/daemon: wire adaptation → @orca/engine: orchestration</text>
<a href="../notation.md"><text x="32" y="1414" font-size="14" fill="#1559a1">Legend: blue calls · purple dashed dependencies · green dotted messages · brown data · gray containment · red declared</text></a>
<text x="32" y="1441" font-size="13">Outer frame = view ownership; external and process nodes retain their labeled boundaries. Not a deployment verification.</text>
