<text x="32" y="720" font-size="19" font-weight="bold">Labeled interfaces and movements</text>
<rect x="30" y="742" width="1120" height="62" rx="5" fill="#f5f7fa"/>
<text x="43" y="765" font-size="16" fill="#21754a">1. N1 → N2: invalidate affected projections [message; source claim E1]</text>
<text x="43" y="788" font-size="13">plan.changed invalidations → Plan feed + area revisions</text>
<rect x="30" y="810" width="1120" height="62" rx="5" fill="#f5f7fa"/>
<text x="43" y="833" font-size="16" fill="#1559a1">2. N2 → N5: reread current span / journal [call; source claim E1]</text>
<text x="43" y="856" font-size="13">Plan feed + area revisions → Plan read/write bridge</text>
<rect x="30" y="878" width="1120" height="62" rx="5" fill="#f5f7fa"/>
<text x="43" y="901" font-size="16" fill="#975523">3. N2 → N3: supply derived daemon views [data; source claim E2]</text>
<text x="43" y="924" font-size="13">Plan feed + area revisions → Schedule / dependency / risk / decision modes</text>
<rect x="30" y="946" width="1120" height="62" rx="5" fill="#f5f7fa"/>
<text x="43" y="969" font-size="16" fill="#1559a1">4. N3 → N4: select object / explain reasons [call; source claim E2]</text>
<text x="43" y="992" font-size="13">Schedule / dependency / risk / decision modes → Journal + dock inspector</text>
<rect x="30" y="1014" width="1120" height="62" rx="5" fill="#f5f7fa"/>
<text x="43" y="1037" font-size="16" fill="#1559a1">5. N3 → N5: waive, decide, reopen, update risk [call; source claim E3]</text>
<text x="43" y="1060" font-size="13">Schedule / dependency / risk / decision modes → Plan read/write bridge</text>
<a href="../notation.md"><text x="32" y="1110" font-size="14" fill="#1559a1">Legend: blue calls · purple dashed dependencies · green dotted messages · brown data · gray containment · red declared</text></a>
<text x="32" y="1137" font-size="13">Outer frame = view ownership; external and process nodes retain their labeled boundaries. Not a deployment verification.</text>
