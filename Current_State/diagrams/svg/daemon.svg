<rect x="30" y="742" width="1120" height="62" rx="5" fill="#f5f7fa"/>
<text x="43" y="765" font-size="16" fill="#1559a1">1. N1 → N2: dispatch validated envelope [call; source claim E1]</text>
<text x="43" y="788" font-size="13">HTTP / WebSocket transport → Method table + maintenance</text>
<rect x="30" y="810" width="1120" height="62" rx="5" fill="#f5f7fa"/>
<text x="43" y="833" font-size="16" fill="#1559a1">2. N2 → N3: read operations [call; source claim E1]</text>
<text x="43" y="856" font-size="13">Method table + maintenance → ReadModel / PlanModel / AgentModel</text>
<rect x="30" y="878" width="1120" height="62" rx="5" fill="#f5f7fa"/>
<text x="43" y="901" font-size="16" fill="#1559a1">3. N2 → N4: control / document operations [call; source claim E2]</text>
<text x="43" y="924" font-size="13">Method table + maintenance → ControlModel / PlanControlModel / ConfigModel</text>
<rect x="30" y="946" width="1120" height="62" rx="5" fill="#f5f7fa"/>
<text x="43" y="969" font-size="16" fill="#1559a1">4. N3 → N5: read and project state [call; source claim E2]</text>
<text x="43" y="992" font-size="13">ReadModel / PlanModel / AgentModel → Orchestrator / stores / registries</text>
<rect x="30" y="1014" width="1120" height="62" rx="5" fill="#f5f7fa"/>
<text x="43" y="1037" font-size="16" fill="#1559a1">5. N4 → N5: invoke owning service [call; source claim E2]</text>
<text x="43" y="1060" font-size="13">ControlModel / PlanControlModel / ConfigModel → Orchestrator / stores / registries</text>
<a href="../notation.md"><text x="32" y="1110" font-size="14" fill="#1559a1">Legend: blue calls · purple dashed dependencies · green dotted messages · brown data · gray containment · red declared</text></a>
<text x="32" y="1137" font-size="13">Outer frame = view ownership; external and process nodes retain their labeled boundaries. Not a deployment verification.</text>
