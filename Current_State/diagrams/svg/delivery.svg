<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="1107" viewBox="0 0 1180 1107" role="img" aria-labelledby="title description">
<title id="title">Release, deployment and CI</title>
<desc id="description">Static architecture view. Root scripts, .github workflows, app packaging and tools/deploy. Numbered arrows have full labels and source evidence in the table and linked specification.</desc>
<defs>
<marker id="arrow-call" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1559a1"/></marker>
<marker id="arrow-dependency" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#794b98"/></marker>
<marker id="arrow-message" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#21754a"/></marker>
<marker id="arrow-data" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#975523"/></marker>
<marker id="arrow-containment" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#656b73"/></marker>
<marker id="arrow-declared" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#a73d3d"/></marker>
</defs>
<rect width="100%" height="100%" fill="#fff"/>
<g font-family="sans-serif" fill="#17212c">
<text x="32" y="40" font-size="25" font-weight="bold">Release, deployment and CI</text>
<text x="32" y="70" font-size="16">Ownership view: repository tooling • infrastructure • static inspection</text>
<a href="../../architecture/delivery.md"><text x="32" y="99" font-size="15" fill="#1559a1">Architecture specification, responsibilities and source evidence ↗</text></a>
<rect x="25" y="119" width="1130" height="546" rx="12" fill="#f9fafc" stroke="#9aa6b3"/>
<rect id="node-1" x="50" y="150" width="645" height="70" rx="9" fill="#fff" stroke="#526171" stroke-width="1"/>
<text x="66" y="170" font-size="12" fill="#475666">N1 · DATA</text>
<text x="66" y="193" font-size="16">Source commit + lockfile + compatibility metadata</text>
<rect id="node-2" x="50" y="250" width="645" height="70" rx="9" fill="#e9f0ff" stroke="#526171" stroke-width="2"/>
<text x="66" y="270" font-size="12" fill="#475666">N2 · PROCESS</text>
<text x="66" y="293" font-size="16">CI / release preparation and publication</text>
<rect id="node-3" x="50" y="350" width="645" height="70" rx="9" fill="#fff" stroke="#526171" stroke-width="1"/>
<text x="66" y="370" font-size="12" fill="#475666">N3 · DATA</text>
<text x="66" y="393" font-size="16">Desktop artifacts + daemon bundle</text>
<rect id="node-4" x="50" y="450" width="645" height="70" rx="2" fill="#eff7ed" stroke="#526171" stroke-width="1"/>
<text x="66" y="470" font-size="12" fill="#475666">N4 · STORAGE</text>
<text x="66" y="493" font-size="16">Managed daemon release directory</text>
<rect id="node-5" x="50" y="550" width="645" height="70" rx="9" fill="#fff2e8" stroke="#526171" stroke-width="1"/>
<text x="66" y="570" font-size="12" fill="#475666">N5 · EXTERNAL</text>
<text x="66" y="593" font-size="16">systemd + current symlink + pending journal</text>
<path d="M695,178 H783 V292 H698" fill="none" stroke="#794b98" stroke-width="2" stroke-dasharray="9 5" marker-end="url(#arrow-dependency)"/>
<circle cx="783" cy="235.0" r="13" fill="white" stroke="#794b98"/><text x="783" y="240.0" text-anchor="middle" font-size="13" fill="#794b98">1</text>
<path d="M695,278 H826 V392 H698" fill="none" stroke="#975523" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow-data)"/>
<circle cx="826" cy="335.0" r="13" fill="white" stroke="#975523"/><text x="826" y="340.0" text-anchor="middle" font-size="13" fill="#975523">2</text>
<path d="M695,178 H869 V492 H698" fill="none" stroke="#975523" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow-data)"/>
<circle cx="869" cy="335.0" r="13" fill="white" stroke="#975523"/><text x="869" y="340.0" text-anchor="middle" font-size="13" fill="#975523">3</text>
<path d="M695,478 H912 V592 H698" fill="none" stroke="#1559a1" stroke-width="2" stroke-dasharray="" marker-end="url(#arrow-call)"/>
<circle cx="912" cy="535.0" r="13" fill="white" stroke="#1559a1"/><text x="912" y="540.0" text-anchor="middle" font-size="13" fill="#1559a1">4</text>
<text x="32" y="720" font-size="19" font-weight="bold">Labeled interfaces and movements</text>
<rect x="30" y="742" width="1120" height="62" rx="5" fill="#f5f7fa"/>
<text x="43" y="765" font-size="16" fill="#794b98">1. N1 → N2: configured checks/build/package [dependency; source claim E1]</text>
<text x="43" y="788" font-size="13">Source commit + lockfile + compatibility metadata → CI / release preparation and publication</text>
<rect x="30" y="810" width="1120" height="62" rx="5" fill="#f5f7fa"/>
<text x="43" y="833" font-size="16" fill="#975523">2. N2 → N3: publish matched release assets [data; source claim E4]</text>
<text x="43" y="856" font-size="13">CI / release preparation and publication → Desktop artifacts + daemon bundle</text>
<rect x="30" y="878" width="1120" height="62" rx="5" fill="#f5f7fa"/>
<text x="43" y="901" font-size="16" fill="#975523">3. N1 → N4: stage verified managed release [data; source claim E2]</text>
<text x="43" y="924" font-size="13">Source commit + lockfile + compatibility metadata → Managed daemon release directory</text>
<rect x="30" y="946" width="1120" height="62" rx="5" fill="#f5f7fa"/>
<text x="43" y="969" font-size="16" fill="#1559a1">4. N4 → N5: guarded activate / recover [call; source claim E2]</text>
<text x="43" y="992" font-size="13">Managed daemon release directory → systemd + current symlink + pending journal</text>
<a href="../notation.md"><text x="32" y="1042" font-size="14" fill="#1559a1">Legend: blue calls · purple dashed dependencies · green dotted messages · brown data · gray containment · red declared</text></a>
<text x="32" y="1069" font-size="13">Outer frame = view ownership; external and process nodes retain their labeled boundaries. Not a deployment verification.</text>
</g>
</svg>
