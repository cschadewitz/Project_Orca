<text x="43" y="1169" font-size="16" fill="#794b98">4. N2 → N3: engine ports; also agents/store/core [dependency; source claim E3]</text>
<text x="43" y="1192" font-size="13">@orca/integrations: ACP / Kepler / T3 / JEV → @orca/engine + daemon runtime spine</text>
