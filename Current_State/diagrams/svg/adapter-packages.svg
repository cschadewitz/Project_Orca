<text x="43" y="1237" font-size="16" fill="#794b98">5. N4 → N5: runtime wire/design imports [dependency; source claim E2]</text>
<text x="43" y="1260" font-size="13">@orca/app: desktop processes → @orca/protocol + design</text>
