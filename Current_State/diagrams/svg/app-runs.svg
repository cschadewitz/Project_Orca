<circle cx="783" cy="235.0" r="13" fill="white" stroke="#1559a1"/><text x="783" y="240.0" text-anchor="middle" font-size="13" fill="#1559a1">1</text>
<path d="M695,278 H826 V392 H698" fill="none" stroke="#975523" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow-data)"/>
<circle cx="826" cy="335.0" r="13" fill="white" stroke="#975523"/><text x="826" y="340.0" text-anchor="middle" font-size="13" fill="#975523">2</text>
<path d="M695,378 H869 V492 H698" fill="none" stroke="#975523" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow-data)"/>
<circle cx="869" cy="435.0" r="13" fill="white" stroke="#975523"/><text x="869" y="440.0" text-anchor="middle" font-size="13" fill="#975523">3</text>
<path d="M695,178 H912 V592 H698" fill="none" stroke="#1559a1" stroke-width="2" stroke-dasharray="" marker-end="url(#arrow-call)"/>
<circle cx="912" cy="385.0" r="13" fill="white" stroke="#1559a1"/><text x="912" y="390.0" text-anchor="middle" font-size="13" fill="#1559a1">4</text>
<text x="32" y="720" font-size="19" font-weight="bold">Labeled interfaces and movements</text>
<rect x="30" y="742" width="1120" height="62" rx="5" fill="#f5f7fa"/>
<text x="43" y="765" font-size="16" fill="#1559a1">1. N1 → N2: read selected run/event pages [call; source claim E1]</text>
<text x="43" y="788" font-size="13">Run/tree/timeline selection → Snapshot + notification hooks</text>
<rect x="30" y="810" width="1120" height="62" rx="5" fill="#f5f7fa"/>
<text x="43" y="833" font-size="16" fill="#975523">2. N2 → N3: fold coalesced updates [data; source claim E2]</text>
<text x="43" y="856" font-size="13">Snapshot + notification hooks → Step line/tool buffer</text>
<rect x="30" y="878" width="1120" height="62" rx="5" fill="#f5f7fa"/>
<text x="43" y="901" font-size="16" fill="#975523">3. N3 → N4: render visible rows / follow [data; source claim E2]</text>
<text x="43" y="924" font-size="13">Step line/tool buffer → VirtualList run/timeline/output views</text>
<rect x="30" y="946" width="1120" height="62" rx="5" fill="#f5f7fa"/>
<text x="43" y="969" font-size="16" fill="#1559a1">4. N1 → N5: open artifact id/name/version [call; source claim E3]</text>
<text x="43" y="992" font-size="13">Run/tree/timeline selection → Artifact body/version panel</text>
<a href="../notation.md"><text x="32" y="1042" font-size="14" fill="#1559a1">Legend: blue calls · purple dashed dependencies · green dotted messages · brown data · gray containment · red declared</text></a>
<text x="32" y="1069" font-size="13">Outer frame = view ownership; external and process nodes retain their labeled boundaries. Not a deployment verification.</text>
