<text x="43" y="665" font-size="16" fill="#21754a">1. N1 → N2: named request / BridgeResult [message; source claim E3]</text>
<text x="43" y="688" font-size="13">Renderer typed bridge caller → CJS preload + main handlers</text>
<rect x="30" y="710" width="1120" height="62" rx="5" fill="#f5f7fa"/>
<text x="43" y="733" font-size="16" fill="#1559a1">2. N2 → N3: invoke typed client method [call; source claim E1]</text>
<text x="43" y="756" font-size="13">CJS preload + main handlers → DaemonClient / DaemonSubscription</text>
<rect x="30" y="778" width="1120" height="62" rx="5" fill="#f5f7fa"/>
<text x="43" y="801" font-size="16" fill="#21754a">3. N3 → N4: schema-validated wire exchange [message; source claim E1]</text>
<text x="43" y="824" font-size="13">DaemonClient / DaemonSubscription → HTTP /rpc + WS /socket</text>
<rect x="30" y="846" width="1120" height="62" rx="5" fill="#f5f7fa"/>
<text x="43" y="869" font-size="16" fill="#21754a">4. N4 → N1: parsed notifications via IPC [message; source claim E2]</text>
<text x="43" y="892" font-size="13">HTTP /rpc + WS /socket → Renderer typed bridge caller</text>
