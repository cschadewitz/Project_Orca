<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="1107" viewBox="0 0 1180 1107" role="img" aria-labelledby="title description">
<title id="title">@orca/agents</title>
<desc id="description">Static architecture view. Agent registry, host processes, ACP sessions and permissions. Numbered arrows have full labels and source evidence in the table and linked specification.</desc>
<defs>
<marker id="arrow-call" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1559a1"/></marker>
<marker id="arrow-dependency" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#794b98"/></marker>
<marker id="arrow-message" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#21754a"/></marker>
<marker id="arrow-data" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#975523"/></marker>
<marker id="arrow-containment" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#656b73"/></marker>
<marker id="arrow-declared" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#a73d3d"/></marker>
</defs>
<rect width="100%" height="100%" fill="#fff"/>
<g font-family="sans-serif" fill="#17212c">
<text x="32" y="40" font-size="25" font-weight="bold">@orca/agents</text>
<text x="32" y="70" font-size="16">Ownership view: packages/agents • package • static inspection</text>
<a href="../../architecture/agents.md"><text x="32" y="99" font-size="15" fill="#1559a1">Architecture specification, responsibilities and source evidence ↗</text></a>
<rect x="25" y="119" width="1130" height="546" rx="12" fill="#f9fafc" stroke="#9aa6b3"/>
<rect id="node-1" x="50" y="150" width="645" height="70" rx="9" fill="#fff" stroke="#526171" stroke-width="1"/>
<text x="66" y="170" font-size="12" fill="#475666">N1 · COMPONENT</text>
<text x="66" y="193" font-size="16">AgentRegistry + health</text>
<rect id="node-2" x="50" y="250" width="645" height="70" rx="9" fill="#fff" stroke="#526171" stroke-width="1"/>
<text x="66" y="270" font-size="12" fill="#475666">N2 · COMPONENT</text>
<text x="66" y="293" font-size="16">LocalHost / SshHost</text>
<rect id="node-3" x="50" y="350" width="645" height="70" rx="9" fill="#fff" stroke="#526171" stroke-width="1"/>
<text x="66" y="370" font-size="12" fill="#475666">N3 · COMPONENT</text>
<text x="66" y="393" font-size="16">ACP AgentSession</text>
<rect id="node-4" x="50" y="450" width="645" height="70" rx="9" fill="#fff" stroke="#526171" stroke-width="1"/>
<text x="66" y="470" font-size="12" fill="#475666">N4 · COMPONENT</text>
<text x="66" y="493" font-size="16">Permission evaluation</text>
<rect id="node-5" x="50" y="550" width="645" height="70" rx="9" fill="#fff2e8" stroke="#526171" stroke-width="1"/>
<text x="66" y="570" font-size="12" fill="#475666">N5 · EXTERNAL</text>
<text x="66" y="593" font-size="16">External ACP binary</text>
<path d="M695,378 H783 V192 H698" fill="none" stroke="#794b98" stroke-width="2" stroke-dasharray="9 5" marker-end="url(#arrow-dependency)"/>
<circle cx="783" cy="285.0" r="13" fill="white" stroke="#794b98"/><text x="783" y="290.0" text-anchor="middle" font-size="13" fill="#794b98">1</text>
<path d="M695,378 H826 V292 H698" fill="none" stroke="#1559a1" stroke-width="2" stroke-dasharray="" marker-end="url(#arrow-call)"/>
<circle cx="826" cy="335.0" r="13" fill="white" stroke="#1559a1"/><text x="826" y="340.0" text-anchor="middle" font-size="13" fill="#1559a1">2</text>
<path d="M695,378 H869 V492 H698" fill="none" stroke="#1559a1" stroke-width="2" stroke-dasharray="" marker-end="url(#arrow-call)"/>
<circle cx="869" cy="435.0" r="13" fill="white" stroke="#1559a1"/><text x="869" y="440.0" text-anchor="middle" font-size="13" fill="#1559a1">3</text>
<path d="M695,278 H912 V592 H698" fill="none" stroke="#21754a" stroke-width="2" stroke-dasharray="3 5" marker-end="url(#arrow-message)"/>
<circle cx="912" cy="435.0" r="13" fill="white" stroke="#21754a"/><text x="912" y="440.0" text-anchor="middle" font-size="13" fill="#21754a">4</text>
<text x="32" y="720" font-size="19" font-weight="bold">Labeled interfaces and movements</text>
<rect x="30" y="742" width="1120" height="62" rx="5" fill="#f5f7fa"/>
<text x="43" y="765" font-size="16" fill="#794b98">1. N3 → N1: resolve configured agent and host [dependency; source claim E1]</text>
<text x="43" y="788" font-size="13">ACP AgentSession → AgentRegistry + health</text>
<rect x="30" y="810" width="1120" height="62" rx="5" fill="#f5f7fa"/>
<text x="43" y="833" font-size="16" fill="#1559a1">2. N3 → N2: spawn process / access files [call; source claim E2]</text>
<text x="43" y="856" font-size="13">ACP AgentSession → LocalHost / SshHost</text>
<rect x="30" y="878" width="1120" height="62" rx="5" fill="#f5f7fa"/>
<text x="43" y="901" font-size="16" fill="#1559a1">3. N3 → N4: resolve permission requests [call; source claim E3]</text>
<text x="43" y="924" font-size="13">ACP AgentSession → Permission evaluation</text>
<rect x="30" y="946" width="1120" height="62" rx="5" fill="#f5f7fa"/>
<text x="43" y="969" font-size="16" fill="#21754a">4. N2 → N5: stdio or SSH stdio [message; source claim E2]</text>
<text x="43" y="992" font-size="13">LocalHost / SshHost → External ACP binary</text>
<a href="../notation.md"><text x="32" y="1042" font-size="14" fill="#1559a1">Legend: blue calls · purple dashed dependencies · green dotted messages · brown data · gray containment · red declared</text></a>
<text x="32" y="1069" font-size="13">Outer frame = view ownership; external and process nodes retain their labeled boundaries. Not a deployment verification.</text>
</g>
</svg>
