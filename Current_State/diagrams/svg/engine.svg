<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="1107" viewBox="0 0 1180 1107" role="img" aria-labelledby="title description">
<title id="title">@orca/engine</title>
<desc id="description">Static architecture view. Interpreter and application services, executors, workspace and plugin ports. Numbered arrows have full labels and source evidence in the table and linked specification.</desc>
<defs>
<marker id="arrow-call" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1559a1"/></marker>
<marker id="arrow-dependency" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#794b98"/></marker>
<marker id="arrow-message" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#21754a"/></marker>
<marker id="arrow-data" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#975523"/></marker>
<marker id="arrow-containment" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#656b73"/></marker>
<marker id="arrow-declared" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#a73d3d"/></marker>
</defs>
<rect width="100%" height="100%" fill="#fff"/>
<g font-family="sans-serif" fill="#17212c">
<text x="32" y="40" font-size="25" font-weight="bold">@orca/engine</text>
<text x="32" y="70" font-size="16">Ownership view: packages/engine • package • static inspection</text>
<a href="../../architecture/engine.md"><text x="32" y="99" font-size="15" fill="#1559a1">Architecture specification, responsibilities and source evidence ↗</text></a>
<rect x="25" y="119" width="1130" height="546" rx="12" fill="#f9fafc" stroke="#9aa6b3"/>
<rect id="node-1" x="50" y="150" width="645" height="70" rx="9" fill="#fff" stroke="#526171" stroke-width="1"/>
<text x="66" y="170" font-size="12" fill="#475666">N1 · COMPONENT</text>
<text x="66" y="193" font-size="16">Orchestrator / RunContext</text>
<rect id="node-2" x="50" y="250" width="645" height="70" rx="9" fill="#fff" stroke="#526171" stroke-width="1"/>
<text x="66" y="270" font-size="12" fill="#475666">N2 · COMPONENT</text>
<text x="66" y="293" font-size="16">NodeExecutorRegistry + executors</text>
<rect id="node-3" x="50" y="350" width="645" height="70" rx="9" fill="#fff" stroke="#526171" stroke-width="1"/>
<text x="66" y="370" font-size="12" fill="#475666">N3 · COMPONENT</text>
<text x="66" y="393" font-size="16">PlanService / ProgramService</text>
<rect id="node-4" x="50" y="450" width="645" height="70" rx="9" fill="#fff" stroke="#526171" stroke-width="1"/>
<text x="66" y="470" font-size="12" fill="#475666">N4 · COMPONENT</text>
<text x="66" y="493" font-size="16">Agents + stores + core</text>
<rect id="node-5" x="50" y="550" width="645" height="70" rx="9" fill="#fff" stroke="#526171" stroke-width="1"/>
<text x="66" y="570" font-size="12" fill="#475666">N5 · COMPONENT</text>
<text x="66" y="593" font-size="16">Workspace / human-input / plugin ports</text>
<path d="M695,178 H783 V292 H698" fill="none" stroke="#1559a1" stroke-width="2" stroke-dasharray="" marker-end="url(#arrow-call)"/>
<circle cx="783" cy="235.0" r="13" fill="white" stroke="#1559a1"/><text x="783" y="240.0" text-anchor="middle" font-size="13" fill="#1559a1">1</text>
<path d="M695,178 H826 V392 H698" fill="none" stroke="#1559a1" stroke-width="2" stroke-dasharray="" marker-end="url(#arrow-call)"/>
<circle cx="826" cy="285.0" r="13" fill="white" stroke="#1559a1"/><text x="826" y="290.0" text-anchor="middle" font-size="13" fill="#1559a1">2</text>
<path d="M695,178 H869 V492 H698" fill="none" stroke="#794b98" stroke-width="2" stroke-dasharray="9 5" marker-end="url(#arrow-dependency)"/>
<circle cx="869" cy="335.0" r="13" fill="white" stroke="#794b98"/><text x="869" y="340.0" text-anchor="middle" font-size="13" fill="#794b98">3</text>
<path d="M695,178 H912 V592 H698" fill="none" stroke="#1559a1" stroke-width="2" stroke-dasharray="" marker-end="url(#arrow-call)"/>
<circle cx="912" cy="385.0" r="13" fill="white" stroke="#1559a1"/><text x="912" y="390.0" text-anchor="middle" font-size="13" fill="#1559a1">4</text>
<text x="32" y="720" font-size="19" font-weight="bold">Labeled interfaces and movements</text>
<rect x="30" y="742" width="1120" height="62" rx="5" fill="#f5f7fa"/>
<text x="43" y="765" font-size="16" fill="#1559a1">1. N1 → N2: execute one node attempt [call; source claim E2]</text>
<text x="43" y="788" font-size="13">Orchestrator / RunContext → NodeExecutorRegistry + executors</text>
<rect x="30" y="810" width="1120" height="62" rx="5" fill="#f5f7fa"/>
<text x="43" y="833" font-size="16" fill="#1559a1">2. N1 → N3: synchronize planning and request lifecycle [call; source claim E1]</text>
<text x="43" y="856" font-size="13">Orchestrator / RunContext → PlanService / ProgramService</text>
<rect x="30" y="878" width="1120" height="62" rx="5" fill="#f5f7fa"/>
<text x="43" y="901" font-size="16" fill="#794b98">3. N1 → N4: persist and invoke agents [dependency; source claim E1]</text>
<text x="43" y="924" font-size="13">Orchestrator / RunContext → Agents + stores + core</text>
<rect x="30" y="946" width="1120" height="62" rx="5" fill="#f5f7fa"/>
<text x="43" y="969" font-size="16" fill="#1559a1">4. N1 → N5: invoke injected services [call; source claim E3]</text>
<text x="43" y="992" font-size="13">Orchestrator / RunContext → Workspace / human-input / plugin ports</text>
<a href="../notation.md"><text x="32" y="1042" font-size="14" fill="#1559a1">Legend: blue calls · purple dashed dependencies · green dotted messages · brown data · gray containment · red declared</text></a>
<text x="32" y="1069" font-size="13">Outer frame = view ownership; external and process nodes retain their labeled boundaries. Not a deployment verification.</text>
</g>
</svg>
