<text x="43" y="733" font-size="16" fill="#1559a1">2. N4 → N2: load and evaluate definitions [call; source claim E3]</text>
<text x="43" y="756" font-size="13">Engine, store, protocol consumers → Workflow / expression / templates</text>
<rect x="30" y="778" width="1120" height="62" rx="5" fill="#f5f7fa"/>
<text x="43" y="801" font-size="16" fill="#1559a1">3. N4 → N3: compute planning decisions [call; source claim E2]</text>
<text x="43" y="824" font-size="13">Engine, store, protocol consumers → Plan graph, risk, decisions, scheduling</text>
<a href="../notation.md"><text x="32" y="874" font-size="14" fill="#1559a1">Legend: blue calls · purple dashed dependencies · green dotted messages · brown data · gray containment · red declared</text></a>
<text x="32" y="901" font-size="13">Outer frame = view ownership; external and process nodes retain their labeled boundaries. Not a deployment verification.</text>
