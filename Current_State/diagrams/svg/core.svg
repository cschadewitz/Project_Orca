<text x="43" y="665" font-size="16" fill="#794b98">1. N4 → N1: use domain contracts and projections [dependency; source claim E1]</text>
<text x="43" y="688" font-size="13">Engine, store, protocol consumers → Domain schemas + event reducer</text>
