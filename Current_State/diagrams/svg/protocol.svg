<text x="32" y="720" font-size="19" font-weight="bold">Labeled interfaces and movements</text>
<rect x="30" y="742" width="1120" height="62" rx="5" fill="#f5f7fa"/>
<text x="43" y="765" font-size="16" fill="#794b98">1. N2 → N1: reuse domain schema/types [dependency; source claim E1]</text>
<text x="43" y="788" font-size="13">Protocol schemas + method constants → Core schema subpath / domain types</text>
<rect x="30" y="810" width="1120" height="62" rx="5" fill="#f5f7fa"/>
<text x="43" y="833" font-size="16" fill="#794b98">2. N3 → N2: validate requests / construct views [dependency; source claim E1]</text>
<text x="43" y="856" font-size="13">Daemon dispatch and projections → Protocol schemas + method constants</text>
<rect x="30" y="878" width="1120" height="62" rx="5" fill="#f5f7fa"/>
<text x="43" y="901" font-size="16" fill="#794b98">3. N4 → N2: validate results / notifications [dependency; source claim E1]</text>
<text x="43" y="924" font-size="13">App client / preload / renderer → Protocol schemas + method constants</text>
<rect x="30" y="946" width="1120" height="62" rx="5" fill="#f5f7fa"/>
<text x="43" y="969" font-size="16" fill="#21754a">4. N3 → N5: hello advertises compatibility [message; source claim E2]</text>
<text x="43" y="992" font-size="13">Daemon dispatch and projections → Version + capabilities + errors</text>
<a href="../notation.md"><text x="32" y="1042" font-size="14" fill="#1559a1">Legend: blue calls · purple dashed dependencies · green dotted messages · brown data · gray containment · red declared</text></a>
<text x="32" y="1069" font-size="13">Outer frame = view ownership; external and process nodes retain their labeled boundaries. Not a deployment verification.</text>
