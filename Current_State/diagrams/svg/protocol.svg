<circle cx="783" cy="235.0" r="13" fill="white" stroke="#794b98"/><text x="783" y="240.0" text-anchor="middle" font-size="13" fill="#794b98">1</text>
<path d="M695,378 H826 V292 H698" fill="none" stroke="#794b98" stroke-width="2" stroke-dasharray="9 5" marker-end="url(#arrow-dependency)"/>
<circle cx="826" cy="335.0" r="13" fill="white" stroke="#794b98"/><text x="826" y="340.0" text-anchor="middle" font-size="13" fill="#794b98">2</text>
<path d="M695,478 H869 V292 H698" fill="none" stroke="#794b98" stroke-width="2" stroke-dasharray="9 5" marker-end="url(#arrow-dependency)"/>
<circle cx="869" cy="385.0" r="13" fill="white" stroke="#794b98"/><text x="869" y="390.0" text-anchor="middle" font-size="13" fill="#794b98">3</text>
<path d="M695,378 H912 V592 H698" fill="none" stroke="#21754a" stroke-width="2" stroke-dasharray="3 5" marker-end="url(#arrow-message)"/>
