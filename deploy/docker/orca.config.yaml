# The configuration the containerised daemon reads. Copy it to the root of the workspace
# you mount at /workspace and edit it there — it is your file from that point on, and
# `config.set` (the app's Config surface) writes to it.
#
# Everything in it is a path inside the container, not on the host.
version: 1

# Under /workspace, so the event log, artifacts and plan survive the container.
storeDir: .orca

hosts:
  - id: local
    type: local

agents:
  # The adapters the image installs. Neither CLI speaks ACP by itself: these wrap them.
  - id: claude
    command: claude-agent-acp
    hostId: local
    roles: [planner, designer, decomposer, reviewer]
    sessionMode: per-step
    env:
      # The adapter bundles a Claude Code of its own; this points it at the current CLI the
      # image installs (docs/SETUP.md, "Connect to Claude Code").
      CLAUDE_CODE_EXECUTABLE: /usr/local/bin/claude
    permissions: &container-policy
      # An explicit policy, because a daemon cannot ask. `orca serve` drives runs with
      # `PausingHumanInput`: a workflow gate parks in the event log and waits for an answer,
      # but a permission `ask` is *refused*, since a permission cannot outlive the agent
      # session that raised it. ORCA's own defaults (what you get with no `permissions:`
      # block) ask about every `execute` — which for a build or a test step is every command
      # the agent runs — so under this daemon they would refuse the run's real work.
      #
      # Writing `default:` at all opts this agent out of those defaults, which is the
      # intent here. What it buys and what it costs:
      #
      #   allowed   anything inside the run's own workspace, and any `execute` — a shell
      #             command has no location to scope it by, so `default` is what decides it.
      #             That includes network access from inside the container.
      #   denied    any tool call touching a path outside the workspace, and two commands
      #             worth naming even in a sandbox.
      #
      # This is a policy for a container: an isolated filesystem, a repository you are
      # willing to see rewritten, and credentials scoped to these two agents. It is not one
      # to copy onto a workstation. To go the other way — a person approving each command —
      # delete this block and drive runs from the CLI (`humanInput.mode: cli`) or from
      # Kepler, where an ask becomes Kepler's own approval prompt.
      default: allow
      rules:
        - { match: { scope: outside-workspace }, decision: deny }
        - { match: { kind: execute, titlePattern: "rm -rf|git push --force" }, decision: deny }
  - id: codex
    command: codex-acp
    hostId: local
    roles: [builder, tester, deployer]
    sessionMode: per-step
    permissions: *container-policy

# Absolute, because the workflows and templates are in the image and the workspace holds
# neither. Copy them into the workspace and make these relative if you want to edit them.
workflows: ["/opt/orca/workflows/**/*.yaml"]
templates: ["/opt/orca/templates/**/*.md"]

program:
  workflow: program
  itemWorkflow: ai-sdlc

workspace:
  # One git worktree and branch per work item, under /workspace/worktrees. `local` instead
  # would point every run at one checkout and let concurrent items fight over the branch.
  provider: git-worktree
  repo: /workspace/repo
  worktreeRoot: /workspace/worktrees
  baseBranch: main
  branchPrefix: orca/
  hostId: local

humanInput:
  # The only mode that makes sense for a daemon: a gate parks the run in its event log and
  # is answered from the app (or `orca answer`), by a person who was not at a terminal when
  # it was asked. `cli` would prompt on a terminal nobody is watching.
  mode: pause

plugins: []
