# The plain-language rule judge's eval set (#701) against real hosted models, unattended.
#
# The same set runs on every CI build against a deterministic stand-in model
# (packages/agents/test/plain-rule-eval-701.test.ts). This job runs it against the real providers through the
# reviewed HTTPS sender, with the production judge limits, and fails on any false allow, boundary violation or
# allowed injection, or when too many calls fail or too many allows are denied. It writes a comparison table of
# both providers (false allows and denies, abstentions, injection resistance, latency, tokens and cost per decision)
# to the job summary and keeps the JSON reports as an artifact.
#
# It needs one repository secret, added once:
#   ORCA_JUDGE_EVAL_ANTHROPIC_API_KEY  an Anthropic API key (runs the `anthropic` provider, Claude Haiku 5.5)
# Optional, to also run the `openai-compatible` provider:
#   secret   ORCA_JUDGE_EVAL_OPENAI_API_KEY
#   variable ORCA_JUDGE_EVAL_OPENAI_MODEL   (required for that provider)
#   variable ORCA_JUDGE_EVAL_OPENAI_URL     (default https://api.openai.com/v1/chat/completions)
#   variable ORCA_JUDGE_EVAL_OPENAI_PRICE   ("input,output" USD per million tokens, for the cost column)
# Without the Anthropic key the job passes with a notice and sends nothing. One run is one call per model-decided
# case (about 35), well under one US cent on Claude Haiku 5.5. Fork pull requests get no secrets and never run it.
name: Plain-rule judge eval

on:
  pull_request:
    branches: [main]
    paths:
      - packages/agents/src/review-judge/plain-rule*.ts
      - packages/agents/src/review-judge/https-sender.ts
      - packages/agents/test/plain-rule-eval*.ts
      - packages/agents/test/fixtures/plain-rule-eval/**
      - .github/workflows/plain-rule-judge-eval.yml
  push:
    branches: [main]
    paths:
      - packages/agents/src/review-judge/plain-rule*.ts
      - packages/agents/src/review-judge/https-sender.ts
      - packages/agents/test/plain-rule-eval*.ts
      - packages/agents/test/fixtures/plain-rule-eval/**
      - .github/workflows/plain-rule-judge-eval.yml
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plain-rule-judge-eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    name: plain-rule judge eval (real providers)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ORCA_JUDGE_EVAL_ANTHROPIC_API_KEY: ${{ secrets.ORCA_JUDGE_EVAL_ANTHROPIC_API_KEY }}
      ORCA_JUDGE_EVAL_OPENAI_API_KEY: ${{ secrets.ORCA_JUDGE_EVAL_OPENAI_API_KEY }}
      ORCA_JUDGE_EVAL_OPENAI_MODEL: ${{ vars.ORCA_JUDGE_EVAL_OPENAI_MODEL }}
      ORCA_JUDGE_EVAL_OPENAI_URL: ${{ vars.ORCA_JUDGE_EVAL_OPENAI_URL }}
      ORCA_JUDGE_EVAL_OPENAI_PRICE: ${{ vars.ORCA_JUDGE_EVAL_OPENAI_PRICE }}
    steps:
      - name: Check for the key
        id: key
        shell: bash
        run: |
          if [ -n "$ORCA_JUDGE_EVAL_ANTHROPIC_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ORCA_JUDGE_EVAL_ANTHROPIC_API_KEY is not set, so the real-provider eval was skipped."
            echo "Real-provider eval skipped: the ORCA_JUDGE_EVAL_ANTHROPIC_API_KEY secret is not set." >> "$GITHUB_STEP_SUMMARY"
          fi

      - if: steps.key.outputs.present == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: steps.key.outputs.present == 'true'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - if: steps.key.outputs.present == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - if: steps.key.outputs.present == 'true'
        run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: Run the eval set against the real providers
        if: steps.key.outputs.present == 'true'
        shell: bash
        env:
          ORCA_JUDGE_EVAL_REPORT_DIR: ${{ runner.temp }}/plain-rule-eval
        run: |
          set -euo pipefail
          pnpm exec vitest run packages/agents/test/plain-rule-eval-live-701.test.ts \
            --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/plain-rule-eval.json"
          # The Anthropic run has to have happened; the OpenAI-compatible one only when it is configured.
          node -e '
            const r = require(process.argv[1]);
            const tests = r.testResults.flatMap((f) => f.assertionResults);
            const anthropic = tests.find((t) => t.title.startsWith("anthropic:"));
            if (!anthropic || anthropic.status !== "passed")
              throw new Error(`expected the anthropic eval to run and pass, got ${anthropic ? anthropic.status : "nothing"}`);
          ' "$RUNNER_TEMP/plain-rule-eval.json"

      - name: Keep the reports
        if: always() && steps.key.outputs.present == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plain-rule-eval-reports
          path: ${{ runner.temp }}/plain-rule-eval/
          if-no-files-found: warn
          retention-days: 90
