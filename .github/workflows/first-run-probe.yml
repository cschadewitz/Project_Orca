# PROBE ONLY, not for merge: reproduce the Windows first-run Connect refusal seen on a real
# install of 0.7.0-rc.1, with the swallowed error chain printed.
name: First-run probe (Windows)

on:
  push:
    branches: [claude/project-thread-a0zcpv]

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: harness-as-written
            plain: "0"
            parent: ""
          - name: user-like-folders
            plain: "1"
            parent: profile
    name: probe (${{ matrix.name }})
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm --filter @orca/app run build:daemon
      - name: Build the x64 native addons
        run: |
          set -euo pipefail
          node_version=$(node -p 'process.versions.node')
          h=$(mktemp -d "$RUNNER_TEMP/h.XXXXXX")
          base="https://nodejs.org/download/release/v${node_version}"
          curl -fsS "$base/node-v${node_version}-headers.tar.gz" -o "$h/headers.tar.gz"
          curl -fsS "$base/win-x64/node.lib" -o "$h/node.lib"
          (cd "$h" && tar -xzf headers.tar.gz)
          mkdir -p "$h/node-v${node_version}/x64"
          cp "$h/node.lib" "$h/node-v${node_version}/x64/node.lib"
          node packages/app/scripts/diagnostics-native-package.js --arch x64 --headers "$h/node-v${node_version}"
          ls packages/app/native/diagnostics/build/Release
      - name: Run the first-run Electron harness
        env:
          ORCA_PROBE_PLAIN_PROJECT: ${{ matrix.plain }}
          PROBE_PARENT: ${{ matrix.parent }}
        run: |
          set -euo pipefail
          if [ "$PROBE_PARENT" = profile ]; then export ORCA_WINDOWS_TEST_PARENT="$USERPROFILE"; fi
          echo "parent=${ORCA_WINDOWS_TEST_PARENT:-<temp>} plain=$ORCA_PROBE_PLAIN_PROJECT"
          node packages/app/test/milestone21/windows-first-run.mjs
