# PROBE ONLY, not for merge: reproduce the Windows first-run Connect refusal seen on a real
# install of 0.7.0-rc.1, with the swallowed error chain printed.
name: First-run probe (Windows)

on:
  push:
    branches: [claude/project-thread-a0zcpv]

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 45
    name: probe (packaged first-run)
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm --filter @orca/app run build:daemon
      - name: Stage native addons (as the Desktop workflow does)
        run: |
          set -euo pipefail
          node_version=$(node -p 'process.versions.node')
          h=$(mktemp -d "$RUNNER_TEMP/h.XXXXXX")
          base="https://nodejs.org/download/release/v${node_version}"
          curl -fsS "$base/node-v${node_version}-headers.tar.gz" -o "$h/headers.tar.gz"
          (cd "$h" && tar -xzf headers.tar.gz)
          for arch in x64 arm64; do
            mkdir -p "$h/node-v${node_version}/$arch"
            curl -fsS "$base/win-$arch/node.lib" -o "$h/node-v${node_version}/$arch/node.lib"
          done
          node tools/packaged-windows/stage-native-addons.js --headers "$h/node-v${node_version}"
      - name: Package x64 (unpacked dir only)
        run: |
          set -euo pipefail
          pnpm --filter @orca/app exec electron-builder --win dir --x64 --publish never \
            -c.extraMetadata.version=0.7.0-rc.1 -c.directories.output=dist/release/x64
          ls packages/app/dist/release/x64/win-unpacked/resources/native/diagnostics/win32-x64
      # Uploaded as the unpacked folder itself, so the download is one zip to extract.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: orca-first-run-debug-x64
          path: packages/app/dist/release/x64/win-unpacked/
          retention-days: 14
