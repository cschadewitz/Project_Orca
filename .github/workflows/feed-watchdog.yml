# Check the live desktop feed once a day, the way a client sees it (#863, item 6; adopted from
# T3 Code's scheduled feed check). tools/deploy/feed-watchdog.js asks the feed for each ring's
# channel files with that ring's canary token and fails when:
#
# - a request without a token is not refused (401), or an unserved architecture is served;
# - a ring is offered something that is not a published GitHub release, `stable` a prerelease,
#   or any ring a prerelease other than `-rc.N`;
# - the installer the feed serves does not hash to its channel file's sha512, or differs from
#   the published release asset;
# - a ring's x64 or server channel answers 404 or offers another version than the feed's live
#   rings.json gives it, or its servers are offered less than its desktops (servers first,
#   #877). These are offers, not what hosts run.
#
# rings.json is read by the separate `rings` job, in the main-only `feed-reader` environment,
# with a bucket-scoped read-only R2 key (ORCA_FEED_READER_*; never the publishing key, which
# stays in `desktop-feed`), and handed to the canary job as a job output. The canary job never
# sees a bucket key and the `rings` job never sees a canary. While the feed is switched on
# (ORCA_FEED_BUCKET), a missing rings.json or a failed read fails the check rather than
# passing an empty-looking feed.
#
# Read-only: nothing here can write to the bucket. The canary tokens are bearer credentials,
# so only reviewed code reads them: the canary job runs from main only, in the `feed-canary`
# environment, which deploys from main only and holds nothing but ORCA_FEED_CANARY_TOKENS (a
# JSON object of ring to a token minted with tools/deploy/feed-token.js). Never put an R2 key
# there. The repository variable ORCA_FEED_URL is the feed's https origin; until it is set the
# job is skipped (docs/UPDATING.md, "Feed watchdog").
name: Desktop feed (watchdog)

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: feed-watchdog
  cancel-in-progress: true

jobs:
  rings:
    name: read the live ring state
    if: github.ref == 'refs/heads/main' && (vars.ORRERY_FEED_URL || vars.ORCA_FEED_URL) != '' && (vars.ORRERY_FEED_BUCKET || vars.ORCA_FEED_BUCKET) != ''
    runs-on: ubuntu-24.04
    environment: feed-reader
    timeout-minutes: 5
    outputs:
      rings: ${{ steps.read.outputs.rings }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          sparse-checkout: tools/deploy
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Read rings.json
        id: read
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ORCA_FEED_READER_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ORCA_FEED_READER_SECRET_ACCESS_KEY }}
          FEED_ACCOUNT_ID: ${{ vars.ORRERY_FEED_ACCOUNT_ID || vars.ORCA_FEED_ACCOUNT_ID }}
          FEED_BUCKET: ${{ vars.ORRERY_FEED_BUCKET || vars.ORCA_FEED_BUCKET }}
        run: |
          set -euo pipefail
          bash tools/deploy/feed-r2.sh read-rings "$RUNNER_TEMP/rings.json"
          echo "rings=$(cat "$RUNNER_TEMP/rings.json")" >> "$GITHUB_OUTPUT"
          { echo "Ring state:"; echo '```json'; cat "$RUNNER_TEMP/rings.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  watch:
    name: check the live feed
    needs: rings
    # Runs when the ring state was read, or the feed is off (no bucket, nothing to read). A failed
    # read while the feed is on still runs the check, which then fails for the missing state.
    if: always() && github.ref == 'refs/heads/main' && (vars.ORRERY_FEED_URL || vars.ORCA_FEED_URL) != ''
    runs-on: ubuntu-24.04
    environment: feed-canary
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          sparse-checkout: tools/deploy
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Check every ring and architecture
        env:
          FEED_URL: ${{ vars.ORRERY_FEED_URL || vars.ORCA_FEED_URL }}
          FEED_CANARY_TOKENS: ${{ secrets.ORCA_FEED_CANARY_TOKENS }}
          FEED_RINGS: ${{ needs.rings.outputs.rings }}
          FEED_COMMISSIONED: ${{ (vars.ORRERY_FEED_BUCKET || vars.ORCA_FEED_BUCKET) != '' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/deploy/feed-watchdog.js
