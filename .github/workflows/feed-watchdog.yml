# Check the live desktop feed once a day, the way a client sees it (#863, item 6; adopted from
# T3 Code's scheduled feed check). tools/deploy/feed-watchdog.js asks the feed for each ring's
# channel files with that ring's canary token and fails when:
#
# - a request without a token is not refused (401), or an unserved architecture is served;
# - a ring is offered something that is not a published GitHub release, `stable` a prerelease,
#   or any ring a prerelease other than `-rc.N`;
# - the installer the feed serves does not hash to its channel file's sha512, or differs from
#   the published release asset;
# - a ring's x64 or server channel answers 404 or offers another version than the ring state
#   the newest feed write recorded (artifact feed-rings-*), or its servers are offered less
#   than its desktops (servers first, #877). These are offers, not what hosts run.
#
# Read-only: it holds no bucket credential and writes nothing. The canary tokens are bearer
# credentials, so only reviewed code reads them: the job runs from main only, in the
# `feed-canary` environment, which deploys from main only and holds nothing but
# ORCA_FEED_CANARY_TOKENS (a JSON object of ring to a token minted with
# tools/deploy/feed-token.js). Never put the R2 write credential there. The repository
# variable ORCA_FEED_URL is the feed's https origin; until it is set the job is skipped
# (docs/UPDATING.md, "Feed watchdog").
name: Desktop feed (watchdog)

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read
  # To find and download the recorded ring state (feed-rings-* artifacts of the feed workflows).
  actions: read

concurrency:
  group: feed-watchdog
  cancel-in-progress: true

jobs:
  watch:
    name: check the live feed
    if: github.ref == 'refs/heads/main' && vars.ORCA_FEED_URL != ''
    runs-on: ubuntu-24.04
    environment: feed-canary
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          sparse-checkout: tools/deploy
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # What each ring should be offered: the rings.json the newest feed write stored, kept as an
      # artifact by a main dispatch of feed-publish.yml or feed-promote.yml. Without one, an
      # empty ring cannot be told from a broken one and only servers-first is checked.
      - name: Find the recorded ring state
        id: record
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          found=$(node tools/deploy/feed-watchdog.js record)
          if [ -n "$found" ]; then
            read -r run name <<<"$found"
            gh run download "$run" --repo "$GITHUB_REPOSITORY" --name "$name" --dir "$RUNNER_TEMP/feed-rings"
            echo "file=$RUNNER_TEMP/feed-rings/rings.json" >> "$GITHUB_OUTPUT"
            echo "Recorded ring state: $name from run $run" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check every ring and architecture
        env:
          FEED_URL: ${{ vars.ORCA_FEED_URL }}
          FEED_CANARY_TOKENS: ${{ secrets.ORCA_FEED_CANARY_TOKENS }}
          FEED_RINGS_RECORD: ${{ steps.record.outputs.file }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/deploy/feed-watchdog.js
