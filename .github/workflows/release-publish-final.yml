# Publish a staged final after its native acceptance, without anyone running API calls by hand.
#
# Dispatch from main with the draft's release id and version. tools/deploy/release-attach.sh
# publish re-reads the draft: still a draft, named vVERSION, exactly the Ubuntu .deb and the x64
# installer, one signing record, and the installer's digest equal to the recorded one. It
# refuses an existing tag at another commit, publishes with the tag and target stated
# explicitly, and checks the tag and `latest` afterwards. It shares its concurrency group with
# Release (attach signed installer), so publication through this workflow never interleaves
# with an attachment. A release published with the workflow token does not raise the `release`
# event for other workflows, so this dispatches Desktop feed (automatic) itself.
name: Release (publish final)

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: The accepted draft's release id
        required: true
      version:
        description: Version (X.Y.Z)
        required: true

concurrency:
  group: release-draft-writes
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: publish the accepted draft
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Publish the draft with its recorded installer
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ID: ${{ inputs.release_id }}
          VERSION: ${{ inputs.version }}
        run: bash tools/deploy/release-attach.sh publish "$ID" "$VERSION"

      - name: Hand over to the desktop feed
        if: vars.ORCA_FEED_AUTO == 'true' && vars.ORCA_FEED_BUCKET != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run feed-auto.yml --repo "$GITHUB_REPOSITORY" --ref main
