# Full main verification and conservative affected-package PR testing on Node 24.
# Audited ordinary prose retains the named verdict with lightweight documentation checks.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Chooses where `check` runs: the homelab runners when one is idle, GitHub-hosted
  # otherwise. Any failure to ask (DNS, timeout, non-200, bad JSON) counts as zero.
  # Set the repository variable CI_FORCE_HOSTED to `true` to skip the homelab runners
  # (e.g. when a job queued on them); re-run the workflow to apply it.
  runner:
    name: pick runner
    runs-on: ubuntu-slim
    timeout-minutes: 2
    outputs:
      labels: ${{ steps.pick.outputs.labels }}
      workers: ${{ steps.pick.outputs.workers }}
      pnpm_cache: ${{ steps.pick.outputs.pnpm_cache }}
    steps:
      - id: pick
        shell: bash
        env:
          FORCE_HOSTED: ${{ vars.CI_FORCE_HOSTED }}
        run: |
          idle=0
          # Check curl's own status: a timeout after partial output must not count
          if [[ "$FORCE_HOSTED" != "true" ]] && body=$(curl -fsS --max-time 5 https://runners.theroses.dev/health); then
            idle=$(jq -r '.Project_Orca // 0' <<<"$body" 2>/dev/null) || idle=0
          fi
          [[ "$idle" =~ ^[0-9]+$ ]] || idle=0
          if (( idle > 0 )); then
            echo 'labels=["self-hosted","linux","x64","tyler"]' >> "$GITHUB_OUTPUT"
            # Why 20 workers and no pnpm cache: docs/ci-runners.md
            echo 'workers=20' >> "$GITHUB_OUTPUT"
            echo 'pnpm_cache=' >> "$GITHUB_OUTPUT"
          else
            echo 'labels=["ubuntu-24.04"]' >> "$GITHUB_OUTPUT"
            echo 'workers=2' >> "$GITHUB_OUTPUT"
            echo 'pnpm_cache=pnpm' >> "$GITHUB_OUTPUT"
          fi
          echo "idle homelab runners: ${idle}"

  changes:
    name: classify changes
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24.21.0"
      - name: Classify
        id: classify
        env:
          SHADOW_BASE: ${{ github.event.pull_request.base.sha }}
          SHADOW_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node tools/ci-shadow/docs.js

  check:
    name: check (node ${{ matrix.node }})
    needs: [changes, runner]
    if: ${{ !cancelled() }}
    runs-on: ${{ fromJSON(needs.runner.outputs.labels) }}
    env:
      # Worker cap from the picked runner (see the `runner` job); unset elsewhere means 2
      WORKERS_CAP: ${{ needs.runner.outputs.workers }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        # 24 is the floor declared in package.json engines and selected by mise.toml.
        node: [24]
    steps:
      - uses: actions/checkout@v7
        with:
          # Selection recomputes the exact base/head/candidate union from immutable objects.
          fetch-depth: 0
          persist-credentials: false

      # Must precede setup-node: `cache: pnpm` needs the pnpm binary on PATH to
      # resolve the store path. Version comes from package.json packageManager.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: ${{ needs.runner.outputs.pnpm_cache }}

      # Capture identities before candidate test code runs. Reports remain untrusted data
      # for the read-only default-branch workflow_run consumer, never admission outputs.
      - name: Initialize advisory evidence
        continue-on-error: true
        env:
          SHADOW_BASE: ${{ github.event.pull_request.base.sha }}
          SHADOW_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          SHADOW_NODE: ${{ matrix.node }}
        run: |
          mkdir -p "$RUNNER_TEMP/ci-shadow-evidence"
          rm -f "$RUNNER_TEMP/full-suite.json" "$RUNNER_TEMP/retry-acceptance.json" \
            "$RUNNER_TEMP/ci-shadow-identity.json" "$RUNNER_TEMP/ci-shadow-evidence/evidence.json" \
            "$RUNNER_TEMP/ci-shadow-evidence/evidence.json.tmp"
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          const env = process.env;
          const candidate = execFileSync('git', ['--no-replace-objects', 'rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          // Push comparison uses the immutable first parent, not an unauthenticated
          // workflow_run "before" field. All existing push checks still run as before.
          const base = env.GITHUB_EVENT_NAME === 'push'
            ? execFileSync('git', ['--no-replace-objects', 'rev-parse', 'HEAD^1'], { encoding: 'utf8' }).trim()
            : env.SHADOW_BASE;
          writeFileSync(join(env.RUNNER_TEMP, 'ci-shadow-identity.json'), JSON.stringify({
            repository: env.GITHUB_REPOSITORY, runId: Number(env.GITHUB_RUN_ID),
            attempt: Number(env.GITHUB_RUN_ATTEMPT), event: env.GITHUB_EVENT_NAME,
            base, head: env.SHADOW_HEAD, candidate, node: Number(env.SHADOW_NODE),
          }));
          NODE

      # Bound every Vitest invocation, not just retry acceptance. Preserve the default
      # of one worker on small runners rather than increasing their concurrency to two.
      - name: Bound test workers
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          import { availableParallelism } from 'node:os';

          const workers = Math.min(Number(process.env.WORKERS_CAP) || 2, Math.max(1, availableParallelism() - 1));
          appendFileSync(process.env.GITHUB_ENV, `VITEST_MAX_WORKERS=${workers}\n`);
          console.log(`Vitest worker limit: ${workers} (available parallelism: ${availableParallelism()})`);
          NODE

      # CI typechecks and lints the Electron app but never launches it, so skip the
      # ~100 MB binary that electron's postinstall would otherwise fetch.
      - if: needs.changes.outputs.code != 'false'
        run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      # Warm Vitest's file-order cache from the runner volume (docs/ci-runners.md). A missing
      # file is fine. The directory name is the sha1 of the root project's empty name.
      - name: Restore Vitest file-order cache
        # Homelab runners only: the same labels `runs-on` used.
        if: needs.changes.outputs.code != 'false' && contains(fromJSON(needs.runner.outputs.labels), 'tyler')
        continue-on-error: true
        run: |
          src=/var/cache/vitest-order/results.json
          dir=node_modules/.vite/vitest/da39a3ee5e6b4b0d3255bfef95601890afd80709
          if [ -f "$src" ]; then
            mkdir -p "$dir"
            cp "$src" "$dir/results.json"
          fi

      # Exact-candidate affected-package proposals reduce PR tests. Main and unknowns stay full.
      - name: Plan test execution
        id: selection
        if: needs.changes.outputs.code != 'false'
        env:
          SHADOW_BASE: ${{ github.event.pull_request.base.sha }}
          SHADOW_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          SHADOW_NODE: ${{ matrix.node }}
        run: |
          rm -f "$RUNNER_TEMP/ci-selection-plan.json" "$RUNNER_TEMP/ci-selection-plan.json.tmp"
          node tools/ci-shadow/execute.js plan

      - name: Typecheck
        if: needs.changes.outputs.code != 'false'
        run: pnpm run typecheck

      # tokens.css and tokens.ts are committed so nothing needs a build to read a token;
      # this fails when someone edited tokens.json and forgot to regenerate them.
      - name: Design tokens are current
        if: needs.changes.outputs.code != 'false'
        run: pnpm run design:check

      - name: Format
        if: needs.changes.outputs.code != 'false'
        run: pnpm run format:check

      - name: Lint
        if: needs.changes.outputs.code != 'false'
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm run lint

      - name: Check ordinary documentation
        if: needs.changes.outputs.code == 'false'
        env:
          SHADOW_BASE: ${{ github.event.pull_request.base.sha }}
          SHADOW_HEAD: ${{ github.event.pull_request.head.sha }}
        run: node tools/ci-shadow/check-docs.js

      # Production MCP acceptance launches the emitted daemon and MCP entry points.
      - name: Build
        if: needs.changes.outputs.code != 'false'
        run: pnpm run build

      # These two opt-in cases are skipped by the ordinary suite. Run them against the
      # merged runtime on Node 24 and reject a green result with skips.
      - name: Retry admission acceptance (CLI and ACP)
        if: needs.changes.outputs.code != 'false'
        timeout-minutes: 3
        env:
          ORCA_RETRY_INTEGRATION: "1"
        run: |
          pnpm exec vitest run \
            packages/cli/test/admission-retry-wiring.test.ts \
            packages/integrations/test/admission-retry-acp.test.ts \
            --maxWorkers="$VITEST_MAX_WORKERS" \
            --reporter=default --reporter=json \
            --outputFile.json="$RUNNER_TEMP/retry-acceptance.json"
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { join, relative } from 'node:path';

          const report = JSON.parse(readFileSync(join(process.env.RUNNER_TEMP, 'retry-acceptance.json'), 'utf8'));
          const expected = new Set([
            'packages/cli/test/admission-retry-wiring.test.ts',
            'packages/integrations/test/admission-retry-acp.test.ts',
          ]);
          const files = report.testResults ?? [];
          const ran = new Set(files.map((file) => relative(process.cwd(), file.name)));
          if (
            report.success !== true ||
            files.length !== expected.size ||
            [...expected].some((file) => !ran.has(file)) ||
            files.some((file) =>
              !file.assertionResults?.length || file.assertionResults.some((test) => test.status !== 'passed')) ||
            report.numTotalTests !== report.numPassedTests ||
            report.numPassedTests < expected.size
          ) {
            throw new Error('Retry acceptance requires both named test files to run with every test passing');
          }
          console.log(`Retry acceptance: ${report.numPassedTests} tests passed in both named files; none skipped`);
          NODE

      # Full/fallback PRs and every main push retain global/app coverage ratchets.
      # Selected PRs do not produce or claim global coverage; main catches regressions.
      - name: Test selected files
        if: needs.changes.outputs.code != 'false' && steps.selection.outputs.mode == 'targeted'
        run: node tools/ci-shadow/execute.js run
        env:
          SHADOW_BASE: ${{ github.event.pull_request.base.sha }}
          SHADOW_HEAD: ${{ github.event.pull_request.head.sha }}
          SHADOW_NODE: ${{ matrix.node }}
          ORCA_MCP_REQUIRE_PRODUCTION: "1"

      - name: Test with coverage
        if: needs.changes.outputs.code != 'false' && steps.selection.outputs.mode != 'targeted'
        # Explicit `run` forwards reporter flags to Vitest through pnpm.
        run: pnpm run test:coverage --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/full-suite.json"
        env:
          ORCA_MCP_REQUIRE_PRODUCTION: "1"

      # Both still run when the thresholds fail: a red build is exactly when the numbers
      # are worth reading. `hashFiles` keeps them quiet when coverage never ran at all.
      - name: Report coverage
        if: ${{ !cancelled() && hashFiles('coverage/coverage-summary.json') != '' }}
        run: node tools/coverage-summary.js >> "$GITHUB_STEP_SUMMARY"

      # Artifact storage is best effort; test and coverage failures above remain blocking.
      - name: Upload coverage report
        id: upload-coverage
        continue-on-error: true
        if: ${{ !cancelled() && hashFiles('coverage/coverage-summary.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7

      - name: Warn if coverage upload failed
        if: ${{ !cancelled() && steps.upload-coverage.outcome == 'failure' }}
        run: |
          echo "::warning title=Coverage upload failed::Could not upload the coverage report. See the job summary for coverage results when available."

      # vitest resolves @orca/* to packages/*/src via aliases, so it never exercises the
      # emitted dist graph. This catches broken exports maps and missing project references.
      - name: Smoke test the compiled build
        if: needs.changes.outputs.code != 'false'
        run: node packages/cli/dist/main.js demo

      # Retain actual full/selected suite evidence; job steps authenticate execution mode.
      # Always retain sanitized failure/missing-result evidence. Failure here cannot
      # mask or override any existing step, job, coverage or required-check outcome.
      - name: Record advisory full-suite evidence
        if: always()
        continue-on-error: true
        run: node tools/ci-shadow/record.js

      - name: Upload advisory full-suite evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ci-full-evidence-${{ github.run_id }}-${{ github.run_attempt }}-node-${{ matrix.node }}
          path: ${{ runner.temp }}/ci-shadow-evidence/evidence.json
          if-no-files-found: warn
          retention-days: 7
