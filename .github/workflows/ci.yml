# Lint, test and build every PR and every push to main, on each supported Node version.
#
# Docs-only changes skip all of that: the `changes` job diffs the push or PR against its
# merge base and the `check` matrix only runs when something other than documentation
# moved. This is a job-level `if` rather than `paths-ignore` on the trigger so a docs-only
# PR still gets a (green, skipped) check run, which is what a required status check needs.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: classify changes
    runs-on: [self-hosted, linux, x64, homelab]
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Three-dot diff below needs the merge base, so the full history.
          fetch-depth: 0

      # Documentation is `docs/**` and any Markdown outside `templates/`. The prompt
      # templates are Markdown too, but the engine loads them and the tests and the
      # `demo` smoke test read them, so they count as code. Anything else counts as code.
      # When the base commit is unknown (first push of a branch, or a force-push that
      # rewrote it away) the job errs on the side of running everything.
      - name: Classify
        id: classify
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "base commit unavailable; treating the change as code"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code_paths=$(git diff --name-only "$BASE...$HEAD" \
            | awk '!/^docs\// && !(/\.md$/ && !/^templates\//)')
          if [ -n "$code_paths" ]; then
            echo "code changed:"; printf '  %s\n' $code_paths
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs-only change; skipping the check matrix"
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  check:
    name: check (node ${{ matrix.node }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: [self-hosted, linux, x64, homelab]
    strategy:
      fail-fast: false
      matrix:
        # 22 is the floor declared in package.json engines; 24 is what mise.toml pins.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7

      # Must precede setup-node: `cache: pnpm` needs the pnpm binary on PATH to
      # resolve the store path. Version comes from package.json packageManager.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      # CI typechecks and lints the Electron app but never launches it, so skip the
      # ~100 MB binary that electron's postinstall would otherwise fetch.
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      # The Node 22 leg proves runtime compatibility through the tests, build and compiled
      # smoke below. TypeScript's result is independent of the Node version running it, so
      # doing the same standalone typecheck twice buys no additional compatibility signal.
      - name: Typecheck
        if: matrix.node == 24
        run: pnpm run typecheck

      # tokens.css and tokens.ts are committed so nothing needs a build to read a token;
      # this fails when someone edited tokens.json and forgot to regenerate them.
      - name: Design tokens are current
        if: matrix.node == 24
        run: pnpm run design:check

      # Style and lint are Node-version independent, so one leg is enough: running them on
      # both would annotate the same finding twice on the PR.
      - name: Format
        if: matrix.node == 24
        run: pnpm run format:check

      - name: Lint
        if: matrix.node == 24
        run: pnpm run lint

      # Coverage is measured on one leg for the same reason, and because instrumenting
      # slows the suite down. Thresholds live in vitest.config.ts, so this fails here
      # exactly when it fails locally.
      - name: Test
        if: matrix.node != 24
        run: pnpm test

      - name: Test with coverage
        if: matrix.node == 24
        run: pnpm run test:coverage

      # Both still run when the thresholds fail: a red build is exactly when the numbers
      # are worth reading. `hashFiles` keeps them quiet when coverage never ran at all.
      - name: Report coverage
        if: ${{ !cancelled() && matrix.node == 24 && hashFiles('coverage/coverage-summary.json') != '' }}
        run: node tools/coverage-summary.js >> "$GITHUB_STEP_SUMMARY"

      # Artifact storage is best effort; test and coverage failures above remain blocking.
      - name: Upload coverage report
        id: upload-coverage
        continue-on-error: true
        if: ${{ !cancelled() && matrix.node == 24 && hashFiles('coverage/coverage-summary.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7

      - name: Warn if coverage upload failed
        if: ${{ !cancelled() && steps.upload-coverage.outcome == 'failure' }}
        run: |
          echo "::warning title=Coverage upload failed::Could not upload the coverage report. See the job summary for coverage results when available."

      - name: Build
        run: pnpm run build

      # vitest resolves @orca/* to packages/*/src via aliases, so it never exercises the
      # emitted dist graph. This catches broken exports maps and missing project references.
      - name: Smoke test the compiled build
        run: node packages/cli/dist/main.js demo
