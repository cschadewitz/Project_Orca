# Build, sign and attach the prebuilt headless server bundle for a release (#876).
#
# Release (publish) dispatches this from main for every real release, final or rc, right after
# it drafts the final or publishes the prerelease. A reconcile every 6 hours dispatches it again
# for any release on a version line newer than Latest that still has no recorded bundle, so an
# interrupted run recovers by itself. Nothing here needs a person or a stored key.
#
#   resolve  the release vVERSION exists, targets SOURCE_SHA (a final still a draft, an rc
#            already published), and SOURCE_SHA is on its protected line release/X.Y. Main's
#            tooling only.
#   build    builds SOURCE_SHA (its own lockfile and toolchain) and assembles
#            orca-server-VERSION-linux-x64.tar.xz with tools/deploy/server-bundle.py, plus the
#            SHA-256 manifest. Read-only token, no OIDC.
#   sign     signs the manifest keylessly: cosign with this job's GitHub OIDC identity, logged in
#            Sigstore's public transparency log. Runs nothing from SOURCE_SHA. The certificate's
#            identity is this file on refs/heads/main, triggered by workflow_dispatch, which is
#            exactly what tools/deploy/orca-release.py pins (BUNDLE_SIGNER). A pull request
#            cannot produce that identity: its runs are on refs/pull/*, not main.
#   verify   the acceptance check, on a clean host: a python:3.12-slim container with no gh,
#            git, mise, pnpm or node runs main's orca-release.py `stage --bundle` on the signed
#            files. That fetches the pinned cosign, verifies the signature against the pinned
#            identity, unpacks and runs the release's demo, config validation and temporary
#            daemon hello, exactly as an operator's server will.
#   attach   uploads the three files to the release by id and then records their digests in its
#            notes (release-attach.sh server-attach), re-reading the release before every write.
#            Release (publish final) refuses a final without that recorded bundle.
name: Release (server bundle)
# Binds the run to one version and commit: release-attach.sh publish reads it back as part of
# the bundle's receipt.
run-name: Release (server bundle) v${{ inputs.version }} at ${{ inputs.source_sha }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (X.Y.Z or X.Y.Z-rc.N)
        required: true
      source_sha:
        description: The release's commit (40 hex)
        required: true
  schedule:
    - cron: "41 */6 * * *"

permissions:
  contents: read

concurrency:
  group: release-server-bundle-${{ inputs.version || 'reconcile' }}
  cancel-in-progress: false

jobs:
  resolve:
    name: the release this bundle belongs to
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # Draft releases are only visible to a token that can write them. Nothing is written here.
    permissions:
      contents: write
    outputs:
      id: ${{ steps.target.outputs.id }}
      kind: ${{ steps.target.outputs.kind }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Find the release at that commit
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
          SHA: ${{ inputs.source_sha }}
        run: bash tools/deploy/release-attach.sh server-target "$VERSION" "$SHA" >> "$GITHUB_OUTPUT"

  build:
    name: build the bundle from the release commit
    needs: resolve
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - name: Build
        run: pnpm exec tsc -b tsconfig.build.json

      - name: Assemble the bundle and its manifest
        env:
          VERSION: ${{ inputs.version }}
          SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$SHA" ] || { echo "::error::checked out $(git rev-parse HEAD), not $SHA"; exit 1; }
          [ "$(node -p 'require("./package.json").version')" = "$VERSION" ] ||
            { echo "::error::package.json at $SHA is not version $VERSION"; exit 1; }
          node packages/app/scripts/build-daemon.js --outfile "$RUNNER_TEMP/daemon/orca-daemon.mjs" --server
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct HEAD) python3 tools/deploy/server-bundle.py assemble \
            --version "$VERSION" --sha "$SHA" --node "$(command -v node)" --node-version "$(node --version)" \
            --daemon-dir "$RUNNER_TEMP/daemon" --out "$RUNNER_TEMP/bundle"
          ls -l "$RUNNER_TEMP/bundle"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-bundle-unsigned
          path: ${{ runner.temp }}/bundle/
          if-no-files-found: error
          retention-days: 7

  sign:
    name: sign the manifest (keyless, GitHub OIDC)
    needs: [resolve, build]
    runs-on: ubuntu-24.04
    # id-token is job-wide: this job runs nothing from the release commit.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: server-bundle-unsigned
          path: bundle

      - name: The manifest describes exactly this archive, version and commit
        env:
          VERSION: ${{ inputs.version }}
          SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          stem="orca-server-$VERSION-linux-x64"
          manifest="bundle/$stem.manifest.json"
          [ "$(ls bundle | sort | tr '\n' ' ')" = "$stem.manifest.json $stem.tar.xz " ] ||
            { echo "::error::unexpected files: $(ls bundle)"; exit 1; }
          jq -e --arg v "$VERSION" --arg s "$SHA" --arg a "$stem.tar.xz" \
            --arg d "$(sha256sum "bundle/$stem.tar.xz" | cut -d' ' -f1)" \
            '.schema == "orca-server-bundle/1" and .version == $v and .sourceSha == $s
             and .archive.name == $a and .archive.sha256 == $d' "$manifest" > /dev/null ||
            { echo "::error::the manifest does not describe $stem.tar.xz at $SHA"; exit 1; }

      # The cosign orca-release.py verifies with (its COSIGN_VERSION and COSIGN_SHA256), fetched
      # from the cosign release and checked against that digest. No third-party action runs in
      # the job that holds the OIDC token, and the repository's allowed-actions list needs no entry.
      - name: Install the pinned cosign
        env:
          COSIGN_VERSION: v3.1.4
          COSIGN_SHA256: 424e2c97d0b45fd7a6b608a87f090f35633f4c23ece5f092d48bba11aaf4bbfa
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/cosign-bin"
          mkdir -p "$bin"
          curl -fsSL --retry 3 -o "$bin/cosign" \
            "https://github.com/sigstore/cosign/releases/download/$COSIGN_VERSION/cosign-linux-amd64"
          echo "$COSIGN_SHA256  $bin/cosign" | sha256sum -c -
          chmod +x "$bin/cosign"
          echo "$bin" >> "$GITHUB_PATH"

      - name: Sign
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          manifest="bundle/orca-server-$VERSION-linux-x64.manifest.json"
          cosign sign-blob --yes --bundle "$manifest.sigstore.json" "$manifest"
          # The same identity orca-release.py pins; the clean-host check below proves it end to end.
          cosign verify-blob "$manifest" --bundle "$manifest.sigstore.json" \
            --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release-server-bundle.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-bundle
          path: bundle/
          if-no-files-found: error

  verify:
    name: stage --bundle on a clean host
    needs: [resolve, sign]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      digests: ${{ steps.receipt.outputs.digests }}
      receipt: ${{ steps.receipt.outputs.receipt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: server-bundle
          path: ${{ runner.temp }}/clean/bundle

      - name: Stage it with Python 3 alone
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          clean="$RUNNER_TEMP/clean"
          srv="$clean/srv"
          mkdir -p "$srv" "$clean/adapter"
          cp tools/deploy/orca-release.py "$clean/adapter/"
          cat > "$srv/orca.config.yaml" <<'YAML'
          version: 1
          storeDir: .orca
          hosts:
            - id: local
              type: local
          agents: []
          workflows: ['${ORCA_RELEASE}/workflows/**/*.yaml']
          templates: ['${ORCA_RELEASE}/templates/**/*.md']
          YAML
          jq -n --arg root "$srv" '{root: $root, repository: "cschadewitz/Project_Orca", cwd: $root,
            cliConfig: ($root + "/orca.config.yaml"), daemonConfig: ($root + "/orca.config.yaml"),
            acpConfig: ($root + "/orca.config.yaml"), url: "http://127.0.0.1:6722", service: "orca.service",
            launchAudit: "all-cli-acp-and-daemon-launches-migrated"}' > "$srv/deployment.json"
          # ORCA's local authority identifies the OS user by uid and name, and a server's service
          # account always has a name. The staging user is a synthetic, non-root `orca-stage`
          # with this job's uid and gid, added to copies of the image's own account files and
          # mounted read-only; nothing comes from the runner's account database.
          image=python:3.12-slim-bookworm
          uid=$(id -u)
          gid=$(id -g)
          [ "$uid" != 0 ] || { echo "::error::the staging user must not be root"; exit 1; }
          accounts="$RUNNER_TEMP/accounts"
          mkdir -p "$accounts"
          docker run --rm "$image" cat /etc/passwd > "$accounts/passwd"
          docker run --rm "$image" cat /etc/group > "$accounts/group"
          if awk -F: -v id="$uid" '$3 == id { found = 1 } END { exit !found }' "$accounts/passwd"; then
            echo "::error::uid $uid already has an account in $image"
            exit 1
          fi
          echo "orca-stage:x:$uid:$gid:ORCA staging:$srv:/usr/sbin/nologin" >> "$accounts/passwd"
          awk -F: -v id="$gid" '$3 == id { found = 1 } END { exit !found }' "$accounts/group" ||
            echo "orca-stage:x:$gid:" >> "$accounts/group"
          # The image has Python 3 and util-linux; it has no gh, git, mise, pnpm or Node.
          docker run --rm --user "$uid:$gid" -e HOME="$srv" -v "$clean:$clean" -w "$srv" \
            -v "$accounts/passwd:/etc/passwd:ro" -v "$accounts/group:/etc/group:ro" \
            "$image" sh -c '
              name=$(python3 -I -c "import os, pwd; print(pwd.getpwuid(os.getuid()).pw_name)")
              if [ "$name" != orca-stage ] || [ "$(id -u)" = 0 ]; then
                echo "staging runs as uid $(id -u) ($name), not the non-root orca-stage" >&2
                exit 1
              fi
              for tool in gh git mise pnpm node; do
                if command -v "$tool" >/dev/null; then echo "clean host has $tool" >&2; exit 1; fi
              done
              exec python3 -I "$0/adapter/orca-release.py" --deployment "$1/deployment.json" stage --bundle "$0/bundle"
            ' "$clean" "$srv"
          if ! test -f "$srv/releases/v$VERSION/.orca-release.json"; then
            ls -la "$srv/releases"
            echo "::error::v$VERSION was not staged"
            exit 1
          fi
          echo "Staged v$VERSION from the signed bundle on a clean host (Python 3 only)." >> "$GITHUB_STEP_SUMMARY"

      # Only after the clean-host stage passed: the receipt commits to the release id, version,
      # commit and the exact digests of the three files this job verified. The attach job
      # uploads only those bytes and carries the receipt in its own name, which is what
      # release-attach.sh publish requires before a final goes public.
      - name: The receipt for exactly these bytes
        id: receipt
        env:
          ID: ${{ needs.resolve.outputs.id }}
          SHA: ${{ inputs.source_sha }}
          VERSION: ${{ inputs.version }}
        run: bash tools/deploy/release-attach.sh server-receipt "$ID" "$SHA" "$VERSION" "$RUNNER_TEMP/clean/bundle" >> "$GITHUB_OUTPUT"

  attach:
    # The receipt: release-attach.sh publish requires a successful job of exactly this name.
    name: "server bundle receipt: release ${{ needs.resolve.outputs.id }} v${{ inputs.version }} ${{ inputs.source_sha }} ${{ needs.verify.outputs.receipt }}"
    needs: [resolve, verify]
    runs-on: ubuntu-24.04
    # In the shared draft-writes queue with every other job that rewrites a release's notes
    # (the signed attach, arm64 acceptance, the upgrade check record, publish final): each reads
    # the whole body and replaces it, so two of them must never interleave or one would drop the
    # other's record. `queue: max` keeps every waiting member instead of replacing the pending
    # one. The workflow-level group still serializes this workflow's runs for one version.
    concurrency:
      group: release-draft-writes
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: server-bundle
          path: bundle

      - name: Upload and record
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ID: ${{ needs.resolve.outputs.id }}
          SHA: ${{ inputs.source_sha }}
          VERSION: ${{ inputs.version }}
          VERIFIED: ${{ needs.verify.outputs.digests }}
        run: |
          set -euo pipefail
          # The bytes the clean-host job verified, and nothing else.
          [ "$(bash tools/deploy/release-attach.sh server-receipt "$ID" "$SHA" "$VERSION" bundle | sed -n 's/^digests=//p')" = "$VERIFIED" ] ||
            { echo "::error::the files to attach are not the ones the clean-host job verified"; exit 1; }
          bash tools/deploy/release-attach.sh server-attach "$ID" "$SHA" "$VERSION" "$GITHUB_RUN_ID" bundle

  reconcile:
    name: dispatch bundles still missing
    if: github.event_name == 'schedule' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Dispatch the bundle for releases without one
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: bash tools/deploy/release-attach.sh server-reconcile
