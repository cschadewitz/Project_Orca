# Launch the desktop app in a real Electron window: once against a real daemon, and once
# more on each platform at `#type` to check the bundled faces by machine. Release and manual
# runs verify the full matrix against their supplied ref. Native macOS/Windows also prove
# encrypted admission-intent recovery and the real-UI revision workflow across process restart.
#
# Separate from ci.yml on purpose. That workflow sets `ELECTRON_SKIP_BINARY_DOWNLOAD=1` —
# it typechecks, lints and builds the app but never runs it, and skipping the ~100 MB
# binary keeps every one of its matrix legs fast. This one needs that binary, so it
# installs without the flag. It no longer runs automatically on pull requests: CI is the
# only pre-merge workflow. Release calls still run every job against the exact merge commit
# before publication; a manual run can verify a branch or produce screenshot evidence.
# The supplied ref makes the existing classifier run the complete type-proof matrix.
# Manual runs may opt into Tyler for every Linux job. Release calls retain homelab.
name: App smoke

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "The branch or commit to smoke-test, type-proof and verify native intent/revision acceptance"
        required: true
        type: string
        default: main
      linux_runner:
        description: Linux runner pool; Tyler still requires the existing display and sandbox prerequisites.
        type: choice
        options: [homelab, tyler]
        default: homelab
        required: true
  workflow_call:
    inputs:
      ref:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: app-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: classify app checks
    runs-on: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.linux_runner == 'tyler' && '["self-hosted","linux","x64","tyler"]' || '["self-hosted","linux","x64","homelab"]') }}
    outputs:
      type_proof: ${{ steps.classify.outputs.type_proof }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Pull requests need the merge base for BASE...HEAD.
          # Release verification checks out the exact merge commit.
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Classify
        id: classify
        env:
          RELEASE_REF: ${{ inputs.ref }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [ -n "$RELEASE_REF" ]; then
            echo "release verification; running the type proof matrix"
            echo "type_proof=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          type_paths=$(
            git diff --name-only "$BASE...$HEAD" |
              awk '/^packages\/app\// ||
                   /^packages\/design\// ||
                   /^pnpm-lock\.yaml$/ ||
                   /^\.github\/workflows\/app-smoke\.yml$/'
          )

          if [ -n "$type_paths" ]; then
            echo "changes can affect the type proof:"
            printf '  %s\n' $type_paths
            echo "type_proof=true" >> "$GITHUB_OUTPUT"
          else
            echo "daemon/protocol-only change; skipping the type proof matrix"
            echo "type_proof=false" >> "$GITHUB_OUTPUT"
          fi

  smoke:
    name: electron smoke test
    runs-on: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.linux_runner == 'tyler' && '["self-hosted","linux","x64","tyler"]' || '["self-hosted","linux","x64","homelab"]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      # Must precede setup-node: `cache: pnpm` needs the pnpm binary on PATH to
      # resolve the store path. Version comes from package.json packageManager.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # One version: this is about the app running at all, not about Node support.
          # `mise.toml` pins 24, so that is what a developer reproduces locally.
          node-version: 24
          cache: pnpm

      # Deliberately without ELECTRON_SKIP_BINARY_DOWNLOAD: the binary is the point.
      # Playwright needs no browser download — the only driver used is Electron's.
      - run: pnpm install --frozen-lockfile

      # The self-hosted image must provide xvfb and unprivileged user namespaces.
      # Check the prerequisite without changing the host's security policy or bypassing
      # Chromium's sandbox with `--no-sandbox` / ORCA_SMOKE_NO_SANDBOX.
      - name: Check the Linux display and sandbox prerequisites
        run: |
          command -v xvfb-run
          if ! unshare --user --map-root-user true; then
            echo "::error::The self-hosted runner must support unprivileged user namespaces for Chromium's sandbox."
            exit 1
          fi

      # Electron's binary, on disk before any test's clock is running.
      #
      # `pnpm-workspace.yaml` allows electron's postinstall, but the pnpm store this job
      # restores is keyed on the lockfile and shared with `ci.yml`, which installs under
      # ELECTRON_SKIP_BINARY_DOWNLOAD=1. So the store can hold an electron that is *built*
      # and has no binary, and `pnpm install` above has nothing left to run — its log shows
      # esbuild's postinstall and not electron's. `node_modules/electron/index.js` then
      # fetches the binary on first `require`, through a blocking `spawnSync`, inside
      # whichever test hook reached it first.
      #
      # Hygiene rather than a fix: it is five seconds on a Windows runner, so it was never
      # the three-minute hang it was briefly blamed for (`playwright.config.ts` records that
      # dead end). What it buys is that the download is not inside a hook's timeout and has
      # its own line in the step list, which is where a download belongs.
      #
      # From `packages/app`, the package that depends on electron: pnpm's node_modules is
      # strict, so the root has no `electron` to resolve and the first attempt at this step
      # failed with MODULE_NOT_FOUND.
      - name: Put the Electron binary on disk, rather than inside a test's timeout
        shell: bash
        working-directory: packages/app
        run: node -e "console.log(require('electron'))"

      # The smoke test runs the built app and the built CLI, not the sources.
      - name: Build
        run: pnpm run build

      # No display server on a runner; the app's own flags are inside the spec, so there
      # is nothing here for xvfb-run to swallow.
      - name: Smoke test
        run: xvfb-run -a pnpm run app:smoke

      # Screenshots of both themes, the greyscale pictures, the axe results per surface and
      # a trace for anything that failed. None of these is a baseline — see the spec header.
      - name: Upload the smoke test's output
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: app-smoke
          path: |
            test-results/
            playwright-report/
          # Release calls supply a ref; PR and standalone outputs only need one week.
          retention-days: ${{ inputs.ref && 14 || 7 }}
          if-no-files-found: ignore

  # The second job diffs `#type` on the three platforms ORCA ships to. Its existing native
  # macOS/Windows runners also run an independent built-app safeStorage acceptance test.
  # (#213). The `smoke` job above stays on Linux alone, because what it is about is the app
  # coming up at all and three runners would buy one answer three times.
  #
  # `#type` is dev-only — `renderer/src/routes.tsx` gates it behind `import.meta.env.DEV` so
  # it never reaches a shipped bundle — so the spec starts a Vite dev server and points the
  # main process at it with `ORCA_RENDERER_URL`, exactly as `packages/app/scripts/dev.js`
  # does. The type spec compiles main and preload itself; the separate native-intent step
  # builds the actual production renderer and CLI after preserving the type-proof report.
  type-proof:
    name: type proof (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.type_proof == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      # Every leg is a different answer to the same question. A Windows failure must not
      # cancel the macOS run that would have told us whether the glyph is wrong everywhere.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runner: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.linux_runner == 'tyler' && '["self-hosted","linux","x64","tyler"]' || '["self-hosted","linux","x64","homelab"]') }}
          - os: macos-latest
            runner: macos-latest
          - os: windows-latest
            runner: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Record workflow and checked-out revision
        shell: bash
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          TEST_REF: ${{ inputs.ref || github.sha }}
        run: |
          echo "workflow definition: $WORKFLOW_REF @ $WORKFLOW_SHA"
          echo "requested test ref: $TEST_REF"
          echo "checked-out test SHA: $(git rev-parse HEAD)"

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # Without ELECTRON_SKIP_BINARY_DOWNLOAD, as above: the binary is the point.
      - run: pnpm install --frozen-lockfile

      # As in the smoke job: provision the self-hosted image, never relax its security
      # policy from a job. Native macOS and Windows do not use these Linux prerequisites.
      - name: Check the Linux display and sandbox prerequisites
        if: runner.os == 'Linux'
        run: |
          command -v xvfb-run
          if ! unshare --user --map-root-user true; then
            echo "::error::The self-hosted runner must support unprivileged user namespaces for Chromium's sandbox."
            exit 1
          fi

      # As in the `smoke` job above, and this is the job that found it.
      # From `packages/app`, which is the package that depends on electron: pnpm's node_modules
      # is strict, so the root has no `electron` to resolve and the first attempt at this step
      # failed with MODULE_NOT_FOUND.
      - name: Put the Electron binary on disk, rather than inside a test's timeout
        id: native-electron
        shell: bash
        working-directory: packages/app
        run: node -e "console.log(require('electron'))"

      # Two steps for one command, for the same reason: there is no display server on a
      # Linux runner and no xvfb on the other two.
      - name: Type proof (Linux, under xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm run app:type-proof

      - name: Type proof
        if: runner.os != 'Linux'
        run: pnpm run app:type-proof

      # The baselines *and* the report. On the first run for a platform there is no
      # committed baseline, so Playwright writes the actual image to the baseline path and
      # fails the job; downloading this artifact and committing what is in it is how the
      # three platforms' baselines are created. Afterwards this carries the diff instead.
      # `docs/DEVELOPMENT.md`, "Screenshot baselines", is the procedure.
      - name: Upload the type proof's screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: type-proof-${{ matrix.os }}
          path: |
            packages/app/test/smoke/type-proof.spec.ts-snapshots/
            test-results/
            playwright-report/
          # Release calls supply a ref; PR and standalone outputs only need one week.
          retention-days: ${{ inputs.ref && 14 || 7 }}
          if-no-files-found: ignore

      # Preserve the independent type verdict/report first. A type-baseline failure must
      # not suppress native acceptance, and a native failure must not erase type evidence.
      # Reuse these hosted runners; never install a Linux keyring or change host security.
      - name: Build the native acceptance app and daemon
        id: native-intent-build
        if: ${{ !cancelled() && runner.os != 'Linux' && steps.native-electron.outcome == 'success' }}
        run: pnpm run build

      - name: Native encrypted admission-intent restart acceptance
        if: ${{ !cancelled() && runner.os != 'Linux' && steps.native-intent-build.outcome == 'success' }}
        timeout-minutes: 10
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-admission-intents
        run: pnpm run app:admission-intents

      - name: Upload native admission-intent acceptance evidence
        if: ${{ !cancelled() && runner.os != 'Linux' }}
        uses: actions/upload-artifact@v7
        with:
          name: admission-intents-${{ matrix.os }}
          path: |
            test-results/admission-intents/
            playwright-report-admission-intents/
          retention-days: ${{ inputs.ref && 14 || 7 }}
          if-no-files-found: ignore

      # Independent of the encrypted-storage verdict: preserve its report above, then
      # exercise actual revision controls and protected prompt delivery on the same build.
      - name: Native revision workflow acceptance
        if: ${{ !cancelled() && runner.os != 'Linux' && steps.native-intent-build.outcome == 'success' }}
        timeout-minutes: 10
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-revision-workflow
        run: pnpm run app:revision-workflow

      - name: Upload native revision workflow acceptance evidence
        if: ${{ !cancelled() && runner.os != 'Linux' }}
        uses: actions/upload-artifact@v7
        with:
          name: revision-workflow-${{ matrix.os }}
          path: |
            test-results/revision-workflow/
            playwright-report-revision-workflow/
          retention-days: ${{ inputs.ref && 14 || 7 }}
          if-no-files-found: ignore
