# The Claude Agent SDK driver (#1120) against a real, pinned Claude Code. A scripted local
# stand-in answers for the model, so the run needs no account, key or secret and costs
# nothing. It observes on the installed Claude Code what the stand-in `claude` of the unit
# tests cannot: Claude Code's own model list and its answers to model and effort changes, the
# deny-only tool gate and Claude Code's own permission ask meeting a real tool call, cancel,
# and that close leaves no Claude Code behind. It runs the SSH host route over a real loopback
# sshd (#1130). It then runs the #706 enforcement cases through
# the same Claude Code on this route (#1128) and keeps the connected receipt, and writes the
# route's installed receipt through the bundled session factory (#1128), kept unsigned.
#
# The Claude Code installed here is the person's own install in shape: Claude Code's native
# binary package, outside the workspace, never the CLI the Agent SDK bundles (which the
# driver refuses). CLAUDE_CODE_VERSION is the one the pinned SDK in packages/agents was
# verified with; moving either is a reviewed change. Weekly runs catch a change in behaviour
# behind the same pin.
name: Claude Agent SDK acceptance

on:
  pull_request:
    branches: [main, feature/claude-agent-sdk]
    paths:
      - packages/agents/src/claude-sdk/**
      - packages/agents/src/permissions.ts
      - packages/agents/src/policy-call.ts
      - packages/agents/src/claude-pre-tool-hook.ts
      - packages/agents/src/hook-telemetry.ts
      - packages/agents/src/claude-acp-title.ts
      - packages/agents/src/secrets.ts
      - packages/agents/src/mcp-relay.ts
      - packages/agents/src/claude-code-options.ts
      - packages/agents/package.json
      - packages/cli/src/bootstrap.ts
      - packages/cli/test/claude-sdk-acceptance-1120.test.ts
      - packages/agents/src/hosts/ssh-host.ts
      - packages/agents/test/claude-sdk-ssh-native-1130.test.ts
      - tools/guard-qualification/**
      - tools/test/enforcement-connected-sdk-1128.test.js
      - tools/test/enforcement-installed-claude-sdk-1128.test.js
      - pnpm-lock.yaml
      - .github/workflows/claude-sdk-acceptance.yml
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: claude-sdk-acceptance-${{ github.ref }}
  cancel-in-progress: true

env:
  # A pinned pair in CLAUDE_SDK_VERIFIED_PAIRS (claude-sdk/attestation.ts, #1124): the suite
  # asserts this Claude Code attests.
  CLAUDE_CODE_VERSION: 2.1.332

jobs:
  linux:
    name: claude agent sdk acceptance (linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: Install the pinned Claude Code outside the workspace
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/claude-code"
          mkdir -p "$d"
          cd "$d"
          npm init -y >/dev/null
          npm install --no-audit --no-fund --ignore-scripts "@anthropic-ai/claude-code-linux-x64@${CLAUDE_CODE_VERSION}"
          bin="$d/node_modules/@anthropic-ai/claude-code-linux-x64/claude"
          chmod +x "$bin"
          "$bin" --version | grep -F "$CLAUDE_CODE_VERSION"
          echo "ORCA_CLAUDE_SDK_CLAUDE=$bin" >> "$GITHUB_ENV"

      # Claude Code's command sandbox (sandbox: on, #1134) runs on bubblewrap and socat. Ubuntu
      # 24.04 keeps unprivileged user namespaces behind AppArmor, which bubblewrap needs.
      - name: Install Claude Code's sandbox prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap socat
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --ro-bind / / true

      - name: Run the acceptance tests
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec vitest run packages/cli/test/claude-sdk-acceptance-1120.test.ts \
            --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/acceptance.json"
          # The suite is skipped without a Claude Code; here every test has to have run.
          node -e '
            const r = require(process.argv[1]);
            if (r.numTotalTests === 0 || r.numPendingTests > 0 || r.numPassedTests !== r.numTotalTests)
              throw new Error(`expected every acceptance test to run and pass: ${JSON.stringify({total: r.numTotalTests, passed: r.numPassedTests, skipped: r.numPendingTests})}`);
          ' "$RUNNER_TEMP/acceptance.json"

      # Claude Code on an SSH host (#1130) over a real loopback sshd: no environment value in any
      # argument list on either side, and close, a lost connection and a cancelled open leave
      # nothing running there. Required here, so a missing or broken sshd fails.
      - name: Install sshd
        run: command -v /usr/sbin/sshd >/dev/null || { sudo apt-get update -q && sudo apt-get install -yq openssh-server; }
      - name: Run the SSH host tests over a real sshd (#1130)
        shell: bash
        env:
          ORCA_REQUIRE_SSHD: "1"
        run: |
          set -euo pipefail
          pnpm exec vitest run packages/agents/test/claude-sdk-ssh-native-1130.test.ts \
            --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/ssh-native.json"
          node -e '
            const r = require(process.argv[1]);
            if (r.numTotalTests === 0 || r.numPendingTests > 0 || r.numPassedTests !== r.numTotalTests)
              throw new Error(`expected every SSH host test to run and pass: ${JSON.stringify({total: r.numTotalTests, passed: r.numPassedTests, skipped: r.numPendingTests})}`);
          ' "$RUNNER_TEMP/ssh-native.json"

      - name: Run the enforcement suite through the live agent on this route (#706, #1128)
        shell: bash
        env:
          ORCA_ENFORCEMENT_RECEIPT_DIR: ${{ runner.temp }}/enforcement-receipts
        run: |
          set -euo pipefail
          pnpm exec vitest run tools/test/enforcement-connected-sdk-1128.test.js \
            --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/connected.json"
          node -e '
            const r = require(process.argv[1]);
            if (r.numTotalTests === 0 || r.numPendingTests > 0 || r.numPassedTests !== r.numTotalTests)
              throw new Error(`expected every connected case to run and pass: ${JSON.stringify({total: r.numTotalTests, passed: r.numPassedTests, skipped: r.numPendingTests})}`);
          ' "$RUNNER_TEMP/connected.json"

      - name: Write the installed receipt for the SDK route (#1128)
        shell: bash
        env:
          ORCA_ENFORCEMENT_RECEIPT_DIR: ${{ runner.temp }}/enforcement-receipts
        run: |
          set -euo pipefail
          pnpm exec vitest run tools/test/enforcement-installed-claude-sdk-1128.test.js \
            --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/installed.json"
          node -e '
            const r = require(process.argv[1]);
            if (r.numTotalTests === 0 || r.numPendingTests > 0 || r.numPassedTests !== r.numTotalTests)
              throw new Error(`expected every installed test to run and pass: ${JSON.stringify({total: r.numTotalTests, passed: r.numPassedTests, skipped: r.numPendingTests})}`);
          ' "$RUNNER_TEMP/installed.json"
          test -f "$RUNNER_TEMP/enforcement-receipts/claude-sdk-claude-sdk-hook.json"

      # Unsigned: guard-receipts.yml is the one signer the checker accepts, and signing this
      # route's receipt there is the next part of #1128.
      - name: Keep the connected and installed receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: enforcement-claude-sdk-receipts
          path: ${{ runner.temp }}/enforcement-receipts/
          if-no-files-found: warn
          retention-days: 30
