# The Claude Agent SDK driver (#1120) against a real, pinned Claude Code. A scripted local
# stand-in answers for the model, so the run needs no account, key or secret and costs
# nothing. It observes on the installed Claude Code what the stand-in `claude` of the unit
# tests cannot: Claude Code's own model list and its answers to model and effort changes, the
# deny-only tool gate and Claude Code's own permission ask meeting a real tool call, cancel,
# and that close leaves no Claude Code behind.
#
# The Claude Code installed here is the person's own install in shape: Claude Code's native
# binary package, outside the workspace, never the CLI the Agent SDK bundles (which the
# driver refuses). CLAUDE_CODE_VERSION is the one the pinned SDK in packages/agents was
# verified with; moving either is a reviewed change. Weekly runs catch a change in behaviour
# behind the same pin.
name: Claude Agent SDK acceptance

on:
  pull_request:
    branches: [main, feature/claude-agent-sdk]
    paths:
      - packages/agents/src/claude-sdk/**
      - packages/agents/src/permissions.ts
      - packages/agents/src/policy-call.ts
      - packages/agents/src/claude-pre-tool-hook.ts
      - packages/agents/src/claude-acp-title.ts
      - packages/agents/package.json
      - packages/cli/src/bootstrap.ts
      - packages/cli/test/claude-sdk-acceptance-1120.test.ts
      - pnpm-lock.yaml
      - .github/workflows/claude-sdk-acceptance.yml
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: claude-sdk-acceptance-${{ github.ref }}
  cancel-in-progress: true

env:
  CLAUDE_CODE_VERSION: 2.1.332

jobs:
  linux:
    name: claude agent sdk acceptance (linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: Install the pinned Claude Code outside the workspace
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/claude-code"
          mkdir -p "$d"
          cd "$d"
          npm init -y >/dev/null
          npm install --no-audit --no-fund --ignore-scripts "@anthropic-ai/claude-code-linux-x64@${CLAUDE_CODE_VERSION}"
          bin="$d/node_modules/@anthropic-ai/claude-code-linux-x64/claude"
          chmod +x "$bin"
          "$bin" --version | grep -F "$CLAUDE_CODE_VERSION"
          echo "ORCA_CLAUDE_SDK_CLAUDE=$bin" >> "$GITHUB_ENV"

      - name: Run the acceptance tests
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec vitest run packages/cli/test/claude-sdk-acceptance-1120.test.ts \
            --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/acceptance.json"
          # The suite is skipped without a Claude Code; here every test has to have run.
          node -e '
            const r = require(process.argv[1]);
            if (r.numTotalTests === 0 || r.numPendingTests > 0 || r.numPassedTests !== r.numTotalTests)
              throw new Error(`expected every acceptance test to run and pass: ${JSON.stringify({total: r.numTotalTests, passed: r.numPassedTests, skipped: r.numPendingTests})}`);
          ' "$RUNNER_TEMP/acceptance.json"
