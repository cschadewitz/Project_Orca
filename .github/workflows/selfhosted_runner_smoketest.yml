name: self-hosted smoke test
on: workflow_dispatch

jobs:
  smoke:
    runs-on: [self-hosted, linux, x64, homelab]
    steps:
      - uses: actions/checkout@v7
      - name: Environment
        run: |
          whoami; uname -m; nproc
          git --version
          git log -1 --oneline
      - name: LAN must be blocked
        env:
          # A LAN host and port jobs must not reach, as host/port. A secret, not a
          # variable: logs print variable values in the step's env, but mask secrets.
          PROBE: ${{ secrets.LAN_PROBE_TARGET }}
        run: |
          if [[ -z "$PROBE" ]]; then
            echo "::error::set the repository secret LAN_PROBE_TARGET (host/port)"; exit 1
          fi
          if timeout 5 bash -c "</dev/tcp/${PROBE}" 2>/dev/null; then
            echo "::error::LAN target reachable from a job - firewall is not applied"; exit 1
          fi
          echo "LAN blocked (expected)"
