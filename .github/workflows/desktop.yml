# The two release artifacts, built on the platforms they run on: the desktop app, packaged
# per platform by electron-builder, and the daemon it bundles.
#
# Separate from `ci.yml` on purpose, and for the same reason `app-smoke.yml` is: that
# workflow sets `ELECTRON_SKIP_BINARY_DOWNLOAD=1` and never launches the app, and putting a
# three-runner Electron packaging matrix on every pull request would make the repository's
# cheapest check its most expensive one. This workflow installs the Electron binary because
# packaging is exactly what needs it.
#
# `release-publish.yml` calls it (`workflow_call`) against the merge commit it is about to
# tag, then attaches what comes out to the GitHub release — so the daemon inside the desktop
# artifact and the daemon beside it are one build of one commit, and their protocol versions
# agree by construction rather than by review (docs/RELEASING.md).
#
# Packaging runs on manual dispatch and release calls only. Pull requests run CI without
# launching or packaging Electron; dispatch this workflow to verify packaging before release.
name: Desktop

on:
  workflow_call:
    inputs:
      ref:
        description: The commit to build. Defaults to whatever the caller checked out.
        type: string
        required: false
      version:
        description: The version to stamp into the artifacts. Defaults to the root package.json's.
        type: string
        required: false
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  # A pull request's older run is worth cancelling; a release's is not — `release-publish.yml`
  # is waiting on it and there is nothing behind it to supersede it.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing is a fact about that platform, and the other two artifacts are
      # still worth having in the run's output while it is being diagnosed.
      fail-fast: false
      matrix:
        include:
          - os: [self-hosted, linux, x64, homelab]
            name: linux
            cache_path: |
              ~/.cache/electron
              ~/.cache/electron-builder
          - os: macos-latest
            name: macos
            cache_path: |
              ~/Library/Caches/electron
              ~/Library/Caches/electron-builder
          - os: windows-latest
            name: windows
            # actions/cache expands ~ on Windows; it does not expand %LOCALAPPDATA%.
            cache_path: |
              ~\AppData\Local\electron\Cache
              ~\AppData\Local\electron-builder\Cache
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      # Must precede setup-node: `cache: pnpm` needs the pnpm binary on PATH to
      # resolve the store path. Version comes from package.json packageManager.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # One version: this is about producing an artifact, not about Node support.
          # `mise.toml` pins 24, so that is what a developer reproduces locally.
          node-version: 24
          cache: pnpm

      # setup-node caches pnpm's store, not the Electron archives or electron-builder's
      # platform tools. Keep these platform-specific; the package step consumes both x64
      # and arm64 downloads on the same runner.
      - name: Restore Electron downloads
        uses: actions/cache@v6
        with:
          path: ${{ matrix.cache_path }}
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-${{ runner.os }}-${{ runner.arch }}-

      # Deliberately *without* ELECTRON_SKIP_BINARY_DOWNLOAD, unlike every other workflow
      # here: the Electron binary is what electron-builder packages.
      - run: pnpm install --frozen-lockfile

      # The version the release carries lives in the root package.json; the packages under
      # packages/ all sit at 0.1.0 and never move (docs/RELEASING.md).
      - name: The version to stamp
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="${{ inputs.version }}"
          if [ -z "$version" ]; then version=$(node -p 'require("./package.json").version'); fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "packaging $version"

      # `tsc -b` for main and preload, Vite for the renderer (docs/DEVELOPMENT.md).
      - name: Build
        run: pnpm run build

      # One ESM file with the whole daemon inlined, from the CLI that was just built.
      - name: Build the bundled daemon
        run: pnpm --filter @orca/app run build:daemon

      # Authenticate the freshly built standalone bundle on every runner before packaging.
      # The helper owns its child and disposable workspace, bounds waits/output, and prints
      # only sanitized evidence. This is not packaged-app or signed native Mac acceptance.
      - name: The bundled daemon answers authenticated hello
        run: node tools/probe-bundled-daemon.js

      # Node-API 8 is ABI-stable across the packaged Electron runtime. Fetch official
      # headers for this exact setup-node runtime, verify the archive before unpacking,
      # then reuse the explicit local compiler stage for every configured Mac target.
      # This ordinary lane remains unsigned; staging never activates diagnostics.
      - name: Stage native addons for all requested Mac architectures
        if: matrix.name == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          node_version=$(node -p 'process.versions.node')
          case "$node_version" in *[!0-9.]*|'') exit 1 ;; esac
          headers_scratch=$(mktemp -d "$RUNNER_TEMP/orca-native-headers.XXXXXX")
          trap 'rm -rf -- "$headers_scratch"' EXIT
          archive="node-v${node_version}-headers.tar.gz"
          base="https://nodejs.org/download/release/v${node_version}"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --max-time 60 --max-filesize 16777216 \
            "$base/$archive" --output "$headers_scratch/$archive"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --max-time 30 --max-filesize 65536 \
            "$base/SHASUMS256.txt" --output "$headers_scratch/SHASUMS256.txt"
          (cd "$headers_scratch"; ARCHIVE="$archive" python3 - <<'PY'
          import os, pathlib, re
          name = os.environ["ARCHIVE"]
          entries = [line for line in pathlib.Path("SHASUMS256.txt").read_text().splitlines()
                     if re.fullmatch(r"[0-9a-f]{64}  " + re.escape(name), line)]
          if len(entries) != 1:
              raise SystemExit("Exact Node header checksum unavailable")
          pathlib.Path("headers.sha256").write_text(entries[0] + "\n")
          PY
          shasum -a 256 -c headers.sha256)
          tar -xzf "$headers_scratch/$archive" -C "$headers_scratch"
          node tools/packaged-mac/stage-native-addons.js --headers "$headers_scratch/node-v${node_version}"

      # Reuse the runner's installed MSVC/SDK. Both PE targets are required by the
      # existing Windows config. No capture, signing or workflow dispatch here.
      - name: Stage native addons for all requested Windows architectures
        if: matrix.name == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          node_version=$(node -p 'process.versions.node')
          case "$node_version" in *[!0-9.]*|'') exit 1 ;; esac
          headers_scratch=$(mktemp -d "$RUNNER_TEMP/orca-win-native-headers.XXXXXX")
          trap 'rm -rf -- "$headers_scratch"' EXIT
          archive="node-v${node_version}-headers.tar.gz"
          base="https://nodejs.org/download/release/v${node_version}"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --max-time 30 --max-filesize 65536 \
            "$base/SHASUMS256.txt" --output "$headers_scratch/SHASUMS256.txt"
          for name in "$archive" win-x64/node.lib win-arm64/node.lib; do
            mkdir -p "$headers_scratch/$(dirname "$name")"
            curl --proto '=https' --tlsv1.2 --fail --silent --show-error --max-time 60 --max-filesize 16777216 \
              "$base/$name" --output "$headers_scratch/$name"
            CHECKSUM_ROOT="$headers_scratch" CHECKSUM_NAME="$name" python - <<'PY'
          import hashlib, os, pathlib, re
          root, name = pathlib.Path(os.environ["CHECKSUM_ROOT"]), os.environ["CHECKSUM_NAME"]
          entries = [line[:64] for line in (root / "SHASUMS256.txt").read_text().splitlines()
                     if re.fullmatch(r"[0-9a-f]{64}  " + re.escape(name), line)]
          if len(entries) != 1 or hashlib.sha256((root / name).read_bytes()).hexdigest() != entries[0]:
              raise SystemExit("Exact Node input checksum unavailable or mismatched")
          PY
          done
          tar -xzf "$headers_scratch/$archive" -C "$headers_scratch"
          for arch in x64 arm64; do
            mkdir -p "$headers_scratch/node-v${node_version}/$arch"
            cp "$headers_scratch/win-$arch/node.lib" "$headers_scratch/node-v${node_version}/$arch/node.lib"
          done
          node tools/packaged-windows/stage-native-addons.js --headers "$headers_scratch/node-v${node_version}"

      # electron-builder finds packages/app/electron-builder.yml by name; `-c.` overrides one
      # value in it. `exec` rather than `run package` so that no stray `--` reaches yargs.
      #
      # `shell: bash` because the default on the Windows runner is PowerShell, which does not
      # pass `-c.extraMetadata.version=<v>` through as one token. yargs then sees a bare `-c`
      # and reads the rest as the *path to a config file*, so the job fails with
      # `ENOENT: ... open '.extraMetadata.version=0.3.0'` — a packaging error that is really
      # an argument-quoting one. bash is present on all three runners and parses it the same
      # way everywhere, which is what this step wants.
      - name: Package
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if [ "${{ matrix.name }}" = windows ]; then
            channel=latest
            case "$VERSION" in *-*) channel=prerelease ;; esac
            for arch in x64 arm64; do
              # Explicit targets keep win.target's two-architecture defaults from
              # adding the other architecture to this build and duplicating assets.
              pnpm --filter @orca/app exec electron-builder --win nsis zip --"$arch" --publish never \
                -c.extraMetadata.version="$VERSION" -c.directories.output="dist/release/$arch" \
                -c.publish.channel="$channel-$arch"
            done
          else
            pnpm --filter @orca/app exec electron-builder --publish never -c.extraMetadata.version="$VERSION"
          fi

      # The definition of done, as far as a runner can check it: launch the packaged app
      # with no daemon running and nothing in `ORCA_DAEMON_URL`, and see the bundled daemon
      # come up under it. The app forwards the daemon's own output (`onLog` in
      # src/main/index.ts), so its listening line appearing in the app's log is the
      # bundled daemon having been found, spawned and answered.
      #
      # Linux only: it is the one runner with a display server to fake and a process table
      # to read. What the other two prove is that their artifact builds and that the daemon
      # inside it runs, which is the part that differs per platform.
      - name: The packaged app starts its own daemon
        if: matrix.name == 'linux'
        run: |
          set -euo pipefail
          # Check the provisioned runner without changing its host security policy.
          command -v xvfb-run
          command -v setsid
          if ! unshare --user --map-root-user true; then
            echo "::error::The self-hosted runner must support unprivileged user namespaces for Chromium's sandbox."
            exit 1
          fi
          profile=$(mktemp -d)
          setsid xvfb-run -a packages/app/dist/release/linux-unpacked/orca \
            --user-data-dir="$profile" > app.log 2>&1 &
          app=$!
          # The display, app and bundled daemon share this job's own process group.
          trap 'kill -- "-$app" 2>/dev/null || true' EXIT
          for _ in $(seq 1 60); do
            if grep -q 'listening on http://127.0.0.1:' app.log; then break; fi
            sleep 1
          done
          echo '--- the packaged app said ---'
          cat app.log
          grep -q 'listening on http://127.0.0.1:' app.log
          pgrep -af -g "$app" orca-daemon.mjs

      # The standalone daemon artifact, named for the release. Built once and taken from the
      # Linux leg: it is one ESM file with no platform in it, and three identical copies on
      # a release page would only raise the question of which one to take.
      - name: Name the daemon artifact
        if: matrix.name == 'linux'
        shell: bash
        run: cp packages/app/dist/daemon/orca-daemon.mjs "packages/app/dist/release/orca-daemon-${{ steps.version.outputs.version }}.mjs"

      # Installers, archives and Windows update metadata/sidecars. Unpacked app directories
      # stay out; the updater needs the blockmaps beside the installers.
      - name: Upload the artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.name }}
          path: |
            packages/app/dist/release/*.AppImage
            packages/app/dist/release/*.tar.gz
            packages/app/dist/release/*.dmg
            packages/app/dist/release/*.zip
            packages/app/dist/release/*.exe
            packages/app/dist/release/*.mjs
            packages/app/dist/release/x64/*.exe
            packages/app/dist/release/x64/*.zip
            packages/app/dist/release/x64/*.blockmap
            packages/app/dist/release/x64/*-x64.yml
            packages/app/dist/release/arm64/*.exe
            packages/app/dist/release/arm64/*.zip
            packages/app/dist/release/arm64/*.blockmap
            packages/app/dist/release/arm64/*-arm64.yml
          if-no-files-found: error
          # Release calls supply a ref; PR and standalone outputs only need one week.
          retention-days: ${{ inputs.ref && 14 || 7 }}
          # Installers and archives are already compressed; another pass only burns CPU.
          compression-level: 0

      # Whatever the packaging said, when it failed to say anything useful.
      - name: Upload the packaging log
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.name }}-logs
          path: |
            app.log
          if-no-files-found: ignore
          # Release calls supply a ref; PR and standalone outputs only need one week.
          retention-days: ${{ inputs.ref && 14 || 7 }}
