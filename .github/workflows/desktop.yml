# The two release artifacts, built on the platforms they run on: the desktop app, packaged
# per platform by electron-builder, and the daemon it bundles.
#
# Separate from `ci.yml` on purpose, and for the same reason `app-smoke.yml` is: that
# workflow sets `ELECTRON_SKIP_BINARY_DOWNLOAD=1` and never launches the app, and putting a
# three-runner Electron packaging matrix on every pull request would make the repository's
# cheapest check its most expensive one. This workflow installs the Electron binary because
# packaging is exactly what needs it.
#
# `release-publish.yml` calls it (`workflow_call`) against the merge commit it is about to
# tag, then attaches what comes out to the GitHub release — so the daemon inside the desktop
# artifact and the daemon beside it are one build of one commit, and their protocol versions
# agree by construction rather than by review (docs/RELEASING.md).
#
# Packaging runs on manual dispatch and release calls only. Pull requests run CI without
# launching or packaging Electron; dispatch this workflow to verify packaging before release.
name: Desktop

on:
  workflow_call:
    inputs:
      ref:
        description: The commit to build. Defaults to whatever the caller checked out.
        type: string
        required: false
      version:
        description: The version to stamp into the artifacts. Defaults to the root package.json's.
        type: string
        required: false
      hosted_only:
        description: Never route to self-hosted runners (release rehearsals of arbitrary refs).
        type: boolean
        required: false
        default: false
      caches:
        description: >-
          Restore and save the pnpm and Electron download caches. A release rehearsal builds an
          arbitrary ref in the default branch's cache scope, so it passes false: that ref's
          install scripts must not write a cache a trusted run later restores.
        type: boolean
        required: false
        default: true
    secrets:
      CI_RUNNER_HEALTH_URL:
        description: The runner health endpoint; without it, Linux jobs use GitHub-hosted runners.
        required: false
  workflow_dispatch:
    inputs:
      platform:
        description: Platforms to package (reduced selections are preparation, not release acceptance).
        type: choice
        options: [all, windows, windows-linux]
        default: all
        required: true

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  # A pull request's older run is worth cancelling; a release's is not — `release-publish.yml`
  # is waiting on it and there is nothing behind it to supersede it.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  targets:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      # The workflow's own commit, not inputs.ref: the code that picks runners and the
      # matrix is never the code under test (the same rule as app-smoke.yml's picker).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: tools
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # No automatic npm cache detected from the checked-out package.json (it may be a rehearsed ref's).
          package-manager-cache: false
      # Linux packaging runs GitHub-hosted for now: Tyler's hosts run out of disk building the
      # x64 and arm64 archives (ENOSPC on tyler-1/2/3, Nov 2026). To go back to Tyler's runners
      # when one is idle (tools/linux-runner.js), restore
      # `${{ inputs.hosted_only && 'true' || vars.CI_FORCE_HOSTED }}` here; keep hosted_only.
      - id: pick
        env:
          FORCE_HOSTED: "true"
          HEALTH_URL: ${{ secrets.CI_RUNNER_HEALTH_URL }}
        run: node tools/linux-runner.js
      - id: select
        env:
          DESKTOP_EVENT_NAME: ${{ github.event_name }}
          DESKTOP_PLATFORM: ${{ inputs.platform || 'all' }}
          DESKTOP_LINUX_RUNNER: ${{ steps.pick.outputs.runner }}
        run: |
          set -euo pipefail
          matrix=$(node tools/desktop-matrix.js)
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"

  package:
    needs: targets
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing is a fact about that platform, and the other two artifacts are
      # still worth having in the run's output while it is being diagnosed.
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          # Nothing in this job pushes or fetches, and some of its runners are persistent
          # self-hosted hosts: leave no token in .git/config for the job's duration.
          persist-credentials: false

      # Must precede setup-node: `cache: pnpm` needs the pnpm binary on PATH to
      # resolve the store path. Version comes from package.json packageManager.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # One version: this is about producing an artifact, not about Node support.
          # `mise.toml` pins 24, so that is what a developer reproduces locally.
          node-version: 24
          # No automatic npm cache detected from the checked-out package.json (it may be a rehearsed ref's).
          package-manager-cache: false
          # Off for a caller that builds an untrusted ref (see the `caches` input).
          cache: ${{ inputs.caches != false && 'pnpm' || '' }}

      # setup-node caches pnpm's store, not the Electron archives or electron-builder's
      # platform tools. Keep these platform-specific; the package step consumes both x64
      # and arm64 downloads on the same runner.
      - name: Restore Electron downloads
        if: ${{ inputs.caches != false }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ matrix.cache_path }}
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-${{ runner.os }}-${{ runner.arch }}-

      # Deliberately *without* ELECTRON_SKIP_BINARY_DOWNLOAD, unlike every other workflow
      # here: the Electron binary is what electron-builder packages.
      - run: pnpm install --frozen-lockfile

      # The version the release carries lives in the root package.json; the packages under
      # packages/ all sit at 0.1.0 and never move (docs/RELEASING.md).
      - name: The version to stamp
        id: version
        shell: bash
        env:
          # Data, never spliced into the script: the caller's version arrives as a variable.
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="$VERSION"
          if [ -z "$version" ]; then version=$(node -p 'require("./package.json").version'); fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::not a semver version; nothing packaged"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "packaging $version"

      # `tsc -b` for main and preload, Vite for the renderer (docs/DEVELOPMENT.md).
      - name: Build
        run: pnpm run build

      # One ESM file with the whole daemon inlined, from the CLI that was just built.
      - name: Build the bundled daemon
        run: pnpm --filter @orca/app run build:daemon

      # Authenticate the freshly built standalone bundle on every runner before packaging.
      # The helper owns its child and disposable workspace, bounds waits/output, and prints
      # only sanitized evidence. This is not packaged-app or signed native Mac acceptance.
      - name: The bundled daemon answers authenticated hello
        run: node tools/probe-bundled-daemon.js

      # Node-API 8 is ABI-stable across the packaged Electron runtime. Fetch official
      # headers for this exact setup-node runtime, verify the archive before unpacking,
      # then reuse the explicit local compiler stage for every configured Mac target.
      # This ordinary lane remains unsigned; staging never activates diagnostics.
      - name: Stage native addons for all requested Mac architectures
        if: matrix.name == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          node_version=$(node -p 'process.versions.node')
          case "$node_version" in *[!0-9.]*|'') exit 1 ;; esac
          headers_scratch=$(mktemp -d "$RUNNER_TEMP/orca-native-headers.XXXXXX")
          trap 'rm -rf -- "$headers_scratch"' EXIT
          archive="node-v${node_version}-headers.tar.gz"
          base="https://nodejs.org/download/release/v${node_version}"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --max-time 60 --max-filesize 16777216 \
            "$base/$archive" --output "$headers_scratch/$archive"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --max-time 30 --max-filesize 65536 \
            "$base/SHASUMS256.txt" --output "$headers_scratch/SHASUMS256.txt"
          (cd "$headers_scratch"; ARCHIVE="$archive" python3 - <<'PY'
          import os, pathlib, re
          name = os.environ["ARCHIVE"]
          entries = [line for line in pathlib.Path("SHASUMS256.txt").read_text().splitlines()
                     if re.fullmatch(r"[0-9a-f]{64}  " + re.escape(name), line)]
          if len(entries) != 1:
              raise SystemExit("Exact Node header checksum unavailable")
          pathlib.Path("headers.sha256").write_text(entries[0] + "\n")
          PY
          shasum -a 256 -c headers.sha256)
          tar -xzf "$headers_scratch/$archive" -C "$headers_scratch"
          node tools/packaged-mac/stage-native-addons.js --headers "$headers_scratch/node-v${node_version}"

      # Reuse the runner's installed MSVC/SDK. Both PE targets are required by the
      # existing Windows config. No capture, signing or workflow dispatch here.
      - name: Stage native addons for all requested Windows architectures
        if: matrix.name == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          node_version=$(node -p 'process.versions.node')
          case "$node_version" in *[!0-9.]*|'') exit 1 ;; esac
          headers_scratch=$(mktemp -d "$RUNNER_TEMP/orca-win-native-headers.XXXXXX")
          trap 'rm -rf -- "$headers_scratch"' EXIT
          archive="node-v${node_version}-headers.tar.gz"
          base="https://nodejs.org/download/release/v${node_version}"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --max-time 30 --max-filesize 65536 \
            "$base/SHASUMS256.txt" --output "$headers_scratch/SHASUMS256.txt"
          for name in "$archive" win-x64/node.lib win-arm64/node.lib; do
            mkdir -p "$headers_scratch/$(dirname "$name")"
            curl --proto '=https' --tlsv1.2 --fail --silent --show-error --max-time 60 --max-filesize 16777216 \
              "$base/$name" --output "$headers_scratch/$name"
            CHECKSUM_ROOT="$headers_scratch" CHECKSUM_NAME="$name" python - <<'PY'
          import hashlib, os, pathlib, re
          root, name = pathlib.Path(os.environ["CHECKSUM_ROOT"]), os.environ["CHECKSUM_NAME"]
          entries = [line[:64] for line in (root / "SHASUMS256.txt").read_text().splitlines()
                     if re.fullmatch(r"[0-9a-f]{64}  " + re.escape(name), line)]
          if len(entries) != 1 or hashlib.sha256((root / name).read_bytes()).hexdigest() != entries[0]:
              raise SystemExit("Exact Node input checksum unavailable or mismatched")
          PY
          done
          # GNU tar in Git Bash reads a drive-letter archive path as host:path.
          # Use the verified archive's basename from its directory instead.
          (cd "$headers_scratch" && tar -xzf "$archive")
          for arch in x64 arm64; do
            mkdir -p "$headers_scratch/node-v${node_version}/$arch"
            cp "$headers_scratch/win-$arch/node.lib" "$headers_scratch/node-v${node_version}/$arch/node.lib"
          done
          node tools/packaged-windows/stage-native-addons.js --headers "$headers_scratch/node-v${node_version}"

      # electron-builder finds packages/app/electron-builder.yml by name; `-c.` overrides one
      # value in it. `exec` rather than `run package` so that no stray `--` reaches yargs.
      #
      # `shell: bash` because the default on the Windows runner is PowerShell, which does not
      # pass `-c.extraMetadata.version=<v>` through as one token. yargs then sees a bare `-c`
      # and reads the rest as the *path to a config file*, so the job fails with
      # `ENOENT: ... open '.extraMetadata.version=0.3.0'` — a packaging error that is really
      # an argument-quoting one. bash is present on all three runners and parses it the same
      # way everywhere, which is what this step wants.
      - name: Package
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if [ "${{ matrix.name }}" = windows ]; then
            channel=latest
            case "$VERSION" in *-*) channel=prerelease ;; esac
            for arch in x64 arm64; do
              # Explicit targets keep win.target's two-architecture defaults from
              # adding the other architecture to this build and duplicating assets.
              pnpm --filter @orca/app exec electron-builder --win nsis zip --"$arch" --publish never \
                -c.extraMetadata.version="$VERSION" -c.directories.output="dist/release/$arch" \
                -c.publish.channel="$channel-$arch"
            done
          else
            pnpm --filter @orca/app exec electron-builder --publish never -c.extraMetadata.version="$VERSION"
          fi

      # The CLI (#1207). A fresh GitHub-hosted VM only: this installs the app for the runner's
      # account and edits that account's PATH, which no persistent host should have done to
      # it. The x64 installer, silently and per user, as a person's default install is. A
      # step's own environment is the runner's, not the registry's, so every PATH check
      # reads HKCU\Environment the way a new terminal would.
      - name: The Windows installer puts orca-cli on the user PATH and takes it off again
        if: matrix.name == 'windows' && runner.environment == 'github-hosted'
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $installers = @(Get-ChildItem "packages/app/dist/release/x64/ORCA-*-win-x64.exe")
          if ($installers.Count -ne 1) { throw "expected one x64 installer, found $($installers.Count)" }
          $userPath = { [Environment]::GetEnvironmentVariable('Path', 'User') }
          $before = & $userPath
          $p = Start-Process -FilePath $installers[0].FullName -ArgumentList '/S', '/currentuser' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "the installer exited $($p.ExitCode)" }
          $exe = @(Get-ChildItem "$env:LOCALAPPDATA\Programs\*\ORCA.exe")
          if ($exe.Count -ne 1) { throw "expected one installed ORCA.exe, found $($exe.Count)" }
          $app = $exe[0].DirectoryName
          $bin = Join-Path $app 'resources\bin'
          Write-Output "installed at $app"
          # Exactly one entry added, at the end, and nothing else changed.
          $after = & $userPath
          $expected = if ([string]::IsNullOrEmpty($before)) { $bin } elseif ($before.EndsWith(';')) { $before + $bin } else { "$before;$bin" }
          if ($after -ne $expected) { throw "user PATH after install: '$after', expected '$expected'" }
          if (@(Get-ChildItem $bin).Name -join ',' -ne 'orca-cli.cmd') { throw "resources\bin holds more than orca-cli.cmd" }
          # As a new terminal would find it: the machine PATH, then the user's, as Windows
          # composes them, and PATHEXT resolving `orca-cli` to the .cmd.
          $env:Path = [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + $after
          if ((Get-Command orca-cli).Source -ne (Join-Path $bin 'orca-cli.cmd')) { throw "orca-cli resolved to $((Get-Command orca-cli).Source)" }
          $out = orca-cli --version
          if ($LASTEXITCODE -ne 0) { throw "orca-cli --version exited $LASTEXITCODE" }
          if (($out | Select-Object -Last 1) -ne $env:VERSION) { throw "orca-cli --version said '$out', expected '$env:VERSION'" }
          if (-not ((orca-cli --help) -match 'Orchestration Runtime for Coding Agents')) { throw "orca-cli --help did not print ORCA's usage" }
          orca-cli no-such-command *> $null
          if ($LASTEXITCODE -eq 0) { throw "orca-cli passed a failing exit code through as 0" }
          Write-Output "orca-cli $env:VERSION from a new terminal's PATH"
          # The uninstaller hands itself to a copy in %TEMP% and returns, so wait for its effect.
          $uninstaller = Join-Path $app 'Uninstall ORCA.exe'
          Start-Process -FilePath $uninstaller -ArgumentList '/S', '/currentuser' -Wait
          $deadline = (Get-Date).AddSeconds(120)
          while ((Test-Path (Join-Path $bin 'orca-cli.cmd')) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 2 }
          if (Test-Path (Join-Path $bin 'orca-cli.cmd')) { throw "the uninstaller did not remove the app" }
          $final = & $userPath
          if ($final -ne $before) { throw "user PATH after uninstall: '$final', expected '$before'" }
          Write-Output "uninstalled; user PATH restored"

      # GitHub-hosted fallback only; never runs on a self-hosted runner. Ubuntu 24.04 keeps
      # unprivileged user namespaces, which Chromium's sandbox needs, behind AppArmor. Rather
      # than lift that for the whole VM, load a profile that grants `userns` to the one
      # Electron executable this job launches, resolved through symlinks, and check that
      # the restriction stays on for everything else. Here that executable is
      # the packaged app. The profile is otherwise
      # unconfined: it is a scoped exception, not a sandbox for the app. Its path is in the
      # runner-writable workspace, and the job user has passwordless sudo on these VMs, so
      # it is no boundary against job code; it keeps the default for other programs.
      - name: Prepare a GitHub-hosted Linux runner
        if: matrix.name == 'linux' && runner.environment == 'github-hosted'
        env:
          ELECTRON_EXE: packages/app/dist/release/linux-unpacked/orca-desktop
        run: |
          set -euo pipefail
          command -v xvfb-run || { sudo apt-get update -q && sudo apt-get install -y -q xvfb; }
          exe=$(readlink -f "$ELECTRON_EXE")
          test -x "$exe"
          sudo sysctl -q -w kernel.apparmor_restrict_unprivileged_userns=1
          printf '%s\n' 'abi <abi/4.0>,' 'include <tunables/global>' \
            "profile orca-electron-userns \"$exe\" flags=(unconfined) {" '  userns,' '}' \
            | sudo tee /etc/apparmor.d/orca-electron-userns > /dev/null
          sudo apparmor_parser -r /etc/apparmor.d/orca-electron-userns
          sudo grep -q '^orca-electron-userns ' /sys/kernel/security/apparmor/profiles
          test "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = 1
          if unshare --user --map-root-user true 2> /dev/null; then
            echo "::error::an unrelated executable can still create user namespaces"; exit 1
          fi
          echo "user namespaces: allowed only for $exe (profile orca-electron-userns)"

      # The definition of done, as far as a runner can check it: launch the packaged app
      # with no daemon running, nothing in `ORCA_DAEMON_URL` and a disposable `ORCA_WORKSPACE`
      # as its explicit target, and see the bundled daemon come up under it. (A bare first
      # launch opens disconnected for setup by design; the first-run selection path is not
      # covered here.) The app forwards the daemon's own output (`onLog` in
      # src/main/index.ts), so its listening line appearing in the app's log is the
      # bundled daemon having been found, spawned and answered.
      #
      # Linux only: it is the one runner with a display server to fake and a process table
      # to read. What the other two prove is that their artifact builds and that the daemon
      # inside it runs, which is the part that differs per platform.
      - name: The packaged app starts its own daemon
        if: matrix.name == 'linux'
        run: |
          set -euo pipefail
          # Check the provisioned runner without changing its host security policy. A
          # GitHub-hosted fallback was prepared and checked by the step above instead.
          command -v xvfb-run
          command -v setsid
          if [[ "$RUNNER_ENVIRONMENT" != "github-hosted" ]] && ! unshare --user --map-root-user true; then
            echo "::error::The self-hosted runner must support unprivileged user namespaces for Chromium's sandbox."
            exit 1
          fi
          # Under RUNNER_TEMP, which the runner empties after each job, so persistent
          # self-hosted runners keep no profile, store or local-client token from this run.
          profile=$(mktemp -d "$RUNNER_TEMP/orca-app-profile.XXXXXX")
          # Without an explicit target or a verified first-run selection the app opens
          # disconnected for setup by design (src/main/index.ts), so give it a disposable
          # workspace: that is the explicit target that makes it start its bundled daemon.
          workspace=$(mktemp -d "$RUNNER_TEMP/orca-app-workspace.XXXXXX")
          env -u ORCA_DAEMON_URL ORCA_WORKSPACE="$workspace" setsid xvfb-run -a packages/app/dist/release/linux-unpacked/orca-desktop \
            --user-data-dir="$profile" > app.log 2>&1 &
          app=$!
          # The display, app and bundled daemon share this job's own process group.
          trap 'kill -- "-$app" 2>/dev/null || true; sleep 1; rm -rf "$profile" "$workspace" || true' EXIT
          for _ in $(seq 1 60); do
            if grep -q 'listening on http://127.0.0.1:' app.log; then break; fi
            sleep 1
          done
          echo '--- the packaged app said ---'
          cat app.log
          grep -q 'listening on http://127.0.0.1:' app.log
          pgrep -af -g "$app" orca-daemon.mjs

      # The supported Ubuntu 24.04 install (#853), as a tester gets it: the x64 .deb through
      # apt, on a host whose `kernel.apparmor_restrict_unprivileged_userns` is on, launched
      # from its installed path with the sandbox on and no profile of this job's own. The
      # prepare step above only covers linux-unpacked/orca-desktop; the installed copy is a
      # different file, so the package's own install script has to provide the exception or
      # Chromium aborts before the first window, as the rc.2 tarball did. Then: the bundled
      # daemon answers, renderers run in their own user namespace (the sandbox is really on),
      # SIGTERM shuts the app and its daemon down, and removing the package removes the
      # profile. GitHub-hosted only: it installs into /opt and /etc with sudo, which a
      # persistent self-hosted runner must not be asked to do.
      #
      # Ubuntu Desktop ships the GNOME screen reader as package `orca` (/usr/bin/orca,
      # orca.desktop). It is installed first, and must come through the install and the
      # removal of ORCA's package untouched: same version, same owner of its files.
      - name: The .deb installs and launches sandboxed on stock Ubuntu
        if: matrix.name == 'linux' && runner.environment == 'github-hosted'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          debs=(packages/app/dist/release/ORCA-*-linux-amd64.deb)
          test "${#debs[@]}" = 1
          deb=$(readlink -f "${debs[0]}")
          # The exact packages this run produced, for the record.
          (cd packages/app/dist/release && sha256sum ORCA-*.deb ORCA-*.tar.gz ORCA-*.AppImage) | tee -a "$GITHUB_STEP_SUMMARY"

          # Every payload member by numeric mode: owned by root, no setuid, setgid or sticky
          # bit anywhere, nothing group- or other-writable but symlinks. The install script,
          # not the archive, sets the helper's mode.
          dpkg-deb --fsys-tarfile "$deb" | python3 -c '
          import sys, tarfile
          bad = []
          with tarfile.open(fileobj=sys.stdin.buffer, mode="r|") as tar:
              n = 0
              for m in tar:
                  n += 1
                  if m.uid or m.gid or m.mode & 0o7000 or (not m.issym() and m.mode & 0o022):
                      bad.append(f"{m.mode:04o} {m.uid}:{m.gid} {m.name}")
                  if m.name in ("./opt/ORCA/orca-desktop", "./opt/ORCA/chrome-sandbox"):
                      print(f"{m.mode:04o} {m.name}")
          print(f"{n} payload members checked")
          if bad:
              print("\n".join(bad)); sys.exit("::error::the .deb carries owned, special-bit or writable entries")
          '
          # The package's own identity, and no claim on the screen reader's.
          test "$(dpkg-deb -f "$deb" Package)" = orca-desktop
          for field in Conflicts Breaks Replaces Provides Pre-Depends; do
            test -z "$(dpkg-deb -f "$deb" "$field")"
          done
          if dpkg-deb -c "$deb" | awk '{ print $NF }' | grep -E '^\./usr/bin/orca$|/orca\.desktop$|apparmor\.d/orca$|^\./usr/share/mime/'; then
            echo "::error::the .deb ships a path the screen reader or the MIME database owns"; exit 1
          fi

          # The maintainer scripts as generated. postinst is the repository's
          # (build/linux/after-install.tpl): helper always 0755, never setuid; no cache
          # refreshes (dpkg triggers do that); the scoped profile, and a refusal if the
          # restriction is on and the profile could not load. postrm is electron-builder's.
          scripts=$(mktemp -d "$RUNNER_TEMP/orca-deb-control.XXXXXX")
          dpkg-deb -e "$deb" "$scripts"
          ls -ln "$scripts"
          test "$(stat -c %a "$scripts/postinst")" = 755
          test "$(stat -c %a "$scripts/postrm")" = 755
          # One command per check: under `set -e` a failure before the last command of an
          # && list does not stop the step.
          for unexpected in preinst prerm triggers config templates; do
            if [ -e "$scripts/$unexpected" ]; then echo "::error::the .deb carries an unexpected $unexpected"; exit 1; fi
          done
          for script in postinst postrm; do
            if ! bash -n "$scripts/$script"; then echo "::error::$script is not valid bash"; exit 1; fi
          done
          grep -qx "EXECUTABLE='/opt/ORCA/orca-desktop'" "$scripts/postinst"
          grep -qx "HELPER='/opt/ORCA/chrome-sandbox'" "$scripts/postinst"
          grep -qx 'chmod 0755 "$HELPER"' "$scripts/postinst"
          grep -q "update-alternatives --install '/usr/bin/orca-desktop' 'orca-desktop' \"\$EXECUTABLE\" 100" "$scripts/postinst"
          grep -qx "PROFILE_TARGET='/etc/apparmor.d/orca-desktop'" "$scripts/postinst"
          grep -q "update-alternatives --remove 'orca-desktop' '/opt/ORCA/orca-desktop'" "$scripts/postrm"
          grep -q "APPARMOR_PROFILE_DEST='/etc/apparmor.d/orca-desktop'" "$scripts/postrm"
          # Code only: the template's comments name what it deliberately does not do.
          if grep -hvE '^[[:space:]]*#' "$scripts/postinst" "$scripts/postrm" \
            | grep -nE '4755|[0-7]?[4-7][0-7]{3}[^0-9]|chmod [ug]?\+s|u\+s|update-mime-database|update-desktop-database|no-sandbox|apparmor_restrict_unprivileged_userns=0'; then
            echo "::error::a maintainer script can make the helper setuid, weaken the sandbox or refresh caches"; exit 1
          fi
          if grep -nE "/usr/bin/orca'|alternatives/orca'|apparmor\.d/orca'|'orca'" "$scripts/postinst" "$scripts/postrm"; then
            echo "::error::a maintainer script touches the screen reader's names"; exit 1
          fi
          rm -rf "$scripts"

          test "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = 1
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends orca
          reader() { dpkg-query -W -f '${Status} ${Version}\n' orca; dpkg -S /usr/bin/orca; readlink -f /usr/bin/orca; }
          before=$(reader)
          echo "screen reader: $before"
          sudo apt-get install -y -q "$deb"
          test "$(reader)" = "$before"
          dpkg-query -W -f '${Status}\n' orca-desktop | grep -q 'install ok installed'
          test "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = 1
          sudo grep -q '^orca-desktop ' /sys/kernel/security/apparmor/profiles

          # Installed, before any launch: modes as numbers (%a shows special bits), owners,
          # and the entry point a user's launcher and menu resolve to.
          stat -c '%a %U:%G %n' /opt/ORCA/orca-desktop /opt/ORCA/chrome-sandbox
          test "$(stat -c '%a %u:%g' /opt/ORCA/chrome-sandbox)" = '755 0:0'
          test "$(stat -c '%a %u:%g' /opt/ORCA/orca-desktop)" = '755 0:0'
          special=$(sudo find /opt/ORCA \( -perm /7000 -o \( ! -type l -perm /022 \) -o ! -user root \) -print)
          if [ -n "$special" ]; then echo "$special"; echo "::error::installed files are special-bit, writable or not root's"; exit 1; fi
          test "$(readlink -f /usr/bin/orca-desktop)" = /opt/ORCA/orca-desktop
          test "$(readlink -f "$(command -v orca-desktop)")" = /opt/ORCA/orca-desktop
          grep -qx 'Exec=/opt/ORCA/orca-desktop %U' /usr/share/applications/orca-desktop.desktop
          if grep -q '^MimeType=' /usr/share/applications/orca-desktop.desktop; then
            echo "::error::the desktop entry declares MIME types this package does not document"; exit 1
          fi
          if unshare --user --map-root-user true 2> /dev/null; then
            echo "::error::an unrelated executable can still create user namespaces"; exit 1
          fi
          # The launch below is the runner's own unprivileged account, never sudo.
          test "$(id -u)" != 0

          # The CLI (#1207): /usr/bin/orca-cli belongs to this package, and with the screen
          # reader installed beside it, the command reaches this build of ORCA.
          test "$(dpkg -S /usr/bin/orca-cli)" = 'orca-desktop: /usr/bin/orca-cli'
          test "$(stat -c '%a %u:%g' /usr/bin/orca-cli /opt/ORCA/resources/bin/orca-cli)" = "$(printf '755 0:0\n755 0:0')"
          test "$(command -v orca-cli)" = /usr/bin/orca-cli
          test "$(orca-cli --version)" = "$VERSION"
          orca-cli --help | grep -q 'Orchestration Runtime for Coding Agents'
          test "$(reader)" = "$before"

          profile=$(mktemp -d "$RUNNER_TEMP/orca-deb-profile.XXXXXX")
          workspace=$(mktemp -d "$RUNNER_TEMP/orca-deb-workspace.XXXXXX")
          env -u ORCA_DAEMON_URL ORCA_WORKSPACE="$workspace" setsid xvfb-run -a orca-desktop \
            --user-data-dir="$profile" > deb-app.log 2>&1 &
          group=$!
          trap 'kill -- "-$group" 2>/dev/null || true; sleep 1; rm -rf "$profile" "$workspace" || true' EXIT
          for _ in $(seq 1 60); do
            if grep -q 'listening on http://127.0.0.1:' deb-app.log; then break; fi
            sleep 1
          done
          echo '--- the installed app said ---'
          cat deb-app.log
          grep -q 'listening on http://127.0.0.1:' deb-app.log
          pgrep -af -g "$group" orca-daemon.mjs
          if grep -q 'SUID sandbox helper' deb-app.log; then
            echo "::error::Chromium fell back to the SUID sandbox"; exit 1
          fi

          # The browser process is the installed binary with no --type; a sandboxed renderer
          # lives in a user namespace of its own. Found by executable, not by argv[0], which
          # is whatever the launcher typed (here `orca-desktop`, through /usr/bin).
          installed() {
            for pid in $(pgrep -f 'orca' || true); do
              [ "$(readlink "/proc/$pid/exe" 2> /dev/null)" = /opt/ORCA/orca-desktop ] && echo "$pid"
            done
            return 0
          }
          main=; renderer=
          for pid in $(installed); do
            args=$(tr '\0' ' ' < "/proc/$pid/cmdline")
            case "$args" in
              # The bundled daemon is the same executable run as Node, with no --type either.
              *orca-daemon.mjs*) ;;
              *--type=renderer*) renderer=${renderer:-$pid} ;;
              *--type=*) ;;
              *) main=${main:-$pid} ;;
            esac
          done
          if [ -z "$main" ] || [ -z "$renderer" ]; then echo "::error::no browser ($main) or renderer ($renderer) process found"; exit 1; fi
          if [ "$(readlink "/proc/$main/ns/user")" = "$(readlink "/proc/$renderer/ns/user")" ]; then
            echo "::error::the renderer shares the browser's user namespace: no namespace sandbox"; exit 1
          fi
          echo "browser $main, renderer $renderer in $(readlink "/proc/$renderer/ns/user")"

          kill -TERM "$main"
          for _ in $(seq 1 30); do
            if [ -z "$(installed)" ] && ! pgrep -f orca-daemon.mjs > /dev/null; then break; fi
            sleep 1
          done
          if [ -n "$(installed)" ] || pgrep -af orca-daemon.mjs; then
            echo "::error::the app or its daemon outlived SIGTERM"; exit 1
          fi

          sudo apt-get remove -y -q orca-desktop
          test ! -e /etc/apparmor.d/orca-desktop
          test ! -e /usr/bin/orca-cli
          if sudo grep -q '^orca-desktop ' /sys/kernel/security/apparmor/profiles; then
            echo "::error::removing the package left its AppArmor profile loaded"; exit 1
          fi
          test "$(reader)" = "$before"
          echo "screen reader unchanged: $(reader)"

      # The standalone daemon artifact, named for the release. Built once and taken from the
      # Linux leg: it is one ESM file with no platform in it, and three identical copies on
      # a release page would only raise the question of which one to take.
      - name: Name the daemon artifact
        if: matrix.name == 'linux'
        shell: bash
        run: cp packages/app/dist/daemon/orca-daemon.mjs "packages/app/dist/release/orca-daemon-${{ steps.version.outputs.version }}.mjs"

      # Installers, archives and Windows update metadata/sidecars. Unpacked app directories
      # stay out; the updater needs the blockmaps beside the installers.
      - name: Upload the artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.name }}
          path: |
            packages/app/dist/release/*.AppImage
            packages/app/dist/release/*.tar.gz
            packages/app/dist/release/*.deb
            packages/app/dist/release/*.dmg
            packages/app/dist/release/*.zip
            packages/app/dist/release/*.exe
            packages/app/dist/release/*.mjs
            packages/app/dist/release/x64/*.exe
            packages/app/dist/release/x64/*.zip
            packages/app/dist/release/x64/*.blockmap
            packages/app/dist/release/x64/*-x64.yml
            packages/app/dist/release/arm64/*.exe
            packages/app/dist/release/arm64/*.zip
            packages/app/dist/release/arm64/*.blockmap
            packages/app/dist/release/arm64/*-arm64.yml
          if-no-files-found: error
          # Release calls supply a ref; PR and standalone outputs only need one week.
          retention-days: ${{ inputs.ref && 14 || 7 }}
          # Installers and archives are already compressed; another pass only burns CPU.
          compression-level: 0

      # Whatever the packaging said, when it failed to say anything useful.
      - name: Upload the packaging log
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.name }}-logs
          path: |
            app.log
          if-no-files-found: ignore
          # Release calls supply a ref; PR and standalone outputs only need one week.
          retention-days: ${{ inputs.ref && 14 || 7 }}
