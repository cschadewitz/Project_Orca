# The store workload benchmark (#341) on its reference machine: a GitHub-hosted
# ubuntu-24.04 runner, Node 24. Runs every scale on every backend (memory, file and
# SQLite) whenever store or benchmark code lands on main, on a pull request that changes
# the benchmark, and on demand, with no one involved. Each report is uploaded as an artifact and summarized in the job summary;
# docs/performance/store-workloads/README.md says how to read them.
name: Store workload benchmark

on:
  push:
    branches: [main]
    paths:
      - packages/store/src/**
      - packages/core/src/**
      - tools/benchmarks/store-workloads/**
      - .github/workflows/store-workloads-bench.yml
  # A change to the benchmark itself is run before it lands.
  pull_request:
    branches: [main]
    paths:
      - tools/benchmarks/store-workloads/**
      - .github/workflows/store-workloads-bench.yml
  workflow_dispatch:
    inputs:
      repeat:
        description: Samples per measurement
        default: "3"

permissions:
  contents: read

concurrency:
  group: store-workloads-bench-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bench:
    name: ${{ matrix.scale }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # One scale per runner, so a large run never shares a machine with a smaller one.
      matrix:
        scale: [small, medium, large]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npx tsc -b packages/store

      - name: Benchmark ${{ matrix.scale }}
        shell: bash
        env:
          SCALE: ${{ matrix.scale }}
          REPEAT: ${{ inputs.repeat || '3' }}
        run: |
          set -euo pipefail
          node tools/benchmarks/store-workloads/run.js --scale "$SCALE" --backend memory,file,sqlite \
            --repeat "$REPEAT" --scratch "$RUNNER_TEMP/bench" --output "store-workloads-$SCALE.json"

      - name: Summarize
        if: always()
        shell: bash
        env:
          SCALE: ${{ matrix.scale }}
        run: |
          [[ -f "store-workloads-$SCALE.json" ]] || exit 0
          node tools/benchmarks/store-workloads/summarize.js "store-workloads-$SCALE.json" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: store-workloads-${{ matrix.scale }}
          path: store-workloads-${{ matrix.scale }}.json
          if-no-files-found: ignore
          retention-days: 90
