# Installed receipts for the #706 support matrix (#1026), produced, signed and proposed with no
# person in the loop.
#
# Each agent job installs its pinned agent the way its acceptance workflow does and runs its
# installed receipt test against a scripted model stand-in (no account, key or spend). The
# `publish` job then signs every receipt with GitHub's artifact attestation (Sigstore, through
# this job's OIDC identity), commits each receipt with its bundle under
# tools/guard-qualification/receipts/, pins each agent's row to the receipt's versions, host and
# build (record-receipts.js), and opens or updates one pull request.
#
# This workflow is the one signer check-support-matrix.js accepts (attestation.js): a receipt
# counts only when it was signed here, on a GitHub-hosted runner, from main or a release line,
# at the commit the receipt names. A receipt from a pull request run is never signed. Tiers are
# not changed here: promoting a row is a reviewed edit in that pull request.
name: Guard receipts

on:
  push:
    branches: [main, "release/*"]
    paths:
      - packages/**
      - tools/guard-qualification/**
      - tools/test/enforcement-installed-*.test.js
      - pnpm-lock.yaml
      - .github/workflows/guard-receipts.yml
      # Its own output: recording receipts must not start another run.
      - "!tools/guard-qualification/receipts/**"
      - "!tools/guard-qualification/support-matrix.json"
      - "!**/*.md"
  pull_request:
    branches: [main]
    paths:
      - tools/guard-qualification/**
      - tools/test/enforcement-installed-*.test.js
      - .github/workflows/guard-receipts.yml
  schedule:
    - cron: "41 5 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guard-receipts-${{ github.ref }}
  cancel-in-progress: true

env:
  CLAUDE_ADAPTER_VERSION: 0.109.1
  OTHER_CLAUDE_SDK_VERSION: 0.3.329
  # As in claude-hook-acceptance.yml: remove once npm serves @anthropic-ai/sdk 1.13.0.
  ANTHROPIC_SDK_OVERRIDE: 1.12.0

jobs:
  claude:
    name: installed receipt (claude, linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: Install the pinned Claude ACP adapter outside the workspace
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/claude-adapter"
          mkdir -p "$d"
          cd "$d"
          npm init -y >/dev/null
          npm pkg set "overrides.@anthropic-ai/sdk=${ANTHROPIC_SDK_OVERRIDE}"
          npm install --no-audit --no-fund --ignore-scripts "@agentclientprotocol/claude-agent-acp@${CLAUDE_ADAPTER_VERSION}"
          entry="$d/node_modules/@agentclientprotocol/claude-agent-acp/dist/index.js"
          test -f "$entry"
          echo "ORCA_CLAUDE_ADAPTER=$entry" >> "$GITHUB_ENV"

      - name: Install a Claude Code the adapter is not paired with
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/claude-other"
          mkdir -p "$d"
          cd "$d"
          npm init -y >/dev/null
          npm install --no-audit --no-fund --ignore-scripts "@anthropic-ai/claude-agent-sdk-linux-x64@${OTHER_CLAUDE_SDK_VERSION}"
          bin="$d/node_modules/@anthropic-ai/claude-agent-sdk-linux-x64/claude"
          "$bin" --version
          echo "ORCA_CLAUDE_OTHER_RUNTIME=$bin" >> "$GITHUB_ENV"

      - name: Run the installed receipt test
        shell: bash
        env:
          ORCA_ENFORCEMENT_RECEIPT_DIR: ${{ runner.temp }}/receipts
        run: |
          set -euo pipefail
          pnpm exec vitest run tools/test/enforcement-installed-claude-1026.test.js \
            --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/installed.json"
          # Skipped without the adapter; here every test has to have run and passed.
          node -e '
            const r = require(process.argv[1]);
            if (r.numTotalTests === 0 || r.numPendingTests > 0 || r.numPassedTests !== r.numTotalTests)
              throw new Error(`expected every installed test to run and pass: ${JSON.stringify({total: r.numTotalTests, passed: r.numPassedTests, skipped: r.numPendingTests})}`);
          ' "$RUNNER_TEMP/installed.json"
          test -f "$RUNNER_TEMP/receipts/claude-claude-native-hook.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: guard-receipt-claude
          path: ${{ runner.temp }}/receipts/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: sign and propose receipts
    # Only runs of main or a release line sign anything; a pull request run stops at the receipts.
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))
    needs: [claude]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The optional release App's token makes CI run on the pull request this opens; the
    # environment is main-only with no reviewers, as in release-prepare.yml.
    environment: release-bot
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      attestations: write
    steps:
      - name: Release bot token (optional)
        id: app
        if: ${{ vars.ORCA_RELEASE_APP_ID != '' }}
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.ORCA_RELEASE_APP_ID }}
          private-key: ${{ secrets.ORCA_RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          token: ${{ steps.app.outputs.token || github.token }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: guard-receipt-*
          path: ${{ runner.temp }}/receipts
          merge-multiple: true

      - name: Place the receipts
        id: place
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools/guard-qualification/receipts
          for f in "$RUNNER_TEMP"/receipts/*.json; do
            # Every receipt must name this run's commit; anything else is not this run's.
            build=$(node -e 'console.log(require(process.argv[1]).build)' "$f")
            test "$build" = "$GITHUB_SHA"
            cp "$f" tools/guard-qualification/receipts/
          done
          ls tools/guard-qualification/receipts/*.json

      - name: Attest the receipts
        id: attest
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ github.workspace }}/tools/guard-qualification/receipts/*.json

      - name: Record them in the support matrix
        shell: bash
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          # gh needs a token to verify an attestation, even against a bundle on disk.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          new=()
          for f in "$RUNNER_TEMP"/receipts/*.json; do
            r="tools/guard-qualification/receipts/$(basename "$f")"
            cp "$BUNDLE" "$r.sigstore.json"
            new+=("$r")
          done
          node tools/guard-qualification/record-receipts.js "${new[@]}"
          # Receipts no row lists any more go, with their bundles.
          node -e '
            const fs = require("node:fs");
            const m = JSON.parse(fs.readFileSync("tools/guard-qualification/support-matrix.json", "utf8"));
            const listed = new Set(m.agents.flatMap((a) => a.receipts ?? []));
            for (const f of fs.readdirSync("tools/guard-qualification/receipts")) {
              const p = `tools/guard-qualification/receipts/${f}`;
              const receipt = p.endsWith(".sigstore.json") ? p.slice(0, -".sigstore.json".length) : p;
              if (!listed.has(receipt)) fs.rmSync(p);
            }
          '
          # The structure holds and every listed receipt's attestation verifies.
          node tools/guard-qualification/check-support-matrix.js

      - name: Propose them
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          BASE: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          branch="bot/guard-receipts-${BASE//\//-}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add tools/guard-qualification/receipts tools/guard-qualification/support-matrix.json
          if git diff --cached --quiet; then
            echo "Nothing new to record."
            exit 0
          fi
          git commit -m "Record attested guard receipts for ${GITHUB_SHA::12} (#1026)"
          git push --force origin "$branch"
          body="Installed receipts from [run ${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) at ${GITHUB_SHA}, each signed with GitHub's artifact attestation by guard-receipts.yml. Rows are pinned to the receipts; tiers are unchanged until promoted by a reviewed edit here. @calciferschadewitz for review."
          if [ -z "$(gh pr list --head "$branch" --base "$BASE" --json number --jq '.[].number')" ]; then
            gh pr create --head "$branch" --base "$BASE" --title "Record attested guard receipts (#1026)" --body "$body" --label no-changelog
          else
            gh pr comment "$branch" --body "Updated: $body"
          fi
