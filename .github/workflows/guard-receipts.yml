# Installed receipts for the #706 support matrix (#1026), produced, signed and proposed with no
# person in the loop.
#
# Each agent job installs its pinned agent the way its acceptance workflow does and runs its
# installed receipt test against a scripted model stand-in (no account, key or spend). That is
# all pushes, the schedule and pull requests do. A dispatch on main or a release line with
# `sign` runs the `sign` job, which can attest but not write: it stages only this run's
# validated receipts with a manifest (stage-receipts.js), signs exactly those with GitHub's
# artifact attestation (Sigstore, through its OIDC identity), verifies each attestation, and
# checks the chain end to end (e2e-check.js): with the row at B, the checker must accept this
# run's receipt and refuse a benign verifier test receipt (signed apart) and a byte-tampered
# copy. With `propose` too, the `propose` job, which can write but not attest, verifies what it
# received again, pins each agent's row (record-receipts.js), and opens a pull request from a
# new branch.
#
# This workflow is the one signer check-support-matrix.js accepts (attestation.js): a receipt
# counts only when it was signed here, on a GitHub-hosted runner, from main or a release line,
# at the commit the receipt names. A receipt from a pull request run is never signed. Tiers are
# not changed here: promoting a row is a reviewed edit in that pull request.
name: Guard receipts

on:
  push:
    branches: [main, "release/*"]
    paths:
      - packages/**
      - tools/guard-qualification/**
      - tools/test/enforcement-installed-*.test.js
      - pnpm-lock.yaml
      - .github/workflows/guard-receipts.yml
      # Its own output: recording receipts must not start another run.
      - "!tools/guard-qualification/receipts/**"
      - "!tools/guard-qualification/support-matrix.json"
      - "!**/*.md"
  pull_request:
    branches: [main]
    paths:
      - tools/guard-qualification/**
      - tools/test/enforcement-installed-*.test.js
      - packages/cli/test/codex-installed-evidence-1026.test.ts
      - packages/cli/test/codex-model-stand-in.ts
      - .github/workflows/guard-receipts.yml
  schedule:
    - cron: "41 5 * * 2"
  workflow_dispatch:
    inputs:
      sign:
        description: Sign this run's receipts and check them end to end (authorized runs only)
        type: boolean
        default: false
      propose:
        description: Also open a pull request recording them (needs sign)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: guard-receipts-${{ github.ref }}
  cancel-in-progress: true

env:
  CLAUDE_ADAPTER_VERSION: 0.109.1
  OTHER_CLAUDE_SDK_VERSION: 0.3.329
  # The adapter takes @anthropic-ai/sdk as a floating peer, and the receipt records only the
  # adapter's own integrity, so pin the peer here: a PR run and a later signed run must install
  # the same SDK. (A checked-in lockfile installed with `npm ci` would pin the whole tree.)
  ANTHROPIC_SDK_VERSION: 1.13.0
  # As in codex-hook-acceptance.yml: the pair CODEX_HOOK_VERIFIED_PAIRS admits.
  CODEX_ADAPTER_VERSION: 2.9.0
  CODEX_VERSION: 0.171.0

jobs:
  claude:
    name: installed receipt (claude, linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: Install the pinned Claude ACP adapter outside the workspace
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/claude-adapter"
          mkdir -p "$d"
          cd "$d"
          npm init -y >/dev/null
          npm pkg set "overrides.@anthropic-ai/sdk=${ANTHROPIC_SDK_VERSION}"
          npm install --no-audit --no-fund --ignore-scripts "@agentclientprotocol/claude-agent-acp@${CLAUDE_ADAPTER_VERSION}"
          entry="$d/node_modules/@agentclientprotocol/claude-agent-acp/dist/index.js"
          test -f "$entry"
          echo "ORCA_CLAUDE_ADAPTER=$entry" >> "$GITHUB_ENV"

      - name: Install a Claude Code the adapter is not paired with
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/claude-other"
          mkdir -p "$d"
          cd "$d"
          npm init -y >/dev/null
          npm install --no-audit --no-fund --ignore-scripts "@anthropic-ai/claude-agent-sdk-linux-x64@${OTHER_CLAUDE_SDK_VERSION}"
          bin="$d/node_modules/@anthropic-ai/claude-agent-sdk-linux-x64/claude"
          "$bin" --version
          echo "ORCA_CLAUDE_OTHER_RUNTIME=$bin" >> "$GITHUB_ENV"

      - name: Run the installed receipt test
        shell: bash
        env:
          ORCA_ENFORCEMENT_RECEIPT_DIR: ${{ runner.temp }}/receipts
        run: |
          set -euo pipefail
          pnpm exec vitest run tools/test/enforcement-installed-claude-1026.test.js \
            --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/installed.json"
          # Skipped without the adapter; here every test has to have run and passed.
          node -e '
            const r = require(process.argv[1]);
            if (r.numTotalTests === 0 || r.numPendingTests > 0 || r.numPassedTests !== r.numTotalTests)
              throw new Error(`expected every installed test to run and pass: ${JSON.stringify({total: r.numTotalTests, passed: r.numPassedTests, skipped: r.numPendingTests})}`);
          ' "$RUNNER_TEMP/installed.json"
          test -f "$RUNNER_TEMP/receipts/claude-claude-native-hook.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: guard-receipt-claude
          path: ${{ runner.temp }}/receipts/
          if-no-files-found: error
          retention-days: 30

  # Installed-session evidence for Codex's hook route (#1026), checks-only: allow and deny of a
  # harmless shell command and patch, each effect observed in the workspace apart from the hook.
  # It is evidence, not a receipt: its artifact (guard-evidence-codex) is never staged, signed
  # or proposed (the sign job takes guard-receipt-* only), and it claims no tier.
  codex:
    name: installed evidence (codex, linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: Install the pinned Codex ACP adapter and Codex outside the workspace
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/codex-adapter"
          mkdir -p "$d"
          cd "$d"
          npm init -y >/dev/null
          npm install --no-audit --no-fund --ignore-scripts \
            "@agentclientprotocol/codex-acp@${CODEX_ADAPTER_VERSION}" "@openai/codex@${CODEX_VERSION}"
          test "$(node -p 'require("@openai/codex/package.json").version')" = "$CODEX_VERSION"
          entry="$d/node_modules/@agentclientprotocol/codex-acp/dist/index.js"
          test -f "$entry"
          echo "ORCA_CODEX_ADAPTER=$entry" >> "$GITHUB_ENV"

      - name: Run the installed evidence test
        shell: bash
        env:
          ORCA_ENFORCEMENT_RECEIPT_DIR: ${{ runner.temp }}/evidence
        run: |
          set -euo pipefail
          pnpm exec vitest run packages/cli/test/codex-installed-evidence-1026.test.ts \
            --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/evidence.json"
          # Skipped without the adapter; here every test has to have run and passed.
          node -e '
            const r = require(process.argv[1]);
            if (r.numTotalTests === 0 || r.numPendingTests > 0 || r.numPassedTests !== r.numTotalTests)
              throw new Error(`expected every evidence test to run and pass: ${JSON.stringify({total: r.numTotalTests, passed: r.numPassedTests, skipped: r.numPendingTests})}`);
          ' "$RUNNER_TEMP/evidence.json"
          test -f "$RUNNER_TEMP/evidence/codex-installed-evidence.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: guard-evidence-codex
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: error
          retention-days: 30

  # Signs this run's validated receipts and nothing else. It can attest, and cannot write to the
  # repository: no write token, no release App, no environment. It runs only when a person
  # dispatches the workflow on main or a release line with `sign`; pushes, the schedule and pull
  # requests stop at the receipts until signing is authorized to run on its own (#1026).
  sign:
    name: sign and check receipts
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.sign &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))
    needs: [claude]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: guard-receipt-*
          path: ${{ runner.temp }}/downloaded/receipts
          merge-multiple: true

      # Each receipt is validated (an installed receipt of this commit, for a row and route the
      # matrix lists, under its expected name) and copied into an empty directory with a
      # manifest of names and digests. Only those files are attested.
      # The verifier test receipt is derived from the real one (scoped verifier-test, one
      # asserted case marked failed) and staged apart, for the end-to-end check alone.
      - name: Stage this run's receipts, and the verifier test receipt apart
        shell: bash
        run: |
          set -euo pipefail
          node tools/guard-qualification/stage-receipts.js stage "$RUNNER_TEMP/signed" "$RUNNER_TEMP"/downloaded/receipts/*.json
          mkdir -p "$RUNNER_TEMP/made"
          node tools/guard-qualification/e2e-check.js make-test \
            "$RUNNER_TEMP/signed/claude-claude-native-hook.json" "$RUNNER_TEMP/made/test-claude-native-hook.json"
          node tools/guard-qualification/stage-receipts.js stage "$RUNNER_TEMP/test" "$RUNNER_TEMP/made/test-claude-native-hook.json"

      - name: Attest the receipts
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/signed/*-*.json

      # Its own attestation, so the proposed receipts' bundle covers only them.
      - name: Attest the verifier test receipt
        id: attest-test
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/test/test-*.json

      - name: Pinned GitHub CLI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/guard-qualification/ensure-gh.sh

      - name: Verify the attestations, and check the receipt chain end to end
        shell: bash
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          TEST_BUNDLE: ${{ steps.attest-test.outputs.bundle-path }}
          # gh needs a token to verify an attestation, even against a bundle on disk.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for pair in "signed:$BUNDLE" "test:$TEST_BUNDLE"; do
            d="${pair%%:*}"
            bundle="${pair#*:}"
            for f in $(node -e 'for (const e of require(process.argv[1]).receipts) console.log(e.name)' "$RUNNER_TEMP/$d/manifest.json"); do
              cp "$bundle" "$RUNNER_TEMP/$d/$f.sigstore.json"
            done
            # Every staged receipt's attestation verifies, whatever tier any row claims.
            node tools/guard-qualification/stage-receipts.js verify "$RUNNER_TEMP/$d"
          done
          # With the Claude row at B and pinned to this run's receipt, the checker must accept it,
          # refuse the verifier test receipt and refuse a byte-tampered copy.
          node tools/guard-qualification/e2e-check.js \
            "$RUNNER_TEMP/signed/claude-claude-native-hook.json" "$RUNNER_TEMP/test/test-claude-native-hook.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: guard-signed
          path: ${{ runner.temp }}/signed/
          if-no-files-found: error
          retention-days: 30

  # Proposes what sign verified, as a new branch and pull request. It can write, and cannot attest.
  # Off unless the dispatch also asks for it: the first trusted run only signs and verifies.
  propose:
    name: propose receipts
    needs: [sign]
    if: github.event_name == 'workflow_dispatch' && inputs.propose
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: guard-signed
          path: ${{ runner.temp }}/signed

      - name: Pinned GitHub CLI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/guard-qualification/ensure-gh.sh

      - name: Record them in the support matrix
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # What arrived is exactly what sign staged, and each attestation verifies again here.
          node tools/guard-qualification/stage-receipts.js verify "$RUNNER_TEMP/signed"
          mkdir -p tools/guard-qualification/receipts
          new=()
          for f in $(node -e 'for (const e of require(process.argv[1]).receipts) console.log(e.name)' "$RUNNER_TEMP/signed/manifest.json"); do
            cp "$RUNNER_TEMP/signed/$f" "$RUNNER_TEMP/signed/$f.sigstore.json" tools/guard-qualification/receipts/
            new+=("tools/guard-qualification/receipts/$f")
          done
          node tools/guard-qualification/record-receipts.js "${new[@]}"
          # Receipts no row lists any more go, with their bundles.
          node -e '
            const fs = require("node:fs");
            const m = JSON.parse(fs.readFileSync("tools/guard-qualification/support-matrix.json", "utf8"));
            const listed = new Set(m.agents.flatMap((a) => a.receipts ?? []));
            for (const f of fs.readdirSync("tools/guard-qualification/receipts")) {
              const p = `tools/guard-qualification/receipts/${f}`;
              const receipt = p.endsWith(".sigstore.json") ? p.slice(0, -".sigstore.json".length) : p;
              if (!listed.has(receipt)) fs.rmSync(p);
            }
          '
          # The structure holds and every listed receipt's attestation verifies, at any tier.
          node tools/guard-qualification/check-support-matrix.js

      # A new branch per run (the run id is unique across runs), never rewritten; one that
      # already exists means this run proposed already, and nothing is pushed again.
      - name: Propose them
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          branch="bot/guard-receipts-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "$branch already exists; this run has proposed already."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add tools/guard-qualification/receipts tools/guard-qualification/support-matrix.json
          if git diff --cached --quiet; then
            echo "Nothing new to record."
            exit 0
          fi
          git commit -m "Record attested guard receipts for ${GITHUB_SHA::12} (#1026)"
          git push origin "$branch"
          body="Installed receipts from [run ${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) at ${GITHUB_SHA}, each signed with GitHub's artifact attestation by guard-receipts.yml and verified before this was written. Rows are pinned to the receipts; tiers are unchanged until promoted by a reviewed edit. @calciferschadewitz for review."
          gh pr create --head "$branch" --base "$BASE" --title "Record attested guard receipts for ${GITHUB_SHA::12} (#1026)" --body "$body" --label no-changelog
