# ORCA driving the real Gemini CLI over ACP (#705, tiers A and B), pinned below. A scripted
# local stand-in answers for the Gemini API, so the run needs no account, key or secret and
# costs nothing. It observes on the installed CLI what the unit tests cannot: an ORCA session
# opens, streams and is cancelled; an ORCA allow runs a call once and the next call asks again;
# a deny, a refusal or a cancelled ask does not run; and the calls Gemini runs without asking
# ORCA (read-only tools, its own session and saved grants, YOLO in a trusted workspace).
#
# GEMINI_CLI_VERSION must be listed in GEMINI_CLI_SUPPORT
# (packages/agents/src/agent-profiles/gemini-cli.ts); the suite fails if it is not. Moving to
# another version is a reviewed change to both. A weekly run sees a change in behaviour behind
# the pin. ORCA installs no hook in Gemini; nativeToolHook: on stays refused for it.
name: Gemini ACP acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - packages/agents/src/agent-profiles/**
      - packages/agents/src/acp-session.ts
      - packages/agents/src/permissions.ts
      - packages/cli/test/gemini-acp-acceptance-705.test.ts
      - .github/workflows/gemini-acp-acceptance.yml
  schedule:
    - cron: "47 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gemini-acp-acceptance-${{ github.ref }}
  cancel-in-progress: true

env:
  GEMINI_CLI_VERSION: 0.70.0

jobs:
  linux:
    name: gemini acp acceptance (linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: Install the pinned Gemini CLI outside the workspace
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/gemini-cli"
          mkdir -p "$d"
          cd "$d"
          npm init -y >/dev/null
          npm install --no-audit --no-fund --ignore-scripts "@google/gemini-cli@${GEMINI_CLI_VERSION}"
          test "$(node -p 'require("@google/gemini-cli/package.json").version')" = "$GEMINI_CLI_VERSION"
          entry="$d/node_modules/@google/gemini-cli/bundle/gemini.js"
          test -f "$entry"
          echo "ORCA_GEMINI_CLI=$entry" >> "$GITHUB_ENV"

      - name: Run the acceptance tests
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec vitest run packages/cli/test/gemini-acp-acceptance-705.test.ts \
            --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/acceptance.json"
          # The suite is skipped without the CLI; here every test has to have run.
          node -e '
            const r = require(process.argv[1]);
            if (r.numTotalTests === 0 || r.numPendingTests > 0 || r.numPassedTests !== r.numTotalTests)
              throw new Error(`expected every acceptance test to run and pass: ${JSON.stringify({total: r.numTotalTests, passed: r.numPassedTests, skipped: r.numPendingTests})}`);
          ' "$RUNNER_TEMP/acceptance.json"
