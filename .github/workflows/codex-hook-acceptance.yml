# ORCA's pre-tool hook in Codex (#705) against the real Codex ACP adapter and the Codex it
# depends on, pinned below. A scripted local stand-in for the OpenAI Responses API answers for
# the model, so the run needs no account, key or secret and costs nothing. It observes on the
# installed Codex what the unit tests cannot: ORCA's hook is trusted and runs on every shell
# call and patch, an ORCA allow runs, a deny or an ask does not, a revoked grant blocks the
# next call, and the Codex behaviours ORCA's answers are built around (exit 1 and a silent
# exit 2 let a call through; typed stdin is never shown to a hook).
#
# CODEX_ADAPTER_VERSION and CODEX_VERSION are the one pair ORCA has verified; ORCA installs
# the hook with that pair only, and only on Linux (CODEX_HOOK_VERIFIED_PAIRS and
# CODEX_HOOK_VERIFIED_PLATFORMS in packages/agents/src/native-tool-hook-session.ts; the suite
# fails if they disagree). Before creating the session, ORCA finds the Codex process the
# adapter started among the agent's own processes and hashes the image it runs against the
# digest pinned for that adapter, so the run also points the adapter at another Codex
# (OTHER_CODEX_VERSION, via CODEX_PATH) and checks that session is refused. The suite reads
# the pinned digest off the running process, so bumping CODEX_VERSION without repinning the
# digest fails here. Moving to another pair is a reviewed change to both. A weekly run sees a
# change in behaviour behind the pins.
name: Codex hook acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - packages/agents/src/claude-pre-tool-hook.ts
      - packages/agents/src/native-tool-hook-session.ts
      - packages/agents/src/codex-image.ts
      - packages/agents/src/bin/claude-pre-tool-hook.ts
      - packages/agents/src/bin/hook-output-guard.ts
      - packages/agents/test/fixtures/hook-output-guard/**
      - packages/agents/src/acp-session.ts
      - packages/agents/src/permissions.ts
      - packages/cli/src/bootstrap.ts
      - packages/cli/test/codex-hook-acceptance-705.test.ts
      - packages/cli/test/codex-model-stand-in.ts
      - .github/workflows/codex-hook-acceptance.yml
  schedule:
    - cron: "37 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codex-hook-acceptance-${{ github.ref }}
  cancel-in-progress: true

env:
  CODEX_ADAPTER_VERSION: 2.9.0
  CODEX_VERSION: 0.171.0
  OTHER_CODEX_VERSION: 0.170.0

jobs:
  linux:
    name: codex hook acceptance (linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: Install the pinned Codex ACP adapter and Codex outside the workspace
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/codex-adapter"
          mkdir -p "$d"
          cd "$d"
          npm init -y >/dev/null
          npm install --no-audit --no-fund --ignore-scripts \
            "@agentclientprotocol/codex-acp@${CODEX_ADAPTER_VERSION}" "@openai/codex@${CODEX_VERSION}"
          test "$(node -p 'require("@openai/codex/package.json").version')" = "$CODEX_VERSION"
          entry="$d/node_modules/@agentclientprotocol/codex-acp/dist/index.js"
          test -f "$entry"
          echo "ORCA_CODEX_ADAPTER=$entry" >> "$GITHUB_ENV"

      - name: Install a Codex the adapter is not paired with
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/codex-other"
          mkdir -p "$d"
          cd "$d"
          npm init -y >/dev/null
          npm install --no-audit --no-fund --ignore-scripts \
            "@openai/codex-linux-x64@npm:@openai/codex@${OTHER_CODEX_VERSION}-linux-x64"
          bin="$d/node_modules/@openai/codex-linux-x64/vendor/x86_64-unknown-linux-musl/bin/codex"
          test "$("$bin" --version)" = "codex-cli ${OTHER_CODEX_VERSION}"
          echo "ORCA_CODEX_OTHER_RUNTIME=$bin" >> "$GITHUB_ENV"

      - name: Run the acceptance tests
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec vitest run packages/cli/test/codex-hook-acceptance-705.test.ts \
            --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/acceptance.json"
          # The suite is skipped without the adapter; here every test has to have run.
          node -e '
            const r = require(process.argv[1]);
            if (r.numTotalTests === 0 || r.numPendingTests > 0 || r.numPassedTests !== r.numTotalTests)
              throw new Error(`expected every acceptance test to run and pass: ${JSON.stringify({total: r.numTotalTests, passed: r.numPassedTests, skipped: r.numPendingTests})}`);
          ' "$RUNNER_TEMP/acceptance.json"
