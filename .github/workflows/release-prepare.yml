# Closing a milestone proposes the release it represents: this opens a `release: vX.Y.Z`
# pull request that bumps the version and renders the `changelog.d/` fragments into a dated
# CHANGELOG section, deleting them — `git commit -am` below carries those deletions.
#
# It deliberately stops at a pull request rather than tagging. Closing a milestone is
# reversible and easy to do by accident; a published tag and GitHub release is neither.
# Merging the PR is the irreversible step, and release-publish.yml takes it from there.
#
# The version comes from the `release:*` labels on the milestone's issues (highest wins),
# or from a `Release: vX.Y.Z` line in the milestone description, which overrides them —
# that is how a release candidate or a deliberate 1.0.0 is expressed. See docs/RELEASING.md.
#
# Where it is cut from (docs/RELEASING.md, "Release lines"): every release of `X.Y` from its
# release line branch `release/X.Y`, so work merged to `main` for the next minor never ships in
# it. The line is named by the pin, else by a milestone title that is a version (`0.9.0`,
# `0.8.1`), else by the next version of `main`. A missing line is created: for a new minor or
# major (`X.Y.0` or its candidate) from `main`'s head, which is the cut that lets `main` take the
# next minor's work at once; for a patch from the newest `vX.Y.*` final tag. A patch milestone
# holding a `release:minor` or `release:major` issue is refused.
#
# A dispatch with `dry_run` rehearses exactly that decision (tools/release-plan.js) for any
# milestone, open or closed, and reports it in the job summary: no branch is cut or pushed and
# no pull request is opened.
#
# With the variable ORCA_RELEASE_APP_ID and the secret ORCA_RELEASE_APP_PRIVATE_KEY set in the
# main-only `release-bot` environment (a GitHub App with contents and pull-requests write), the
# branch and pull request are
# made with the App's token, so CI and the release line guard run on the pull request; a line
# branch that requires those checks cannot merge a release pull request opened without it.
name: Release (prepare)

on:
  milestone:
    types: [closed]
  workflow_dispatch:
    inputs:
      milestone:
        description: "Milestone number to release"
        required: true
        type: string
      dry_run:
        description: "Rehearse: resolve the version, its line and any cut, and write nothing"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: read

jobs:
  prepare:
    name: propose a release
    runs-on: ubuntu-24.04
    # The optional release App's key lives in this environment, which only main may deploy to
    # (no reviewers); a milestone event and a dispatch from main both run on main.
    environment: release-bot
    steps:
      - name: Release bot token (optional)
        id: app
        if: ${{ vars.ORCA_RELEASE_APP_ID != '' }}
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ vars.ORCA_RELEASE_APP_ID }}
          private-key: ${{ secrets.ORCA_RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app.outputs.token || github.token }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # tools/release.js has no dependencies, so no install step is needed here.
      #
      # Without the release App's token, CI will NOT run on the pull request this opens:
      # GitHub does not start a workflow from an event created with GITHUB_TOKEN. That is
      # one reason release-publish.yml re-runs every check itself before it tags anything.
      - name: Resolve the version from the milestone
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.milestone.number || inputs.milestone }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          set -euo pipefail
          milestone=$(gh api "repos/$REPO/milestones/$NUMBER")
          title=$(jq -r '.title' <<<"$milestone")
          open=$(jq -r '.open_issues' <<<"$milestone")
          description=$(jq -r '.description // ""' <<<"$milestone")

          if [ "$open" != "0" ]; then
            if [ "$DRY_RUN" = true ]; then
              echo "::warning::milestone #$NUMBER ($title) still has $open open issue(s); a real run refuses until they are closed or moved"
            else
              echo "::error::milestone #$NUMBER ($title) still has $open open issue(s); close or move them first"
              exit 1
            fi
          fi

          # Pull requests come back from this endpoint too; only issues carry the labels.
          issues=$(gh api --paginate "repos/$REPO/issues?milestone=$NUMBER&state=all&per_page=100" \
            --jq '.[] | select(.pull_request == null) | {number, title, labels: [.labels[].name]}' | jq -s '.')
          labels=$(jq -r '[.[].labels[]] | join(" ")' <<<"$issues")

          # Highest bump wins. An issue with no release:* label counts as release:none and
          # is listed in the PR body, so an under-bump is visible rather than silent.
          bump=none
          case " $labels " in *" release:patch "*) bump=patch ;; esac
          case " $labels " in *" release:minor "*) bump=minor ;; esac
          case " $labels " in *" release:major "*) bump=major ;; esac

          pin=$(grep -oiE 'release:[[:space:]]*v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?' <<<"$description" \
            | head -1 | sed -E 's/.*:[[:space:]]*v?//' || true)

          # The whole decision first, from main's tooling and the repository's refs, with nothing
          # written: the version, its line, and whether the line is cut (tools/release-plan.js).
          # A candidate is finalized by its own bump (0.9.0-rc.1 + minor is 0.9.0), and a new
          # minor is never cut while an older minor's line is still stabilizing its .0.
          tools="$RUNNER_TEMP/release-tools"
          mkdir -p "$tools"
          cp tools/release.js tools/release-lane.js tools/release-plan.js tools/changelog.js tools/release-pr-body.js "$tools/"
          if ! node "$tools/release-plan.js" plan --bump "$bump" --pin "$pin" --title "$title" > "$RUNNER_TEMP/plan"; then
            cat "$RUNNER_TEMP/plan"
            exit 1
          fi
          version=$(sed -n 's/^version=//p' "$RUNNER_TEMP/plan")
          base=$(sed -n 's/^base=//p' "$RUNNER_TEMP/plan")
          cut=$(sed -n 's/^cut=//p' "$RUNNER_TEMP/plan")
          from=$(sed -n 's/^from=//p' "$RUNNER_TEMP/plan")

          if [ "$(node -p 'Number(process.argv[1].split(/[.-]/)[2])' "$version")" != 0 ]; then
            # Patch content is the line's: no issue meant for the next minor or major.
            bumps=$(jq -r '[.[] | select(.labels | any(. == "release:minor" or . == "release:major"))
              | "#\(.number) \(.title)"] | join(", ")' <<<"$issues")
            if [ -n "$bumps" ]; then
              echo "::error::milestone #$NUMBER ($title) is a $base patch but holds minor/major work: $bumps; move it to the next minor's milestone"
              exit 1
            fi
          fi
          {
            echo "### Release plan"
            echo "- milestone #$NUMBER ($title): v$version from \`$base\` (bump=$bump${pin:+, pinned $pin})"
            if [ -n "$cut" ]; then echo "- \`$base\` does not exist yet: it is cut from \`$cut\` at \`$from\`"; fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$DRY_RUN" = true ]; then
            echo "Dry run: nothing pushed, no line cut, no pull request opened." >> "$GITHUB_STEP_SUMMARY"
            echo "dry_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -n "$cut" ]; then
            git push origin "$from:refs/heads/$base"
            git fetch -q origin "$base"
            echo "::notice title=release line cut::$base created from $cut at $from"
          fi
          # Only a protected line is a release source (tools/release-lane.js).
          node "$tools/release-lane.js" verify "$(git rev-parse "refs/remotes/origin/$base")" "$version" >/dev/null
          git checkout -q --detach "refs/remotes/origin/$base"
          if [ "$(node "$tools/release.js" version --bump "$bump" ${pin:+--pin "$pin"})" != "$version" ]; then
            echo "::error::$base moved while this ran: its package.json no longer gives v$version"
            exit 1
          fi
          unlabelled=$(jq -r '[.[] | select([.labels[] | select(startswith("release:"))] | length == 0)
            | "- #\(.number) \(.title)"] | join("\n")' <<<"$issues")

          {
            echo "version=$version"
            echo "base=$base"
            echo "tools=$tools"
            echo "bump=$bump"
            echo "pin=$pin"
            echo "title=$title"
            echo "unlabelled<<EOF"
            echo "$unlabelled"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "milestone #$NUMBER ($title) -> v$version from $base (bump=$bump${pin:+, pinned})" >> "$GITHUB_STEP_SUMMARY"

      - name: Bump the version and render the changelog fragments
        if: steps.resolve.outputs.dry_run != 'true'
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
          TOOLS: ${{ steps.resolve.outputs.tools }}
        run: node "$TOOLS/release.js" prepare "$VERSION"

      - name: Open the release pull request
        if: steps.resolve.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          BASE: ${{ steps.resolve.outputs.base }}
          TOOLS: ${{ steps.resolve.outputs.tools }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.milestone.number || inputs.milestone }}
          VERSION: ${{ steps.resolve.outputs.version }}
          BUMP: ${{ steps.resolve.outputs.bump }}
          PIN: ${{ steps.resolve.outputs.pin }}
          MILESTONE_TITLE: ${{ steps.resolve.outputs.title }}
          UNLABELLED: ${{ steps.resolve.outputs.unlabelled }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Build the body before anything is pushed, so a failure here leaves no branch behind.
          # tools/release-pr-body.js keeps it under GitHub's 65,536-character limit by linking
          # to CHANGELOG.md on the branch when the notes are too long to inline.
          node "$TOOLS/release.js" notes "$VERSION" > /tmp/release-notes.md

          # A final (no prerelease suffix) is compared with its newest release candidate tag,
          # so code that merged after the candidate shows in the body before anyone merges
          # (#863).
          DRIFT_SINCE=""
          base="${VERSION%%-*}"
          if [ "$VERSION" = "$base" ]; then
            DRIFT_SINCE=$(git tag -l "v$base-rc.*" --sort=-v:refname | head -n 1)
          fi
          # No stale output: release-pr-body.js refuses a missing file rather than reading it
          # as "nothing changed", and a failed diff stops this step (set -e).
          rm -f /tmp/drift.txt
          if [ -n "$DRIFT_SINCE" ]; then
            # The same paths as DRIFT_PATHS in tools/release-pr-body.js: sources, manifests,
            # the lockfile, root build config and desktop packaging. HEAD is the base branch
            # before the bump commit.
            git diff --stat=200,150 "$DRIFT_SINCE" HEAD -- packages/ workflows/ templates/ package.json \
              pnpm-lock.yaml pnpm-workspace.yaml patches/ 'tsconfig*.json' release-compatibility.json \
              .github/workflows/desktop.yml > /tmp/drift.txt
          fi
          export DRIFT_SINCE DRIFT_FILE=/tmp/drift.txt
          node "$TOOLS/release-pr-body.js" /tmp/release-notes.md > /tmp/pr-body.md

          git switch -c "release/v$VERSION"
          git commit -am "release: v$VERSION"
          git push --set-upstream origin "release/v$VERSION"

          gh pr create --base "$BASE" --head "release/v$VERSION" \
            --title "release: v$VERSION" --body-file /tmp/pr-body.md --label release
