# Temporary (#882): fetch the pinned Debian TTFs the Linux type-proof control is built from,
# so the control can be rebuilt for a new declared glyph. Removed before merge.
name: tmp proof control sources
on:
  push:
    branches: [claude/project-thread-orjt7g]
    paths: [.github/workflows/tmp-proof-control-sources.yml]
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download and verify
        run: |
          set -euo pipefail
          mkdir -p ttf work
          fetch() { # package version binary
            local url
            for url in \
              "https://deb.debian.org/debian/pool/main/${1:0:1}/$1/$3_$2_all.deb" \
              "https://snapshot.debian.org/archive/debian/20230601T000000Z/pool/main/${1:0:1}/$1/$3_$2_all.deb" \
              "https://snapshot.debian.org/archive/debian/20210601T000000Z/pool/main/${1:0:1}/$1/$3_$2_all.deb"; do
              if curl -fsSL -o "work/$3.deb" "$url"; then echo "fetched $url"; dpkg-deb -x "work/$3.deb" work/x; return 0; fi
            done
            return 1
          }
          fetch fonts-dejavu 2.37-8 fonts-dejavu-core
          fetch fonts-dejavu 2.37-8 fonts-dejavu-mono || true
          fetch fonts-noto 20201225-2 fonts-noto-core
          for f in DejaVuSans.ttf DejaVuSans-Bold.ttf DejaVuSansMono.ttf DejaVuSansMono-Bold.ttf NotoSansSymbols2-Regular.ttf; do
            find work/x -name "$f" -exec cp {} ttf/ \;
          done
          sha256sum ttf/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: proof-control-sources
          path: ttf/
          retention-days: 1
