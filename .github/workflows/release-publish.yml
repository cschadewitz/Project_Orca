# Merging a `release` pull request (the one release-prepare.yml opened, into its release line
# `release/X.Y`, a new minor's and its candidates' included) tags the merge commit and
# publishes the GitHub release.
#
# The checks run again here rather than trusting the PR's green run: what gets tagged is
# the merge commit, which no CI run has seen, and a release nobody built from the tagged
# tree is worth nothing. The release body is the CHANGELOG section for the version, with
# GitHub's generated list of merged pull requests appended under it.
#
# Three jobs, in order, because the artifacts have to exist before the release does. `check`
# is the verification that used to be the whole workflow; `desktop` builds the app for the
# three platforms and the daemon beside it, from the same merge commit, so the daemon inside
# the desktop artifact and the daemon on the release page are one build; `publish` tags and
# attaches (a final only drafts, with the Ubuntu .deb, until a maintainer attaches the signed
# Windows installer and publishes it: docs/RELEASING.md "Publishing a final"); `server-bundle`
# then dispatches the signed headless server bundle for the same commit (#876). A platform runner failing therefore means no tag, which is the right way round —
# a published release with two of three artifacts is not a thing that can be fixed forward.
#
# `workflow_dispatch` is the fix-forward path. When this workflow fails after the release
# pull request has merged, `main` carries the version bump and the changelog section with
# no tag against them, and nothing will ever merge a second `release: vX.Y.Z` pull request
# for the same version. Re-running the failed run does not help either: a re-run uses the
# workflow files of the commit it first ran on, so a fix to the workflows never reaches it.
# Dispatching against a ref publishes whatever version that ref's package.json holds, from
# that ref, through the same three jobs — the only thing that changes is which commit is
# tagged. The "tag already exists" checks below are what keep a stray dispatch from
# publishing anything twice.
#
# `dry_run` rehearses all of it without releasing anything (#863, after T3 Code's preview
# train). The same checks, builds, smoke and type proof run against any ref, and the
# artifacts are checked as release assets of version `vX.Y.Z-dryrun.<run number>`. Nothing
# is tagged, published or marked latest, no release or draft is created (so nothing needs
# cleaning up; the files stay in the run's artifacts), no feed is touched, and the "tag
# already exists" refusal does not apply, so it can rehearse a version already released.
#
# The rehearsed ref is untrusted, so it never meets a write token. The workflow's token is
# read-only; every job that runs the ref's code (verify, and the desktop and app-smoke calls)
# checks out without persisted credentials, verify and both calls pick runners with this
# workflow revision's tooling, and a rehearsal runs GitHub-hosted only, without the runner
# health endpoint. The release's identity (commit and version) and its authorization come
# only from `check`, which stays GitHub-hosted and runs none of the ref's code; `verify`,
# which may run on a self-hosted runner, only passes or fails. A rehearsal writes nothing:
# its last job, `rehearsal`, checks out this workflow's own revision (which must be the default branch), runs only that revision's tooling, and
# treats the built artifacts and the version as data. `publish`, the real release, keeps its write grant to
# itself and runs the released commit's tooling only once `check` has proved that commit is
# on the default branch, i.e. reviewed, and `verify` has passed it.
name: Release (publish)

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      ref:
        description: "The branch or commit to verify, build and tag. Its package.json names the version."
        required: true
        type: string
        default: main
      dry_run:
        description: "Rehearse only: build and check everything; never create a release, tag, publish or feed."
        required: false
        type: boolean
        default: false

concurrency:
  group: release-publication
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Release identity and authorization stay GitHub-hosted: this job resolves the exact commit,
  # checks it is reviewed on its lane, and reads and validates the version. Every later job,
  # and every job that holds a write grant or dispatches, takes the commit and the version from
  # here and only from here. It runs none of the ref's code.
  check:
    name: release identity
    # checks: read, for the release line check's result on a release pull request's head.
    permissions:
      contents: read
      checks: read
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged && contains(github.event.pull_request.labels.*.name, 'release'))
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      # Before any of the ref's code runs: a rehearsal's writer trusts only the workflow
      # revision it was dispatched from, so that revision must be the default branch.
      - name: A dry run is dispatched from the default branch
        if: ${{ inputs.dry_run }}
        env:
          REF: ${{ github.ref }}
          DEFAULT: refs/heads/${{ github.event.repository.default_branch }}
        run: |
          if [ "$REF" != "$DEFAULT" ]; then
            echo "::error::dispatch a dry run with the workflow from $DEFAULT (it was $REF); its ref input may be anything"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      # Resolved once, here, and passed to the jobs below by SHA rather than by name: a
      # dispatch says `main`, and `main` can move while the desktop runners are still
      # building. Every job has to check out, build and tag the same commit.
      - name: The commit being released
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # A real release runs the released commit's own tooling with a write token (the
      # `publish` job), so that commit must already be reviewed, from the one lane its version
      # may come from (tools/release-lane.js, read from main, not from the commit): its
      # protected line `release/X.Y`, for a new minor as for a patch (docs/RELEASING.md
      # "Release lines"). It is dispatched with main's workflow. Any commit on its lane
      # qualifies, which keeps the fix-forward path open. A merged release pull request must
      # also be the release preparation the guard passed, merged exactly as reviewed. A dry
      # run may rehearse anything, because its writer runs none of the ref's code.
      - name: A real release builds a reviewed commit from its lane
        if: ${{ !inputs.dry_run }}
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SHA: ${{ steps.sha.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::dispatch a release with the workflow from $DEFAULT_BRANCH (it was $REF)"
            exit 1
          fi
          policy="$RUNNER_TEMP/release-lane.js"
          git show "refs/remotes/origin/$DEFAULT_BRANCH:tools/release-lane.js" > "$policy"
          version=$(git show "$SHA:package.json" | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::package.json version is not a semver version; nothing built"
            exit 1
          fi
          if ! node "$policy" verify "$SHA" "$version" > "$RUNNER_TEMP/lane"; then
            cat "$RUNNER_TEMP/lane"
            exit 1
          fi
          read -r lane _ < "$RUNNER_TEMP/lane"
          if [ "$EVENT" = "pull_request" ]; then
            node "$policy" release-pr "$GITHUB_EVENT_PATH" "$SHA"
          fi
          echo "releasing $SHA (v$version) from $lane"
          echo "Released v$version from \`$lane\`." >> "$GITHUB_STEP_SUMMARY"

      # A dry run skips the gate above, so it would never show that a candidate or final is
      # accepted from its line (#1240 review). This reports what the gate would say about the
      # rehearsed ref, with main's policy, and never fails the rehearsal.
      - name: Rehearse the lane gate (report only)
        if: ${{ inputs.dry_run }}
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SHA: ${{ steps.sha.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          policy="$RUNNER_TEMP/release-lane.js"
          git show "refs/remotes/origin/$DEFAULT_BRANCH:tools/release-lane.js" > "$policy"
          version=$(git show "$SHA:package.json" | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "lane gate: package.json version is not semver" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          result=$(node "$policy" rehearse "$SHA" "$version" || echo "lane gate: could not be rehearsed")
          echo "$result"
          echo "Rehearsed $result" >> "$GITHUB_STEP_SUMMARY"
          case "$result" in *"would refuse"*) echo "::warning::$result" ;; esac

      # Read once, here, and passed to every job below, so that the version the desktop
      # artifacts are stamped with and the version that gets tagged cannot disagree.
      - name: The version being released
        id: version
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          version=$(node -p 'require("./package.json").version')
          # The ref's package.json is data: anything but a plain semver stops here, before it
          # reaches a release name, a tag or another job.
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::package.json version is not a semver version; nothing built"
            exit 1
          fi
          if [ "$DRY_RUN" = "true" ]; then
            # A distinct version, so nothing built here can be mistaken for the real one.
            version="${version%%-*}-dryrun.$GITHUB_RUN_NUMBER"
            echo "dry run: rehearsing as v$version; nothing will be tagged or published"
          elif git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::tag v$version already exists; nothing published"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # Chooses where `verify` runs: Tyler's self-hosted runners when one is idle, GitHub-hosted
  # otherwise (tools/linux-runner.js, as app-smoke and desktop pick), with this workflow
  # revision's tooling. Only a trusted workflow source gets the health endpoint: a real
  # release dispatched from the default branch, or a merged release pull request, and only
  # after `check` has authorized the commit. A rehearsal's ref may be any branch, so it stays
  # hosted. Set the repository variable CI_FORCE_HOSTED to `true` to skip the self-hosted runners.
  runner:
    name: pick Linux runner
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
    steps:
      # The workflow's own commit, not the released ref: the code that picks a runner is never
      # the code being released.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: tools
          persist-credentials: false

      - id: pick
        env:
          FORCE_HOSTED: ${{ !((github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && !inputs.dry_run) || (github.event_name == 'pull_request' && github.event.pull_request.merged)) && 'true' || vars.CI_FORCE_HOSTED }}
          HEALTH_URL: ${{ ((github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && !inputs.dry_run) || (github.event_name == 'pull_request' && github.event.pull_request.merged)) && secrets.CI_RUNNER_HEALTH_URL || '' }}
        run: node tools/linux-runner.js

  # The test work for the commit `check` pinned, where ci.yml's check runs. It returns only
  # pass or fail: it has no outputs, and nothing downstream reads anything it produced.
  verify:
    name: verify the merge commit
    needs: [check, runner]
    permissions:
      contents: read
    runs-on: ${{ fromJSON(needs.runner.outputs.runner) }}
    env:
      # ci.yml's worker cap and pnpm cache for the picked runner (docs/ci-runners.md): 20
      # workers and no Actions cache on the self-hosted runners, 2 and `cache: pnpm` hosted.
      WORKERS_CAP: ${{ contains(needs.runner.outputs.runner, 'tyler') && '20' || '2' }}
    steps:
      # The trusted event's own ref, exactly as `check` resolved it, never a value a job
      # produced. The next step requires it to be the commit `check` pinned: if a dispatched
      # branch moved in between, verification fails instead of testing another commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: The pinned commit is checked out
        env:
          SHA: ${{ needs.check.outputs.sha }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$SHA" ]; then
            echo "::error::checked out $(git rev-parse HEAD), not the release commit $SHA; dispatch again (with the commit SHA as ref to pin it)"
            exit 1
          fi

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # No automatic npm cache detected from the checked-out package.json (it may be a rehearsed ref's).
          package-manager-cache: false
          # A rehearsal's ref may be any branch and runs in the default branch's cache scope, so
          # it restores and saves no dependency cache; neither do the self-hosted runners.
          cache: ${{ !inputs.dry_run && !contains(needs.runner.outputs.runner, 'tyler') && 'pnpm' || '' }}

      # From here to the compiled smoke this is ci.yml's full path, in its order and with its
      # environment: the release PR never ran CI, so this is the only verification the tagged
      # tree gets, and a check that is weaker here than there is a check releases skip.
      # Coverage thresholds stay on main's CI run, the one place they are ratcheted.
      - name: Bound test workers
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          import { availableParallelism } from 'node:os';

          const workers = Math.min(Number(process.env.WORKERS_CAP) || 2, Math.max(1, availableParallelism() - 1));
          appendFileSync(process.env.GITHUB_ENV, `VITEST_MAX_WORKERS=${workers}\n`);
          console.log(`Vitest worker limit: ${workers} (available parallelism: ${availableParallelism()})`);
          NODE

      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - name: Typecheck
        run: pnpm run typecheck

      - name: Design tokens are current
        run: pnpm run design:check

      - name: Format
        run: pnpm run format:check

      # Single-threaded whatever the runner's ESLINT_CONCURRENCY says: each ESLint thread
      # builds its own typed-lint program, and a release check is worth more than its speed.
      - name: Lint
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          ESLINT_CONCURRENCY: "off"
        run: pnpm run lint

      # Before the tests: production MCP acceptance launches the emitted daemon and MCP entry
      # points, and refuses to run without them.
      - name: Build
        run: pnpm run build

      # The two opt-in cases the ordinary suite skips, run explicitly, and a green result with
      # a skip in it rejected. Kept identical to ci.yml's step of the same name.
      - name: Retry admission acceptance (CLI and ACP)
        timeout-minutes: 3
        env:
          ORCA_RETRY_INTEGRATION: "1"
        run: |
          pnpm exec vitest run \
            packages/cli/test/admission-retry-wiring.test.ts \
            packages/integrations/test/admission-retry-acp.test.ts \
            --maxWorkers="$VITEST_MAX_WORKERS" \
            --reporter=default --reporter=json \
            --outputFile.json="$RUNNER_TEMP/retry-acceptance.json"
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { join, relative } from 'node:path';

          const report = JSON.parse(readFileSync(join(process.env.RUNNER_TEMP, 'retry-acceptance.json'), 'utf8'));
          const expected = new Set([
            'packages/cli/test/admission-retry-wiring.test.ts',
            'packages/integrations/test/admission-retry-acp.test.ts',
          ]);
          const files = report.testResults ?? [];
          const ran = new Set(files.map((file) => relative(process.cwd(), file.name)));
          if (
            report.success !== true ||
            files.length !== expected.size ||
            [...expected].some((file) => !ran.has(file)) ||
            files.some((file) =>
              !file.assertionResults?.length || file.assertionResults.some((test) => test.status !== 'passed')) ||
            report.numTotalTests !== report.numPassedTests ||
            report.numPassedTests < expected.size
          ) {
            throw new Error('Retry acceptance requires both named test files to run with every test passing');
          }
          console.log(`Retry acceptance: ${report.numPassedTests} tests passed in both named files; none skipped`);
          NODE

      # Required, so a missing production MCP mount fails the release instead of skipping.
      - name: Test
        run: pnpm test
        env:
          ORCA_MCP_REQUIRE_PRODUCTION: "1"

      - name: Smoke test the compiled build
        run: node packages/cli/dist/main.js demo

  desktop:
    name: desktop artifacts
    # After verification passes, as before it moved: a failed candidate is never packaged.
    needs: [check, verify]
    uses: ./.github/workflows/desktop.yml
    with:
      ref: ${{ needs.check.outputs.sha }}
      version: ${{ needs.check.outputs.version }}
      # A rehearsal's ref may be any branch: hosted runners only, no health endpoint, and no
      # caches in the default branch's scope.
      hosted_only: ${{ inputs.dry_run == true }}
      caches: ${{ inputs.dry_run != true }}
    secrets:
      CI_RUNNER_HEALTH_URL: ${{ !inputs.dry_run && secrets.CI_RUNNER_HEALTH_URL || '' }}

  app-verification:
    name: desktop smoke and type proof
    # After verification passes, as before it moved: a failed candidate is never packaged.
    needs: [check, verify]
    uses: ./.github/workflows/app-smoke.yml
    with:
      ref: ${{ needs.check.outputs.sha }}
      # A rehearsal's ref may be any branch: never route it to the self-hosted runners, and
      # do not hand it the health endpoint.
      hosted_only: ${{ inputs.dry_run == true }}
      # Nor does it restore or save caches in the default branch's scope.
      caches: ${{ inputs.dry_run != true }}
      # A real release requires the upgrade launch check. A rehearsal of a ref from before
      # the check existed reports it as not applicable instead.
      upgrade_launch_required: ${{ !inputs.dry_run }}
    secrets:
      CI_RUNNER_HEALTH_URL: ${{ !inputs.dry_run && secrets.CI_RUNNER_HEALTH_URL || '' }}

  publish:
    name: tag and publish
    needs: [check, verify, desktop, app-verification]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # Flattened into one directory: the three legs upload disjoint file sets, so there is
      # nothing for `merge-multiple` to collide over.
      - name: Download the desktop artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          path: artifacts
          merge-multiple: true

      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.check.outputs.sha }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          version="$VERSION"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::tag v$version already exists; nothing published"
            exit 1
          fi

          # Windows builds occupy separate architecture directories. Flatten only after
          # checking collisions; metadata uses unique channel/architecture names.
          python3 tools/deploy/release-assets.py artifacts "$version"
          node tools/release.js notes "$version" > /tmp/notes.md

          # A final (no prerelease suffix) becomes "latest", so it must not offer anything
          # unsigned or unvalidated as the download. This build's Windows installers are
          # unsigned (the signed ones come from windows-signed.yml for this exact commit) and
          # only the Ubuntu amd64 .deb has native acceptance. So a final attaches the .deb
          # alone and stays a draft: no tag and nothing latest until a maintainer attaches the
          # verified signed installer and publishes it (docs/RELEASING.md, "Publishing a final").
          # Everything else this run built stays in its workflow artifacts.
          shopt -s nullglob
          final=true
          case "$version" in *-*) final=false ;; esac
          if [ "$final" = true ]; then
            debs=(artifacts/*-"$version"-linux-amd64.deb)
            if [ ${#debs[@]} -ne 1 ]; then
              echo "::error::expected exactly one Ubuntu amd64 .deb for $version, found ${#debs[@]}; nothing published"
              exit 1
            fi
            # GitHub allows several drafts for one version, and a draft's tag_name can read
            # back as a temporary `untagged-…` value, so drafts are found by title as well.
            # An earlier run's draft is reused or deleted by a maintainer after checking it,
            # never duplicated here.
            existing=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
              --jq ".[] | select(.draft and (.name == \"v$version\" or .tag_name == \"v$version\")) | .id")
            if [ -n "$existing" ]; then
              echo "::error::a draft for v$version already exists (release id(s) $(echo $existing)); check and reuse it (docs/RELEASING.md, \"Publishing a final\")"
              exit 1
            fi
            # Created through the API so the exact release id comes back from creation;
            # everything after works by that id, never by tag name. GitHub prepends the body
            # to its generated list of merged pull requests, as the prerelease path below does.
            id=$(jq -n --rawfile body /tmp/notes.md --arg tag "v$version" --arg sha "$SHA" \
              '{tag_name: $tag, target_commitish: $sha, name: $tag, body: $body, draft: true,
                prerelease: false, make_latest: "false", generate_release_notes: true}' \
              | gh api -X POST "repos/$GITHUB_REPOSITORY/releases" --input - --jq .id)
            if ! [[ "$id" =~ ^[0-9]+$ ]]; then
              echo "::error::creating the v$version draft returned no release id; check the releases list for a partial draft"
              exit 1
            fi
            deb="${debs[0]}"
            gh api -X POST -H "Content-Type: application/octet-stream" \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$id/assets?name=$(basename "$deb")" \
              --input "$deb" >/dev/null
            # Read the draft back by id: still a draft, the intended commit, exactly the .deb
            # with the digest of the file this run built.
            want="sha256:$(sha256sum "$deb" | cut -d' ' -f1)"
            check=$(gh api "repos/$GITHUB_REPOSITORY/releases/$id" --jq \
              "[.draft, .target_commitish == \"$SHA\", ([.assets[] | [.name, .digest]] == [[\"$(basename "$deb")\", \"$want\"]])] | map(tostring) | join(\" \")")
            if [ "$check" != "true true true" ]; then
              echo "::error::draft $id does not read back as a draft at $SHA with exactly the .deb ($check); not published"
              exit 1
            fi
            {
              echo "Drafted v$version as release id \`$id\` at \`$SHA\` with $(basename "$deb") (\`$want\`) only. Not tagged or published."
              echo "Next: Windows signed (spike) for \`$SHA\` (dispatched by the sign job when ORCA_RELEASE_AUTO_SIGN is on,"
              echo "otherwise from main by hand), its x64 installer attached to release $id, native acceptance and"
              echo "publication (docs/RELEASING.md, \"Publishing a final\")."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # The installers, the archives and the standalone daemon. Refusing to publish an
          # empty set is the point: a release page with no artifacts looks like a release
          # with nothing to download rather than like a workflow that lost them.
          assets=(artifacts/*)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "::error::the desktop workflow produced no artifacts; nothing published"
            exit 1
          fi
          printf 'attaching %s\n' "${assets[@]}"

          # A version with a prerelease suffix (0.2.0-rc.1) is published as a prerelease,
          # so it never becomes the repository's "latest".
          gh release create "v$version" --draft \
            --target "$SHA" \
            --title "v$version" \
            --notes-file /tmp/notes.md \
            --generate-notes \
            --prerelease \
            "${assets[@]}"

          gh release edit "v$version" --draft=false

          echo "Published [v$version](https://github.com/${{ github.repository }}/releases/tag/v$version)" \
            "with ${#assets[@]} artifacts." >> "$GITHUB_STEP_SUMMARY"

      # The private desktop feed is deliberately not fed from here: these are the ordinary,
      # unsigned Desktop builds. feed-publish.yml takes signed bytes for the tagged commit.

  # A final is staged unsigned; sign the same commit right away. release-attach-signed.yml
  # attaches the signed x64 installer to the draft when that run succeeds. This job checks
  # nothing out and can only dispatch.
  sign:
    name: dispatch Windows signing for the final
    needs: [check, publish]
    # Off unless ORCA_RELEASE_AUTO_SIGN is `true`. Dispatching does not bypass the signing
    # environment's own protection rules: those apply to the signed run either way.
    if: ${{ !inputs.dry_run && !contains(needs.check.outputs.version, '-') && (vars.ORRERY_RELEASE_AUTO_SIGN || vars.ORCA_RELEASE_AUTO_SIGN) == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Dispatch Windows signed (spike) for the release commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.check.outputs.sha }}
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::invalid release commit"; exit 1; }
          gh workflow run windows-signed.yml --repo "$GITHUB_REPOSITORY" --ref main -f source_sha="$SHA"
          echo "Dispatched Windows signed (spike) for \`$SHA\`." >> "$GITHUB_STEP_SUMMARY"

  # From the 0.8 line, every real release, final or rc, gets the signed headless server bundle (#876).
  # release-server-bundle.yml builds it from the same commit, signs it keylessly with its own
  # identity on main, checks it on a clean host and attaches it; a final cannot be published
  # without it (release-attach.sh publish). This job checks nothing out and can only dispatch.
  server-bundle:
    name: dispatch the signed server bundle
    needs: [check, publish]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Dispatch Release (server bundle) for the release commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.check.outputs.sha }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::invalid release commit"; exit 1; }
          # The bundle starts with the 0.8 line (SERVER_FROM in tools/deploy/release-attach.sh);
          # an earlier release keeps its approved desktop asset set.
          SERVER_FROM=0.8.0
          if [ "$(printf '%s\n%s\n' "$SERVER_FROM" "${VERSION%%-*}" | sort -V | head -n1)" != "$SERVER_FROM" ]; then
            echo "v$VERSION is before the server bundle's $SERVER_FROM line; nothing dispatched." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh workflow run release-server-bundle.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f version="$VERSION" -f source_sha="$SHA"
          echo "Dispatched Release (server bundle) for v$VERSION at \`$SHA\`." >> "$GITHUB_STEP_SUMMARY"

      # The Windows x64 server bundle (#1238, incubating) starts with the 0.9 line
      # (WIN_SERVER_FROM in tools/deploy/release-attach.sh). It is optional on a release: a final
      # publishes without it, never with part of it. Its own reconcile retries a missed dispatch.
      - name: Dispatch Release (Windows server bundle) for the release commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.check.outputs.sha }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::invalid release commit"; exit 1; }
          WIN_SERVER_FROM=0.9.0
          if [ "$(printf '%s\n%s\n' "$WIN_SERVER_FROM" "${VERSION%%-*}" | sort -V | head -n1)" != "$WIN_SERVER_FROM" ]; then
            echo "v$VERSION is before the Windows server bundle's $WIN_SERVER_FROM line; nothing dispatched." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh workflow run release-server-bundle-windows.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f version="$VERSION" -f source_sha="$SHA"
          echo "Dispatched Release (Windows server bundle) for v$VERSION at \`$SHA\`." >> "$GITHUB_STEP_SUMMARY"

  # A line's prerelease (X.Y.Z-rc.N) is published by `publish` itself, so main's record of it
  # is requested here; a final is only drafted here and Release (publish final) requests it
  # once the release is really published. Release (sync main) reads the published release back
  # before it changes anything. This job checks nothing out and can only dispatch.
  record-line-release:
    name: record a published line prerelease on main
    needs: [check, publish]
    if: ${{ !inputs.dry_run && contains(needs.check.outputs.version, '-') }}
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Dispatch Release (sync main)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: gh workflow run release-sync-main.yml --repo "$GITHUB_REPOSITORY" --ref main -f version="$VERSION"

  # The rehearsal's last step. It runs none of the rehearsed ref's code: it checks out this
  # workflow's own revision (the default branch, checked in `check`), takes the artifacts and
  # the version as data, and runs the same asset checks a release runs. It creates no release
  # and no draft, so there is nothing to tag, publish or clean up; the checked files stay in
  # this run's `desktop-*` artifacts. It keeps the workflow's read-only token.
  rehearsal:
    name: check the rehearsal's release assets
    needs: [check, verify, desktop, app-verification]
    if: ${{ inputs.dry_run }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download the desktop artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          path: artifacts
          merge-multiple: true

      - name: Check the rehearsal's release assets
        env:
          SHA: ${{ needs.check.outputs.sha }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-dryrun\.[0-9]+$ ]] || ! [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::not a dry-run version and commit; nothing checked"
            exit 1
          fi
          python3 tools/deploy/release-assets.py artifacts "$VERSION"
          shopt -s nullglob
          assets=(artifacts/*)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "::error::the desktop workflow produced no artifacts"
            exit 1
          fi
          {
            echo "Dry run v$VERSION of \`$SHA\`: ${#assets[@]} release assets checked. No release or draft was created;"
            echo "the files are in this run's \`desktop-*\` artifacts."
            printf -- '- %s\n' "${assets[@]#artifacts/}"
          } >> "$GITHUB_STEP_SUMMARY"
