# ORCA against the real GitHub Copilot CLI over ACP (#709), pinned below. Copilot's own
# bring-your-own-model mode points it at a scripted local stand-in for the model, so the run
# needs no GitHub account, Copilot plan, key or secret, and costs nothing. It observes on the
# installed Copilot what the unit tests cannot: the permission options Copilot offers, that a
# denied command does not run, that an "always" answer stays one call, that subagent commands
# are asked about, that cancel stops a running command, and that a "/allow-all on" prompt
# would turn every ask off if ORCA sent it.
#
# COPILOT_VERSION is the one version ORCA opens (COPILOT_CLI_VERIFIED_VERSIONS in
# packages/agents/src/providers/copilot-cli.ts; the suite fails if they disagree). Moving to
# another version is a reviewed change to both. Weekly runs catch a change in behaviour
# behind the same pin.
name: Copilot CLI acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - packages/agents/src/providers/**
      - packages/agents/src/acp-session.ts
      - packages/agents/src/permissions.ts
      - packages/agents/test/copilot-cli-acceptance-709.test.ts
      - packages/cli/src/bootstrap.ts
      - .github/workflows/copilot-cli-acceptance.yml
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: copilot-cli-acceptance-${{ github.ref }}
  cancel-in-progress: true

env:
  COPILOT_VERSION: 1.0.114

jobs:
  acceptance:
    name: copilot cli acceptance (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux x64
            os: ubuntu-24.04
            package: copilot-linux-x64
          - label: macos arm64
            os: macos-15
            package: copilot-darwin-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: Install the pinned Copilot CLI outside the workspace
        shell: bash
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/copilot-cli/$COPILOT_VERSION"
          mkdir -p "$d"
          cd "$d"
          npm init -y >/dev/null
          # The platform package alone: the executable, no loader and no install scripts.
          npm install --no-audit --no-fund --ignore-scripts "@github/${PACKAGE}@${COPILOT_VERSION}"
          bin="$d/node_modules/@github/${PACKAGE}/copilot"
          test -x "$bin"
          "$bin" --no-auto-update --version
          shasum -a 256 "$bin"
          echo "ORCA_COPILOT_CLI=$bin" >> "$GITHUB_ENV"

      - name: Run the acceptance tests
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec vitest run packages/agents/test/copilot-cli-acceptance-709.test.ts \
            --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/acceptance.json"
          # The suite is skipped without Copilot; here every test has to have run.
          node -e '
            const r = require(process.argv[1]);
            if (r.numTotalTests === 0 || r.numPendingTests > 0 || r.numPassedTests !== r.numTotalTests)
              throw new Error(`expected every acceptance test to run and pass: ${JSON.stringify({total: r.numTotalTests, passed: r.numPassedTests, skipped: r.numPendingTests})}`);
          ' "$RUNNER_TEMP/acceptance.json"
