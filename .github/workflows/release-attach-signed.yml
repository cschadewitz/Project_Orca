# Attach a final's signed Windows installers (x64 and arm64) to its staged draft, so nobody
# downloads and uploads them by hand.
#
# release-publish.yml stages a final as a draft with only the Ubuntu .deb and (with
# ORCA_RELEASE_AUTO_SIGN on) dispatches `Windows signed (spike)` for the same commit. When that
# signed run succeeds, its last job dispatches this with its run id (GitHub starts no
# `workflow_run` for a run the workflow token dispatched, so nothing here waits for one); this
# waits for that run to finish, then finds the single draft (not a prerelease) whose target is the
# commit it signed, re-checks both installers' Authenticode signature, timestamp and
# publisher (ORCA_FEED_PUBLISHER_CN), and uploads them to the draft by id. Before every write
# tools/deploy/release-attach.sh re-reads that exact draft (still a draft, same target and
# name, only the expected assets, no other record) and stops if it changed, so a draft
# published in the meantime is never written to. It records the run id and each installer's
# digest in the draft's notes as HTML comments, which feed-auto.yml uses to feed exactly these
# bytes once published. When it succeeds, it dispatches the x64 upgrade check and Release
# (accept Windows arm64), native acceptance of the attached arm64 installer (#889), for that
# draft. It never publishes, tags or touches the feed.
#
# The signing run is checked first (a successful windows-signed.yml run of this repository,
# dispatched from main, with exactly one unexpired signed artifact). The record is written
# before the upload. A reconcile every 6 hours (and a manual dispatch without a run id)
# re-dispatches the attach for any final draft still missing its installer or record, with
# the recorded run when there is one, and dispatches the arm64 acceptance for any draft still
# waiting for it, so an interrupted or displaced run recovers by itself.
# The automatic paths are off unless ORCA_RELEASE_AUTO_SIGN is `true`; a dispatch with a run id
# always works.
name: Release (attach signed installer)

on:
  schedule:
    - cron: "29 */6 * * *"
  workflow_dispatch:
    inputs:
      signed_run_id:
        description: Successful `Windows signed (spike)` run to attach (empty = reconcile all drafts)
        required: false
        default: ""

permissions:
  contents: read

jobs:
  attach:
    name: attach the signed installers to the draft
    # Shared with Release (publish final): an attachment and a publication never interleave.
    # A pending run displaced here loses nothing: the draft keeps its record (written before
    # the upload) and the reconcile below dispatches the attach again.
    concurrency:
      group: release-draft-writes
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
      actions: read
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.signed_run_id != '' &&
      github.ref == 'refs/heads/main'
    runs-on: windows-latest
    outputs:
      id: ${{ steps.attached.outputs.id }}
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RUN_ID: ${{ inputs.signed_run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Find the signed commit and its draft
        id: find
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "::error::invalid signed run id"; exit 1; }
          # The signing run dispatches this from its own last job, so wait for it to finish
          # (30 minutes at most); select then refuses anything but a successful run.
          bash tools/deploy/release-attach.sh wait-run "$RUN_ID"
          # stdout carries only the output assignments; notes go to stderr.
          bash tools/deploy/release-attach.sh select "$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download the signed build
        if: steps.find.outputs.id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ steps.find.outputs.artifact }}
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ github.token }}
          path: signed

      - name: Verify both installers' signatures, timestamps and publisher
        if: steps.find.outputs.id != ''
        shell: pwsh
        env:
          EXPECTED: ${{ vars.ORCA_FEED_PUBLISHER_CN }}
          VERSION: ${{ steps.find.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:EXPECTED) { throw 'ORCA_FEED_PUBLISHER_CN is not set' }
          foreach ($arch in 'x64', 'arm64') {
            $files = @(Get-ChildItem -Path signed -Recurse -File -Filter "ORCA-$($env:VERSION)-win-$arch.exe")
            if ($files.Count -ne 1) { throw "expected one ORCA-$($env:VERSION)-win-$arch.exe, found $($files.Count)" }
            $sig = Get-AuthenticodeSignature -LiteralPath $files[0].FullName
            $cn = if ($sig.SignerCertificate) { $sig.SignerCertificate.GetNameInfo('SimpleName', $false) } else { '' }
            "{0} {1} stamped={2} cn='{3}'" -f $arch, $sig.Status, [bool]$sig.TimeStamperCertificate, $cn
            if ($sig.Status -ne 'Valid' -or $cn -ne $env:EXPECTED -or -not $sig.TimeStamperCertificate) {
              throw "the $arch installer is not validly signed and timestamped by '$($env:EXPECTED)'"
            }
          }

      - name: Attach it to the draft by id, re-validating the draft before each write
        id: attached
        if: steps.find.outputs.id != ''
        env:
          ID: ${{ steps.find.outputs.id }}
          SHA: ${{ steps.find.outputs.sha }}
          VERSION: ${{ steps.find.outputs.version }}
        run: |
          set -euo pipefail
          file=$(find signed -type f -name "ORCA-$VERSION-win-x64.exe")
          arm_file=$(find signed -type f -name "ORCA-$VERSION-win-arm64.exe")
          bash tools/deploy/release-attach.sh attach "$ID" "$SHA" "$VERSION" "$RUN_ID" "$file" "$arm_file"
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "Next: the x64 upgrade check and arm64 acceptance run by themselves; native acceptance of the .deb, then publish (docs/RELEASING.md)." >> "$GITHUB_STEP_SUMMARY"

  # The attached installer's native upgrade check from the current Latest (#566). This job
  # checks nothing out and can only dispatch.
  upgrade-check:
    name: dispatch the upgrade check for the draft
    needs: attach
    if: needs.attach.outputs.id != ''
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Dispatch Release (upgrade check)
        env:
          GH_TOKEN: ${{ github.token }}
          ID: ${{ needs.attach.outputs.id }}
        run: |
          set -euo pipefail
          [[ "$ID" =~ ^[0-9]+$ ]] || { echo "::error::invalid release id"; exit 1; }
          gh workflow run release-upgrade-check.yml --repo "$GITHUB_REPOSITORY" --ref main -f release_id="$ID"
          echo "Dispatched Release (upgrade check) for release \`$ID\`." >> "$GITHUB_STEP_SUMMARY"

  # Native acceptance of the attached arm64 installer, dispatched rather than left to a
  # `workflow_run`, which GitHub does not start when the workflow token dispatched this run.
  # This job checks nothing out and can only dispatch.
  accept-arm64:
    name: dispatch the arm64 acceptance for the draft
    needs: attach
    if: needs.attach.outputs.id != ''
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Dispatch Release (accept Windows arm64)
        env:
          GH_TOKEN: ${{ github.token }}
          ID: ${{ needs.attach.outputs.id }}
        run: |
          set -euo pipefail
          [[ "$ID" =~ ^[0-9]+$ ]] || { echo "::error::invalid release id"; exit 1; }
          gh workflow run release-accept-arm64.yml --repo "$GITHUB_REPOSITORY" --ref main -f release_id="$ID"
          echo "Dispatched Release (accept Windows arm64) for release \`$ID\`." >> "$GITHUB_STEP_SUMMARY"

  reconcile:
    name: re-dispatch attachments still missing
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'schedule' && vars.ORCA_RELEASE_AUTO_SIGN == 'true') ||
       (github.event_name == 'workflow_dispatch' && inputs.signed_run_id == ''))
    runs-on: ubuntu-24.04
    concurrency:
      group: release-attach-reconcile
      cancel-in-progress: false
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Dispatch the attach for drafts missing an installer or record
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: bash tools/deploy/release-attach.sh reconcile

      # A fully attached draft whose x64 upgrade check never recorded a pass (a canceled or
      # failed run, or a Latest that changed since): run the check again, at most three times
      # per draft and never while one is waiting or running. Publication stays fail-closed.
      - name: Dispatch the upgrade check for drafts missing its record
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: bash tools/deploy/release-attach.sh upgrade-reconcile

      # A draft whose recorded arm64 installer is attached but not yet accepted (a failed,
      # canceled or displaced acceptance): accept the oldest one again. Does nothing otherwise.
      - name: Dispatch the arm64 acceptance for a draft still waiting for it
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release-accept-arm64.yml --repo "$GITHUB_REPOSITORY" --ref main
