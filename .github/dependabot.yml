# Grouped daily npm dependency bumps, so routine upgrades arrive as one PR per ecosystem.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development        
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      production-dependencies:
        dependency-type: production
        update-types:
          - "version-update:semver-patch"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
