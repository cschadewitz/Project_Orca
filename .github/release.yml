# Shapes the pull-request list GitHub generates for a release. release-publish.yml puts
# the hand-written CHANGELOG section first and lets this appear underneath it, so the
# release body reads as a summary followed by the full inventory.
changelog:
  exclude:
    labels: [release, duplicate, invalid, wontfix]
  categories:
    - title: Fixed
      labels: [bug]
    - title: Added and changed
      labels: [enhancement, design, planning]
    - title: Performance and refactoring
      labels: [performance, refactor]
    - title: Tests
      labels: [tests]
    - title: Documentation
      labels: [documentation]
    - title: Dependencies
      labels: [dependencies]
    - title: Other
      labels: ["*"]
