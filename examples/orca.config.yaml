# Example configuration - copy to your repository root as orca.config.yaml.
version: 1
storeDir: .orca # event logs, artifacts index, requests, work items

hosts:
  - id: local
    type: local
  - id: buildbox # remote agents over SSH (ACP over stdio through ssh -T)
    type: ssh
    host: build.internal
    user: ci
    identityFile: ~/.ssh/orca
    workspaceRoot: /srv/work

agents:
  - id: claude-local
    command: claude-code-acp # any ACP agent binary; args are passed through
    args: []
    hostId: local
    roles: [planner, designer, reviewer, decomposer]
    sessionMode: per-step
    # The defaults, written out. Leave `permissions:` off entirely and you get exactly this;
    # it is spelled out here because what an unattended agent may do is worth reading.
    # First match wins, and these rules come before the ones ORCA writes into
    # orca.permissions.json when someone answers a prompt with "always".
    permissions:
      default: ask # execute, the network, and anything outside the workspace: ask a person
      rules:
        - { match: { kind: execute, titlePattern: "rm -rf|git push --force" }, decision: deny } # never, not even on request
        - { match: { pathPrefix: /etc }, decision: deny }
        - { match: { kind: read, scope: workspace }, decision: allow } # scope: workspace | outside-workspace
        - { match: { kind: search, scope: workspace }, decision: allow }
        - { match: { kind: edit, scope: workspace }, decision: allow }
        - { match: { kind: delete, scope: workspace }, decision: allow }
        - { match: { kind: move, scope: workspace }, decision: allow } # both ends must be inside
        - { match: { kind: think }, decision: allow }
  - id: codex-remote
    # No `permissions:` block at all: the same defaults, applied silently. Write
    # `permissions: { default: allow }` instead to opt a sandboxed agent out of being asked.
    command: codex
    args: [acp]
    hostId: buildbox
    roles: [builder, tester, deployer]
    turnTimeoutMs: 1800000
    cancelGraceMs: 10000 # kill the agent if it ignores session/cancel this long
    mcpServers:
      - name: kepler-workspace # hand sub-agents the same MCP servers Kepler gives you
        command: kepler
        args: [mcp]

roles: # explicit overrides; otherwise first agent with the role wins
  reviewer: claude-local

workflows: ["workflows/**/*.yaml"]
templates: ["templates/**/*.md"]

program:
  workflow: program # accepts a Request, decomposes, plans, dispatches
  itemWorkflow: ai-sdlc # run per work item

planning: # long-term plan defaults (docs/PLANNING.md)
  plan: default # plan requests join unless `--var plan=<key>` says otherwise
  planName: Product roadmap
  policy:
    strategy: critical-path # critical-path | risk-first | most-dependents | fifo
    concurrency: 2
    riskAppetite: high # hold items whose open risk exceeds this until a human accepts it
    mitigateFirst: true # pull items that mitigate open risks forward
  riskMatrix:
    scale: 5 # likelihood and impact are 1..scale
    thresholds: { medium: 5, high: 10, critical: 16 } # optional, must be increasing; omitted ones follow the scale

workspace:
  provider: git-worktree # local | git-worktree | kepler
  repo: .
  baseBranch: main
  branchPrefix: orca/
  hostId: local

humanInput:
  # cli | auto | pause (default: pause = park the run; `orca answer <requestId> <option>` resumes it).
  # An agent `ask` permission cannot be parked: under `pause` it is cancelled, and under
  # `auto` it is refused unless `option:` names an id the agent offered. Nobody is there.
  mode: cli

plugins: [] # e.g. ["./plugins/jira.js"]
