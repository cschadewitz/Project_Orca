<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="1275" viewBox="0 0 1180 1275" role="img" aria-labelledby="title description">
<title id="title">System and process boundaries</title>
<desc id="description">Static architecture view. CLI/daemon process; Electron main/preload/renderer; agent subprocesses; local store; external services. Numbered arrows have full labels and source evidence in the table and linked specification.</desc>
<defs>
<marker id="arrow-call" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1559a1"/></marker>
<marker id="arrow-dependency" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#794b98"/></marker>
<marker id="arrow-message" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#21754a"/></marker>
<marker id="arrow-data" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#975523"/></marker>
<marker id="arrow-containment" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#656b73"/></marker>
<marker id="arrow-declared" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#a73d3d"/></marker>
</defs>
<rect width="100%" height="100%" fill="#fff"/>
<g font-family="sans-serif" fill="#17212c">
<text x="32" y="40" font-size="25" font-weight="bold">System and process boundaries</text>
<text x="32" y="70" font-size="16">Ownership view: repository • system • static inspection</text>
<a href="../../architecture/system.md"><text x="32" y="99" font-size="15" fill="#1559a1">Architecture specification, responsibilities and source evidence ↗</text></a>
<rect x="25" y="119" width="1130" height="646" rx="12" fill="#f9fafc" stroke="#9aa6b3"/>
<rect id="node-1" x="50" y="150" width="645" height="70" rx="9" fill="#fff2e8" stroke="#526171" stroke-width="1"/>
<text x="66" y="170" font-size="12" fill="#475666">N1 · EXTERNAL</text>
<text x="66" y="193" font-size="16">Human / CLI or ACP host</text>
<rect id="node-2" x="50" y="250" width="645" height="70" rx="9" fill="#e9f0ff" stroke="#526171" stroke-width="2"/>
<text x="66" y="270" font-size="12" fill="#475666">N2 · PROCESS</text>
<text x="66" y="293" font-size="16">CLI bootstrap + engine + daemon models</text>
<rect id="node-3" x="50" y="350" width="645" height="70" rx="9" fill="#e9f0ff" stroke="#526171" stroke-width="2"/>
<text x="66" y="370" font-size="12" fill="#475666">N3 · PROCESS</text>
<text x="66" y="393" font-size="16">Electron renderer → preload → main</text>
<rect id="node-4" x="50" y="450" width="645" height="70" rx="2" fill="#eff7ed" stroke="#526171" stroke-width="1"/>
<text x="66" y="470" font-size="12" fill="#475666">N4 · STORAGE</text>
<text x="66" y="493" font-size="16">Run logs, plan documents, artifacts</text>
<rect id="node-5" x="50" y="550" width="645" height="70" rx="9" fill="#fff2e8" stroke="#526171" stroke-width="1"/>
<text x="66" y="570" font-size="12" fill="#475666">N5 · EXTERNAL</text>
<text x="66" y="593" font-size="16">Local or SSH ACP agent</text>
<rect id="node-6" x="50" y="650" width="645" height="70" rx="9" fill="#fff2e8" stroke="#526171" stroke-width="1"/>
<text x="66" y="670" font-size="12" fill="#475666">N6 · EXTERNAL</text>
<text x="66" y="693" font-size="16">Optional TypeSafe JEV service</text>
<path d="M695,178 H783 V292 H698" fill="none" stroke="#1559a1" stroke-width="2" stroke-dasharray="" marker-end="url(#arrow-call)"/>
<circle cx="783" cy="235.0" r="13" fill="white" stroke="#1559a1"/><text x="783" y="240.0" text-anchor="middle" font-size="13" fill="#1559a1">1</text>
<path d="M695,378 H826 V292 H698" fill="none" stroke="#21754a" stroke-width="2" stroke-dasharray="3 5" marker-end="url(#arrow-message)"/>
<circle cx="826" cy="335.0" r="13" fill="white" stroke="#21754a"/><text x="826" y="340.0" text-anchor="middle" font-size="13" fill="#21754a">2</text>
<path d="M695,278 H869 V492 H698" fill="none" stroke="#975523" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow-data)"/>
<circle cx="869" cy="385.0" r="13" fill="white" stroke="#975523"/><text x="869" y="390.0" text-anchor="middle" font-size="13" fill="#975523">3</text>
<path d="M695,278 H912 V592 H698" fill="none" stroke="#21754a" stroke-width="2" stroke-dasharray="3 5" marker-end="url(#arrow-message)"/>
<circle cx="912" cy="435.0" r="13" fill="white" stroke="#21754a"/><text x="912" y="440.0" text-anchor="middle" font-size="13" fill="#21754a">4</text>
<path d="M695,278 H955 V692 H698" fill="none" stroke="#975523" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow-data)"/>
<circle cx="955" cy="485.0" r="13" fill="white" stroke="#975523"/><text x="955" y="490.0" text-anchor="middle" font-size="13" fill="#975523">5</text>
<text x="32" y="820" font-size="19" font-weight="bold">Labeled interfaces and movements</text>
<rect x="30" y="842" width="1120" height="62" rx="5" fill="#f5f7fa"/>
<text x="43" y="865" font-size="16" fill="#1559a1">1. N1 → N2: CLI commands or ACP prompt [call; source claim E1]</text>
<text x="43" y="888" font-size="13">Human / CLI or ACP host → CLI bootstrap + engine + daemon models</text>
<rect x="30" y="910" width="1120" height="62" rx="5" fill="#f5f7fa"/>
<text x="43" y="933" font-size="16" fill="#21754a">2. N3 → N2: HTTP RPC / WebSocket notifications [message; source claim E2]</text>
<text x="43" y="956" font-size="13">Electron renderer → preload → main → CLI bootstrap + engine + daemon models</text>
<rect x="30" y="978" width="1120" height="62" rx="5" fill="#f5f7fa"/>
<text x="43" y="1001" font-size="16" fill="#975523">3. N2 → N4: append, project and read [data; source claim E1]</text>
<text x="43" y="1024" font-size="13">CLI bootstrap + engine + daemon models → Run logs, plan documents, artifacts</text>
<rect x="30" y="1046" width="1120" height="62" rx="5" fill="#f5f7fa"/>
<text x="43" y="1069" font-size="16" fill="#21754a">4. N2 → N5: ACP turns; collect host files [message; source claim E4]</text>
<text x="43" y="1092" font-size="13">CLI bootstrap + engine + daemon models → Local or SSH ACP agent</text>
<rect x="30" y="1114" width="1120" height="62" rx="5" fill="#f5f7fa"/>
<text x="43" y="1137" font-size="16" fill="#975523">5. N2 → N6: JEV POST with selected input bodies [data; source claim E5]</text>
<text x="43" y="1160" font-size="13">CLI bootstrap + engine + daemon models → Optional TypeSafe JEV service</text>
<a href="../notation.md"><text x="32" y="1210" font-size="14" fill="#1559a1">Legend: blue calls · purple dashed dependencies · green dotted messages · brown data · gray containment · red declared</text></a>
<text x="32" y="1237" font-size="13">Outer frame = view ownership; external and process nodes retain their labeled boundaries. Not a deployment verification.</text>
</g>
</svg>
