<circle cx="869" cy="385.0" r="13" fill="white" stroke="#1559a1"/><text x="869" y="390.0" text-anchor="middle" font-size="13" fill="#1559a1">3</text>
<path d="M695,378 H912 V492 H698" fill="none" stroke="#1559a1" stroke-width="2" stroke-dasharray="" marker-end="url(#arrow-call)"/>
