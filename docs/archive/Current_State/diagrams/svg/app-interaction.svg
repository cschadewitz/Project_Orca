<text x="32" y="720" font-size="19" font-weight="bold">Labeled interfaces and movements</text>
<rect x="30" y="742" width="1120" height="62" rx="5" fill="#f5f7fa"/>
<text x="43" y="765" font-size="16" fill="#794b98">1. N1 → N2: compose reusable controls [dependency; source claim E3]</text>
<text x="43" y="788" font-size="13">Surface components → UI primitives + Menu + PaneSplitter</text>
<rect x="30" y="810" width="1120" height="62" rx="5" fill="#f5f7fa"/>
<text x="43" y="833" font-size="16" fill="#794b98">2. N1 → N3: render row windows [dependency; source claim E1]</text>
<text x="43" y="856" font-size="13">Surface components → VirtualList + viewport arithmetic</text>
<rect x="30" y="878" width="1120" height="62" rx="5" fill="#f5f7fa"/>
<text x="43" y="901" font-size="16" fill="#1559a1">3. N2 → N4: register scoped commands [call; source claim E2]</text>
<text x="43" y="924" font-size="13">UI primitives + Menu + PaneSplitter → KeyboardMap / layers / palette</text>
<rect x="30" y="946" width="1120" height="62" rx="5" fill="#f5f7fa"/>
<text x="43" y="969" font-size="16" fill="#1559a1">4. N3 → N4: register list navigation [call; source claim E1]</text>
<text x="43" y="992" font-size="13">VirtualList + viewport arithmetic → KeyboardMap / layers / palette</text>
<rect x="30" y="1014" width="1120" height="62" rx="5" fill="#f5f7fa"/>
<text x="43" y="1037" font-size="16" fill="#1559a1">5. N1 → N5: announce and persist choices [call; source claim E4]</text>
<text x="43" y="1060" font-size="13">Surface components → Shared announcements + preferences</text>
<a href="../notation.md"><text x="32" y="1110" font-size="14" fill="#1559a1">Legend: blue calls · purple dashed dependencies · green dotted messages · brown data · gray containment · red declared</text></a>
<text x="32" y="1137" font-size="13">Outer frame = view ownership; external and process nodes retain their labeled boundaries. Not a deployment verification.</text>
