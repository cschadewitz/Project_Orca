<rect width="100%" height="100%" fill="#fff"/>
<g font-family="sans-serif" fill="#17212c">
<text x="32" y="40" font-size="25" font-weight="bold">Claims, leases and filesystem exclusion</text>
<text x="32" y="70" font-size="16">Ownership view: packages/store • component • static inspection</text>
<a href="../../architecture/store-ownership.md"><text x="32" y="99" font-size="15" fill="#1559a1">Architecture specification, responsibilities and source evidence ↗</text></a>
<rect x="25" y="119" width="1130" height="546" rx="12" fill="#f9fafc" stroke="#9aa6b3"/>
<rect id="node-1" x="50" y="150" width="645" height="70" rx="9" fill="#fff" stroke="#526171" stroke-width="1"/>
<text x="66" y="170" font-size="12" fill="#475666">N1 · COMPONENT</text>
<text x="66" y="193" font-size="16">Dispatcher</text>
