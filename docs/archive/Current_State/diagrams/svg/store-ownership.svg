<text x="66" y="470" font-size="12" fill="#475666">N4 · STORAGE</text>
<text x="66" y="493" font-size="16">Renewable run lease + guarded write</text>
<rect id="node-5" x="50" y="550" width="645" height="70" rx="2" fill="#eff7ed" stroke="#526171" stroke-width="1"/>
<text x="66" y="570" font-size="12" fill="#475666">N5 · STORAGE</text>
<text x="66" y="593" font-size="16">Directory lock + owner token</text>
