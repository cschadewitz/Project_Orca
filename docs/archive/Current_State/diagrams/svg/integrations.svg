<text x="43" y="833" font-size="16" fill="#794b98">2. N3 → N1: implement workspace provider [dependency; source claim E1]</text>
<text x="43" y="856" font-size="13">Kepler provider → Engine extension contracts</text>
<rect x="30" y="878" width="1120" height="62" rx="5" fill="#f5f7fa"/>
<text x="43" y="901" font-size="16" fill="#794b98">3. N4 → N1: implement session contract via injected RPC [dependency; source claim E3]</text>
<text x="43" y="924" font-size="13">T3 Code session adapter → Engine extension contracts</text>
<rect x="30" y="946" width="1120" height="62" rx="5" fill="#f5f7fa"/>
<text x="43" y="969" font-size="16" fill="#794b98">4. N5 → N1: register custom executor [dependency; source claim E4]</text>
<text x="43" y="992" font-size="13">JEV evaluation plugin → Engine extension contracts</text>
<a href="../notation.md"><text x="32" y="1042" font-size="14" fill="#1559a1">Legend: blue calls · purple dashed dependencies · green dotted messages · brown data · gray containment · red declared</text></a>
<text x="32" y="1069" font-size="13">Outer frame = view ownership; external and process nodes retain their labeled boundaries. Not a deployment verification.</text>
