# electron-builder: the desktop artifact, one per platform, from `pnpm run build` output.
#
# Driven by `.github/workflows/desktop.yml`; `pnpm --filter @orca/app run package` runs the
# same thing locally for whatever platform you are on. electron-builder finds this file by
# name, so nothing passes it a `--config` and `-c.<path>=<value>` overrides stay usable.
# Prerequisites, in order:
#
#   pnpm install                              # *without* ELECTRON_SKIP_BINARY_DOWNLOAD
#   pnpm run build                            # tsc -b, then the renderer through Vite
#   pnpm --filter @orca/app run build:daemon  # dist/daemon/orca-daemon.mjs
#
# The version stamped into the artifacts is this package's `0.1.0` unless something
# overrides it. The workflow passes `--config.extraMetadata.version=<root version>`, because
# the repository releases in lockstep from the root package.json and the packages under
# packages/ do not carry the release version (docs/RELEASING.md).
# Approved bundle identity; Apple Team ID Q2FP9UY5T4 is documented in docs/RELEASING.md.
# This does not activate signing. Windows retains its installed identity below.
appId: com.schadewitz.orca
productName: ORCA
artifactName: "${productName}-${version}-${os}-${arch}.${ext}"
copyright: ORCA contributors

directories:
  # Inside dist/, which is already ignored by git, Prettier and ESLint, and removed by
  # `pnpm run clean`. `files` below never matches it, so it cannot package itself.
  output: dist/release
  buildResources: build

# What goes inside app.asar: the compiled output and the manifest. The sources, the tests and
# the Vite config are not under dist/ and so are never candidates; the two directories that
# are under it but must stay out are excluded by name below. electron-builder adds the
# production `dependencies` from package.json on top of this, resolving pnpm's symlinks.
#
# This is deliberately the whole of dist/ rather than a list of the parts. Listing
# `dist/main`, `dist/preload` and `dist/renderer` reads like the app's three halves and is
# wrong: main and preload also import `dist/bridge.js`, `dist/client/**` and
# `dist/preferences/**`, so an enumerated list shipped an asar whose main process threw
# ERR_MODULE_NOT_FOUND on first import. An allowlist here has to be re-derived every time a
# module moves, and nothing fails until the packaged app is actually launched.
files:
  - "dist/**/*"
  - "package.json"
  # The daemon is a subprocess, so it ships beside app.asar via extraResources below. A copy
  # in here would be 1.7 MB that can never be spawned.
  - "!dist/daemon"
  # electron-builder's own output directory (directories.output), which would package itself.
  - "!dist/release"
  # Architecture-specific native addons live outside asar, once per matching image.
  - "!dist/diagnostics-native"
  # Build artefacts of `tsc -b`: declarations and the incremental build state are for the
  # workspace, not for a user's disk.
  - "!**/*.d.ts"
  - "!**/*.tsbuildinfo"
  # Source maps are for the release page, not for every user's disk.
  - "!**/*.map"

# The daemon, beside app.asar rather than inside it. A file inside an asar archive is not a
# real file to the operating system, and the main process spawns this one as a subprocess
# (src/main/daemon-process.ts) — so it has to exist on disk. `process.resourcesPath` is
# where it lands, which is the first place `findBundledDaemon` looks.
extraResources:
  - from: dist/daemon
    to: daemon
    filter:
      - "**/*.mjs"

# Both architectures on every platform that has two. A desktop artifact that only runs on
# the architecture the runner happened to have is the bug this spells out to avoid: GitHub's
# macOS runners are arm64 and its Windows and Linux runners are x64.
linux:
  # The window icon, beside app.asar where the window manager can read it. The tar.gz is the
  # bare unpacked app with no launcher metadata, so this is the only icon its window has
  # (src/main/window-icon.ts). AppImage also carries it in its desktop entry.
  extraResources:
    - from: build/icon.png
      to: icon.png
  category: Development
  synopsis: Orchestration Runtime for Coding Agents
  # Named rather than derived: the package is `@orca/app`, and a scoped name is not a
  # thing a binary on `$PATH` can be called. Not plain `orca`: that is the GNOME screen
  # reader, which Ubuntu Desktop installs by default as package `orca` owning /usr/bin/orca
  # and orca.desktop (#853 review). Every Linux identity derived from this (the .deb's
  # /usr/bin link, AppArmor profile and desktop entry) is therefore `orca-desktop` too.
  executableName: orca-desktop
  target:
    # AppImage for x64 only. Building an arm64 AppImage on an x64 runner needs an arm64
    # appimagetool to run there, which is the one cross-build in this file that does not
    # come for free; arm64 Linux gets the archive, which is the same tree without the
    # single-file wrapper. Revisit when a native arm64 Linux runner is on the plan.
    - target: AppImage
      arch: [x64]
    - target: tar.gz
      arch: [x64, arm64]
    # The supported install on Ubuntu 24.04 and later (#853). Those releases restrict
    # unprivileged user namespaces through AppArmor, so Chromium's namespace sandbox cannot
    # start from an unpacked tree, and its SUID fallback needs `chrome-sandbox` owned by root
    # with mode 4755, which no download can carry. The package's install script, which runs
    # as root, loads an AppArmor profile that grants `userns` to /opt/ORCA/orca-desktop alone and
    # leaves the system-wide restriction on. The helper stays 0755 everywhere: the package
    # supports the namespace sandbox only, never the setuid one.
    - target: deb
      arch: [x64, arm64]

# Debian control fields. fpm will not build without a maintainer and a homepage; the name is
# lowercase because Debian package names must be, whatever productName says. Never `orca`:
# apt would take this package for a version of the screen reader and replace it. No
# Conflicts/Replaces/Provides either: the two install side by side.
deb:
  packageName: orca-desktop
  maintainer: ORCA contributors
  priority: optional
  # The repository's postinst, not electron-builder's: no setuid fallback for chrome-sandbox,
  # no redundant cache refreshes, and a clear refusal when the AppArmor exception cannot load
  # (the file says why). The postrm and the profile itself remain electron-builder's.
  afterInstall: build/linux/after-install.tpl

mac:
  extraResources:
    - from: ../../tools/deploy
      to: native/mac-validator/tools/deploy
      filter: ["native-mac-runtime.py", "native-mac-candidate.py", "native-mac-verify.py"]
    - from: ../../tools/packaged-mac
      to: native/mac-validator/tools/packaged-mac
      filter: ["native-containment.py", "archive-containment.py"]
    - from: "dist/diagnostics-native/darwin-${arch}"
      to: "native/diagnostics/darwin-${arch}"
      filter: ["diagnostics_clock.node", "diagnostics_storage.node", "manifest.json"]
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  # The ordinary lane is deliberately unsigned. Signing authority and protected execution
  # remain operator prerequisites; Forbidden metadata means unknown, not absent. Explicit
  # null prevents builder from selecting an incidental runner keychain identity.
  identity: null
  notarize: false

win:
  extraResources:
    - from: "dist/diagnostics-native/win32-${arch}"
      to: "native/diagnostics/win32-${arch}"
      filter: ["diagnostics_clock.node", "diagnostics_storage.node", "first_run_windows.node", "manifest.json"]
  # Preserve existing NSIS upgrade/uninstall GUID and shortcut AppUserModelID.
  # Changing this requires a separate Windows migration decision (docs/RELEASING.md).
  appId: dev.orca.desktop
  target:
    - target: nsis
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]

nsis:
  # Per-user, so the installer needs no elevation — which matters more than usual while the
  # binary is unsigned, since an unsigned installer asking for administrator is exactly the
  # thing a person should refuse.
  perMachine: false
  oneClick: false
  allowToChangeInstallationDirectory: true

# Nothing is published from here. `release-publish.yml` attaches the files to the GitHub
# release itself, after the same commit's checks have passed; letting electron-builder
# publish would mean giving three runners a token and three chances to publish half a set.
publish:
  provider: generic
  url: https://updates.invalid/
  channel: latest

# Explicit local addon build is required for Mac/Windows packaging. No network/build at hook time.
beforePack: ./scripts/diagnostics-native-package.js
afterPack: ./scripts/after-pack.js
