<!doctype html>
<!-- The renderer's entry document. Vite is the bundler (docs/DEVELOPMENT.md); the module
     below is the only script, and the stylesheets are imported from it so that tokens.css
     and components.css load ahead of anything that builds on them.

     The CSP here is the production one and it stays `default-src 'self'` with no
     `unsafe-inline`. The dev server rewrites it in memory — see `htmlPlugin` in
     ../vite.config.ts — and never touches this file.

     `data-theme` lives on <html> as docs/design/60-implementation.md requires. It is not
     written here: src/main.tsx sets it from the persisted preference before React mounts,
     and leaves it off when the preference is to follow the OS. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:"
    />
    <title>ORCA</title>
  </head>
  <body class="orca">
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
